# Development overrides for docker-compose.yml
services:
  # Backend API Development
  backend-api:
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8001
      Logging__LogLevel__Default: Debug
      Logging__LogLevel__Microsoft: Information
    volumes:
      - ./backend:/app
      - /app/bin
      - /app/obj
    command: ["dotnet", "watch", "--project", "src/Presentation/MathematicsSolver.WebAPI.csproj", "--urls", "http://0.0.0.0:8001"]
    stdin_open: true
    tty: true

  # ML Service Development
  llm-service:
    environment:
      PYTHONUNBUFFERED: 1
      LOG_LEVEL: DEBUG
      ENVIRONMENT: development
    volumes:
      - ./llmOCR:/app
      - /app/__pycache__
    command: ["python", "-m", "uvicorn", "src.api.main:app", "--host", "0.0.0.0", "--port", "8002", "--reload", "--log-level", "debug"]

  # Expo Development Server (enabled by default in dev)
  expo-dev:
    environment:
      NODE_ENV: development
      EXPO_DEVTOOLS_LISTEN_ADDRESS: 0.0.0.0
      REACT_NATIVE_PACKAGER_HOSTNAME: 0.0.0.0
      EXPO_PUBLIC_API_BASE_URL: http://10.0.2.2:8001/api  # Android emulator
      EXPO_PUBLIC_ENV: development
      EXPO_DEBUG: true
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.expo
    command: ["npx", "expo", "start", "--dev-client", "--clear", "--host", "lan"]

  # MySQL Development
  mysql:
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: mathematics_solver
      MYSQL_USER: mathsolver
      MYSQL_PASSWORD: password123
    volumes:
      - mysql_dev_data:/var/lib/mysql
      - ./backend/scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    ports:
      - "3306:3306"

  # Redis Development
  redis:
    volumes:
      - redis_dev_data:/data
    ports:
      - "6379:6379"

volumes:
  mysql_dev_data:
  redis_dev_data: