# Fast login flow for Mathematics Solver (optimized for speed)
# Usage: - runFlow: flows/fast-login-flow.yaml

appId: com.mathematics.solver
env:
  USERNAME: ${USERNAME:-test_user}
  PASSWORD: ${PASSWORD:-Test@12345678}

---

# Quick login without extensive checks
- tapOn:
    id: "login-email-input"
    optional: true

- inputText: ${USERNAME}

- tapOn:
    id: "login-password-input"
- inputText: ${PASSWORD}

- tapOn:
    id: "login-button"

- waitForAnimationToEnd:
    timeout: 5000
