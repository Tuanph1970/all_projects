# Reusable login flow for Mathematics Solver
# Usage: - runFlow: flows/login-flow.yaml

appId: com.mathematics.solver
env:
  USERNAME: ${USERNAME:-test_user}
  PASSWORD: ${PASSWORD:-Test@12345678}

---

# Check if already logged in by looking for home screen
- assertNotVisible:
    id: "login-email-input"
    optional: true

# If login screen not visible, we're already logged in
- ifTrue:
    notVisible:
      id: "login-email-input"
    commands:
      - stopFlow

# Enter credentials
- tapOn:
    id: "login-email-input"
- inputText: ${USERNAME}

- tapOn:
    id: "login-password-input"
- inputText: ${PASSWORD}

# Submit login
- tapOn:
    id: "login-button"

# Wait for login to complete and navigate to home
- waitForAnimationToEnd
- assertVisible:
    id: "home-screen"
    timeout: 10000
