name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel any in-progress run on the same branch when a new push arrives
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # 1. Backend — AuthService & ProblemService (.NET 9 / xUnit)
  # ─────────────────────────────────────────────────────────────────────────────
  test-backend:
    name: Backend Tests (.NET)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/packages.lock.json', '**/*.csproj') }}
          restore-keys: nuget-

      - name: Restore — AuthService.Tests
        working-directory: backend/microservices
        run: dotnet restore AuthService.Tests/AuthService.Tests.csproj

      - name: Restore — ProblemService.Tests
        working-directory: backend/microservices
        run: dotnet restore ProblemService.Tests/ProblemService.Tests.csproj

      - name: Test — AuthService (~47 tests)
        working-directory: backend/microservices
        run: |
          dotnet test AuthService.Tests/AuthService.Tests.csproj \
            --no-restore \
            --verbosity normal \
            --logger "trx;LogFileName=auth-results.trx" \
            --collect:"XPlat Code Coverage"

      - name: Test — ProblemService (~35 tests)
        working-directory: backend/microservices
        run: |
          dotnet test ProblemService.Tests/ProblemService.Tests.csproj \
            --no-restore \
            --verbosity normal \
            --logger "trx;LogFileName=problem-results.trx" \
            --collect:"XPlat Code Coverage"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: backend/microservices/**/*.trx

  # ─────────────────────────────────────────────────────────────────────────────
  # 2. Frontend — Redux store & service tests (Jest / jest-expo)
  # ─────────────────────────────────────────────────────────────────────────────
  test-frontend:
    name: Frontend Tests (Jest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run tests with coverage (~64 tests)
        working-directory: frontend
        run: npm test -- --watchAll=false --coverage --ci
        env:
          CI: true

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage/

  # ─────────────────────────────────────────────────────────────────────────────
  # 3. ML Service — unit + API tests (pytest / llmOCR)
  #
  #    Runs: unit + api markers only (~127 tests)
  #    Skips: performance & integration (require live models / services)
  #    Uses CPU-only PyTorch to avoid a 2 GB GPU wheel download
  # ─────────────────────────────────────────────────────────────────────────────
  test-ml:
    name: ML Service Tests (pytest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            llmOCR/requirements.txt
            llmOCR/requirements-test.txt

      - name: Install CPU-only PyTorch (avoids 2 GB GPU wheel)
        run: |
          pip install torch==2.1.0+cpu torchvision==0.16.0+cpu \
            --index-url https://download.pytorch.org/whl/cpu

      - name: Install service dependencies
        working-directory: llmOCR
        run: pip install -r requirements.txt --no-deps-for-build

      - name: Install test dependencies
        working-directory: llmOCR
        run: pip install -r requirements-test.txt

      - name: Run unit + API tests
        working-directory: llmOCR
        run: |
          pytest -m "unit or api" \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=70 \
            -v
        env:
          # Prevent model downloads during tests — unit tests must mock models
          TRANSFORMERS_OFFLINE: "1"
          HF_DATASETS_OFFLINE: "1"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ml-coverage
          path: llmOCR/coverage.xml

  # ─────────────────────────────────────────────────────────────────────────────
  # 4. Summary — all 3 jobs must pass for the workflow to succeed
  # ─────────────────────────────────────────────────────────────────────────────
  ci-passed:
    name: CI Passed
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend, test-ml]
    if: always()

    steps:
      - name: Check all jobs succeeded
        run: |
          if [[ "${{ needs.test-backend.result }}" != "success" || \
                "${{ needs.test-frontend.result }}" != "success" || \
                "${{ needs.test-ml.result }}" != "success" ]]; then
            echo "One or more CI jobs failed."
            exit 1
          fi
          echo "All CI jobs passed ✅"
