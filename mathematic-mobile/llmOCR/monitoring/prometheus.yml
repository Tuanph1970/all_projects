---
# Prometheus configuration for the Mathematics LLM OCR Service
# Reload without restart: curl -X POST http://localhost:9090/-/reload

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    service: math-llm-ocr

# ── Alert rule files (add your .yml files here) ──────────────
# rule_files:
#   - "alerts/*.yml"

# ── Scrape targets ────────────────────────────────────────────
scrape_configs:
  # llmOCR application — exposes Prometheus metrics at /metrics
  - job_name: llm-ocr
    static_configs:
      - targets:
          - llm-ocr:8002
    metrics_path: /metrics
    scrape_interval: 10s
    scrape_timeout: 5s

  # Redis — expose via redis_exporter sidecar if needed
  # - job_name: redis
  #   static_configs:
  #     - targets:
  #         - redis-exporter:9121

  # Prometheus self-monitoring
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
