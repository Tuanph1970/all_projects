# ============================================================================
# Mathematic Mobile Microservices Architecture
# ============================================================================
# Services:
#   - API Gateway (Traefik v2.11)
#   - Auth Service (.NET Core)
#   - Problem Service (.NET Core)
#   - Solution Service (Python/FastAPI - ML/AI)
#   - MySQL Database
#   - Redis Cache
# ============================================================================

services:
  # ==========================================================================
  # API GATEWAY - Traefik v2.11 (Fixed for Docker API compatibility)
  # ==========================================================================
  traefik:
    image: traefik:v2.11
    container_name: math_traefik
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-8003}:80"
      - "${TRAEFIK_DASHBOARD_PORT:-8083}:8080"
    command:
      - "--api.insecure=true"
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=backend_math_network"
      - "--providers.docker.constraints=Label(`com.docker.compose.project`,`backend`)"
      - "--entrypoints.web.address=:80"
      - "--log.level=INFO"
      - "--accesslog=true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - math_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.math-dashboard.rule=Host(`traefik.localhost`)"
      - "traefik.http.routers.math-dashboard.service=api@internal"

  # ==========================================================================
  # SHARED INFRASTRUCTURE
  # ==========================================================================

  # MySQL Database
  db:
    image: mysql:8.0
    container_name: math_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-Mysql_2025}
      MYSQL_DATABASE: ${DB_NAME:-MathematicsSolverDb}
      MYSQL_USER: ${DB_USER:-mathematic_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-Mysql_2025}
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max_connections=500
    ports:
      - "${MATH_DB_PORT:-3310}:3306"
    volumes:
      - math_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-Mysql_2025}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s
    networks:
      - math_network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: math_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "${MATH_REDIS_PORT:-6380}:6379"
    volumes:
      - math_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - math_network

  # ==========================================================================
  # MICROSERVICES
  # ==========================================================================

  # Auth Service (.NET Core)
  auth-service:
    build:
      context: ./microservices/auth-service
      dockerfile: Dockerfile
    container_name: math_auth_service
    restart: unless-stopped
    environment:
      - SERVICE_PORT=8001
      - DB_SERVER=db
      - DB_PORT=3306
      - DB_NAME=${DB_NAME:-MathematicsSolverDb}
      - DB_USER=${DB_USER:-mathematic_user}
      - DB_PASSWORD=${DB_PASSWORD:-Mysql_2025}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your-super-secret-key-change-in-production-minimum-32-chars}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - math_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.math-auth.rule=PathPrefix(`/api/v1/auth`) || PathPrefix(`/api/v1/users`)"
      - "traefik.http.routers.math-auth.entrypoints=web"
      - "traefik.http.services.math-auth.loadbalancer.server.port=8001"

  # Problem Service (.NET Core)
  problem-service:
    build:
      context: ./microservices/problem-service
      dockerfile: Dockerfile
    container_name: math_problem_service
    restart: unless-stopped
    environment:
      - SERVICE_PORT=8002
      - DB_SERVER=db
      - DB_PORT=3306
      - DB_NAME=${DB_NAME:-MathematicsSolverDb}
      - DB_USER=${DB_USER:-mathematic_user}
      - DB_PASSWORD=${DB_PASSWORD:-Mysql_2025}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your-super-secret-key-change-in-production-minimum-32-chars}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SOLUTION_SERVICE_URL=http://solution-service:8003
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN:-internal-service-token}
      - STORAGE_UPLOAD_PATH=/app/uploads
    volumes:
      - math_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - math_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.math-problem.rule=PathPrefix(`/api/v1/problems`)"
      - "traefik.http.routers.math-problem.entrypoints=web"
      - "traefik.http.services.math-problem.loadbalancer.server.port=8002"

  # Solution Service (Python/FastAPI - ML/AI)
  solution-service:
    build:
      context: ./microservices/solution-service
      dockerfile: Dockerfile
    container_name: math_solution_service
    restart: unless-stopped
    environment:
      - SERVICE_PORT=8003
      - DB_SERVER=db
      - DB_PORT=3306
      - DB_NAME=${DB_NAME:-MathematicsSolverDb}
      - DB_USER=${DB_USER:-mathematic_user}
      - DB_PASSWORD=${DB_PASSWORD:-Mysql_2025}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PROBLEM_SERVICE_URL=http://problem-service:8002
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN:-internal-service-token}
      - UPLOAD_PATH=/app/uploads
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    volumes:
      - math_uploads:/app/uploads
      - math_models:/app/models
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
    networks:
      - math_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.math-solution.rule=PathPrefix(`/api/v1/solutions`)"
      - "traefik.http.routers.math-solution.entrypoints=web"
      - "traefik.http.services.math-solution.loadbalancer.server.port=8003"

# =============================================================================
# VOLUMES
# =============================================================================
volumes:
  math_mysql_data:
    driver: local
  math_redis_data:
    driver: local
  math_uploads:
    driver: local
  math_models:
    driver: local

# =============================================================================
# NETWORKS
# =============================================================================
networks:
  math_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.22.0.0/16
