services:
  # Mathematics Solver API
  mathematics-solver-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${MATH_API_PORT:-8003}:8001"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8001
      - ConnectionStrings__DefaultConnection=Server=mysql;Database=${MATH_DB_NAME:-MathematicsSolverDb};User=root;Password=${MYSQL_ROOT_PASSWORD:-Mysql_2025};
    depends_on:
      - mysql
    networks:
      - mathematics-solver-network
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://localhost:8001/health || exit 0"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # MySQL Database
  mysql:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-Mysql_2025}
      - MYSQL_DATABASE=${MATH_DB_NAME:-MathematicsSolverDb}
      - MYSQL_USER=${MATH_DB_USER:-mathematic_user}
      - MYSQL_PASSWORD=${MATH_DB_PASSWORD:-Mysql_2025}
      - MYSQL_CHARSET=utf8mb4
      - MYSQL_COLLATION=utf8mb4_unicode_ci
    ports:
      - "${MATH_DB_PORT:-3310}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./scripts:/docker-entrypoint-initdb.d
    networks:
      - mathematics-solver-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pMysql_2025"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Redis Cache (Optional - for caching and session storage)
  redis:
    image: redis:7-alpine
    ports:
      - "${MATH_REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    networks:
      - mathematics-solver-network
    restart: unless-stopped
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  mathematics-solver-network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local