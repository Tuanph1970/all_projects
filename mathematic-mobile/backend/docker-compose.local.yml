# =============================================================================
# Mathematics Solver API - Standalone Local Development Configuration
# =============================================================================
# Usage: docker compose -f docker-compose.local.yml up -d
#
# This is a STANDALONE configuration for local development:
#   - Uses LOCAL MySQL (host.docker.internal) instead of Docker MySQL
#   - No Docker MySQL container
#   - Development-friendly settings
# =============================================================================

services:
  # Mathematics Solver API
  mathematics-solver-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mathematic-api
    ports:
      - "${MATH_API_PORT:-8003}:8001"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8001
      # Connect to local MySQL
      - ConnectionStrings__DefaultConnection=Server=host.docker.internal;Port=3306;Database=${MATH_DB_NAME:-MathematicsSolverDb};User=${MATH_DB_USER:-mathematic_user};Password=${MATH_DB_PASSWORD:-Mysql_2025};
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - mathematics-solver-network
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://localhost:8001/health || exit 0"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Redis Cache (Optional)
  redis:
    image: redis:7-alpine
    container_name: mathematic-redis
    ports:
      - "${MATH_REDIS_PORT:-6381}:6379"
    volumes:
      - redis_data:/data
    networks:
      - mathematics-solver-network
    restart: unless-stopped
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  mathematics-solver-network:
    driver: bridge

volumes:
  redis_data:
    driver: local
