services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: math-solver-mysql
    environment:
      MYSQL_ROOT_PASSWORD: Mysql@2025
      MYSQL_DATABASE: MathematicsSolverDb
      MYSQL_USER: mathsolver
      MYSQL_PASSWORD: Mysql@2025
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - math-solver-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: math-solver-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - math-solver-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  # .NET Core Backend API
  backend-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: math-solver-backend
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8001
      ConnectionStrings__DefaultConnection: "Server=mysql;Database=MathematicsSolverDb;User=root;Password=Mysql@2025;Port=3306;"
      Jwt__SecretKey: ThisIsASecretKeyForJWTTokenGenerationThatShouldBeAtLeast256BitsLong
      Jwt__Issuer: MathematicsSolver.API
      Jwt__Audience: MathematicsSolver.Client
      Jwt__ExpirationMinutes: "60"
      FileStorage__UploadPath: uploads/images
      FileStorage__BaseUrl: http://localhost:8001
      MLService__BaseUrl: http://llm-service:8002
    ports:
      - "8001:8001"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - math-solver-network
    volumes:
      - ./backend:/app
      - backend_logs:/app/logs
    restart: unless-stopped

  # Python ML/OCR Service
  llm-service:
    build:
      context: ./llmOCR
      dockerfile: Dockerfile
    container_name: math-solver-llm
    environment:
      PYTHONPATH: /app
      API_HOST: 0.0.0.0
      API_PORT: 8002
      REDIS_URL: redis://redis:6379/0
      ML_DEVICE: cpu
      BACKEND_API_URL: http://backend-api:8001/api
      SECRET_KEY: your-super-secret-key-here-change-in-production
      LOG_LEVEL: DEBUG
      ENVIRONMENT: development
    ports:
      - "8002:8002"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - math-solver-network
    volumes:
      - ./llmOCR:/app
      - ml_models:/app/models
      - llm_logs:/app/logs
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          memory: 2G
        limits:
          memory: 4G

  # Expo Development Server
  expo-dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: math-solver-expo-dev
    environment:
      NODE_ENV: development
      EXPO_DEVTOOLS_LISTEN_ADDRESS: 0.0.0.0
      REACT_NATIVE_PACKAGER_HOSTNAME: 0.0.0.0
      EXPO_PUBLIC_API_BASE_URL: http://localhost:8001/api
      EXPO_DEBUG: true
    ports:
      - "8081:8081"   # Metro bundler
      - "19000:19000" # Expo dev server
      - "19001:19001" # Expo dev server (LAN)
      - "19002:19002" # Expo dev tools
      - "19006:19006" # Webpack dev server (web)
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - metro_cache:/tmp/metro-cache
    networks:
      - math-solver-network
    command: ["npx", "expo", "start", "--dev-client", "--clear"]
    restart: unless-stopped
    stdin_open: true
    tty: true

  # Nginx Reverse Proxy (optional for production-like setup)
  nginx:
    image: nginx:alpine
    container_name: math-solver-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/conf.d:/etc/nginx/conf.d
      - nginx_logs:/var/log/nginx
    depends_on:
      - backend-api
      - llm-service
    networks:
      - math-solver-network
    restart: unless-stopped
    profiles:
      - nginx

  # Monitoring with Prometheus (optional - disabled by default)
  # Uncomment and create monitoring/prometheus.yml to enable
  # prometheus:
  #   image: prom/prometheus:latest
  #   container_name: math-solver-prometheus
  #   ports:
  #     - "9090:9090"
  #   volumes:
  #     - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
  #     - prometheus_data:/prometheus
  #   command:
  #     - '--config.file=/etc/prometheus/prometheus.yml'
  #     - '--storage.tsdb.path=/prometheus'
  #     - '--web.console.libraries=/usr/share/prometheus/console_libraries'
  #     - '--web.console.templates=/usr/share/prometheus/consoles'
  #     - '--web.enable-lifecycle'
  #   networks:
  #     - math-solver-network
  #   profiles:
  #     - monitoring

  # Grafana for metrics visualization (optional - disabled by default)
  # Uncomment and create monitoring/grafana config to enable
  # grafana:
  #   image: grafana/grafana:latest
  #   container_name: math-solver-grafana
  #   ports:
  #     - "3000:3000"
  #   environment:
  #     GF_SECURITY_ADMIN_PASSWORD: admin123
  #   volumes:
  #     - grafana_data:/var/lib/grafana
  #     - ./monitoring/grafana:/etc/grafana/provisioning
  #   depends_on:
  #     - prometheus
  #   networks:
  #     - math-solver-network
  #   profiles:
  #     - monitoring

networks:
  math-solver-network:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  backend_logs:
  llm_logs:
  nginx_logs:
  ml_models:
  metro_cache:
  prometheus_data:
  grafana_data: