# Microservices Architecture for Ceramic Marketplace
# Single Server Deployment with Traefik API Gateway

services:
  # ===========================================
  # INFRASTRUCTURE SERVICES
  # ===========================================

  # Traefik API Gateway
  traefik:
    image: traefik:v2.11
    container_name: ceramic_traefik
    restart: unless-stopped
    command:
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=backend_ceramic_network"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--log.level=INFO"
      - "--accesslog=true"
    ports:
      - "8002:80"    # Ceramic API - matches nginx ceramic_api upstream
      - "8443:443"   # HTTPS (nginx handles external :443)
      - "8080:8080"  # Traefik Dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - ./traefik/acme:/etc/traefik/acme
    networks:
      - ceramic_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ceramic-dashboard.rule=Host(`traefik.localhost`)"
      - "traefik.http.routers.ceramic-dashboard.service=api@internal"

  # Redis Cache Service
  redis:
    image: redis:7-alpine
    container_name: ceramic_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - ceramic_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ceramic_network

  # MySQL Database Service
  db:
    image: mysql:8.0
    container_name: ceramic_mysql
    restart: unless-stopped
    ports:
      - "${CERAMIC_DB_PORT:-3308}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-Mysql_2025}
      MYSQL_DATABASE: ${DB_NAME:-ceramic_db}
      MYSQL_USER: ${DB_USER:-ceramic_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-Mysql_2025}
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max_connections=500
    volumes:
      - ceramic_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-Mysql_2025}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s
    networks:
      - ceramic_network

  # ===========================================
  # MICROSERVICES
  # ===========================================

  # Auth Service - Authentication & User Management
  auth-service:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    container_name: ceramic_auth_service
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"  # Linux support for host MySQL
    environment:
      - SERVICE_NAME=auth-service
      - SERVICE_PORT=8001
      - DB_HOST=${DB_HOST:-db}
      - DB_PORT=${DB_PORT:-3306}
      - DB_NAME=${DB_NAME:-ceramic_marketplace}
      - DB_USER=${DB_USER:-ceramic_user}
      - DB_PASSWORD=${DB_PASSWORD:-Mysql_2025}
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-in-production}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - ENVIRONMENT=${ENVIRONMENT:-production}
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - ceramic_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ceramic-auth.rule=PathPrefix(`/api/v1/auth`) || PathPrefix(`/api/v1/users`)"
      - "traefik.http.routers.ceramic-auth.entrypoints=web"
      - "traefik.http.services.ceramic-auth.loadbalancer.server.port=8001"
      - "traefik.http.routers.ceramic-auth.middlewares=ratelimit@file"

  # Product Service - Catalog & Search
  product-service:
    build:
      context: .
      dockerfile: services/product/Dockerfile
    container_name: ceramic_product_service
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - SERVICE_NAME=product-service
      - SERVICE_PORT=8002
      - DB_HOST=${DB_HOST:-db}
      - DB_PORT=${DB_PORT:-3306}
      - DB_NAME=${DB_NAME:-ceramic_marketplace}
      - DB_USER=${DB_USER:-ceramic_user}
      - DB_PASSWORD=${DB_PASSWORD:-Mysql_2025}
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-in-production}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - AUTH_SERVICE_URL=http://auth-service:8001
    depends_on:
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    volumes:
      - ./uploads:/app/uploads
    networks:
      - ceramic_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ceramic-product.rule=PathPrefix(`/api/v1/products`) || PathPrefix(`/api/v1/reviews`)"
      - "traefik.http.routers.ceramic-product.entrypoints=web"
      - "traefik.http.services.ceramic-product.loadbalancer.server.port=8002"
      - "traefik.http.routers.ceramic-product.middlewares=ratelimit@file"

  # Order Service - Cart & Orders
  order-service:
    build:
      context: .
      dockerfile: services/order/Dockerfile
    container_name: ceramic_order_service
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - SERVICE_NAME=order-service
      - SERVICE_PORT=8003
      - DB_HOST=${DB_HOST:-db}
      - DB_PORT=${DB_PORT:-3306}
      - DB_NAME=${DB_NAME:-ceramic_marketplace}
      - DB_USER=${DB_USER:-ceramic_user}
      - DB_PASSWORD=${DB_PASSWORD:-Mysql_2025}
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-in-production}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - AUTH_SERVICE_URL=http://auth-service:8001
      - PRODUCT_SERVICE_URL=http://product-service:8002
    depends_on:
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - ceramic_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ceramic-order.rule=PathPrefix(`/api/v1/orders`) || PathPrefix(`/api/v1/cart`)"
      - "traefik.http.routers.ceramic-order.entrypoints=web"
      - "traefik.http.services.ceramic-order.loadbalancer.server.port=8003"
      - "traefik.http.routers.ceramic-order.middlewares=ratelimit@file"

  # Chat Service - Real-time Messaging
  chat-service:
    build:
      context: .
      dockerfile: services/chat/Dockerfile
    container_name: ceramic_chat_service
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - SERVICE_NAME=chat-service
      - SERVICE_PORT=8004
      - DB_HOST=${DB_HOST:-db}
      - DB_PORT=${DB_PORT:-3306}
      - DB_NAME=${DB_NAME:-ceramic_marketplace}
      - DB_USER=${DB_USER:-ceramic_user}
      - DB_PASSWORD=${DB_PASSWORD:-Mysql_2025}
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-in-production}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - AUTH_SERVICE_URL=http://auth-service:8001
    depends_on:
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - ceramic_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ceramic-chat.rule=PathPrefix(`/api/v1/chat`)"
      - "traefik.http.routers.ceramic-chat.entrypoints=web"
      - "traefik.http.services.ceramic-chat.loadbalancer.server.port=8004"

  # Seller Service - Dashboard & Analytics
  seller-service:
    build:
      context: .
      dockerfile: services/seller/Dockerfile
    container_name: ceramic_seller_service
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - SERVICE_NAME=seller-service
      - SERVICE_PORT=8005
      - DB_HOST=${DB_HOST:-db}
      - DB_PORT=${DB_PORT:-3306}
      - DB_NAME=${DB_NAME:-ceramic_marketplace}
      - DB_USER=${DB_USER:-ceramic_user}
      - DB_PASSWORD=${DB_PASSWORD:-Mysql_2025}
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-in-production}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - AUTH_SERVICE_URL=http://auth-service:8001
      - PRODUCT_SERVICE_URL=http://product-service:8002
      - ORDER_SERVICE_URL=http://order-service:8003
    depends_on:
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8005/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    volumes:
      - ./uploads:/app/uploads
    networks:
      - ceramic_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ceramic-seller.rule=PathPrefix(`/api/v1/seller`)"
      - "traefik.http.routers.ceramic-seller.entrypoints=web"
      - "traefik.http.services.ceramic-seller.loadbalancer.server.port=8005"
      - "traefik.http.routers.ceramic-seller.middlewares=ratelimit@file"

# ===========================================
# VOLUMES
# ===========================================
volumes:
  ceramic_mysql_data:
    driver: local
  ceramic_redis_data:
    driver: local

# ===========================================
# NETWORKS
# ===========================================
networks:
  ceramic_network:
    driver: bridge
