# Grafana Dashboard Provisioning Configuration
# =============================================================================

apiVersion: 1

providers:
  - name: 'Ceramic Marketplace Dashboards'
    orgId: 1
    folder: 'Ceramic Marketplace'
    folderUid: 'ceramic'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
