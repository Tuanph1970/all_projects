# Prometheus Configuration for Ceramic Marketplace Microservices
# =============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'ceramic-marketplace'
    environment: 'production'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

# Load rules once and periodically evaluate them
rule_files:
  - /etc/prometheus/rules/*.yml

# Scrape configurations
scrape_configs:
  # =============================================================================
  # Prometheus self-monitoring
  # =============================================================================
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    metrics_path: /metrics

  # =============================================================================
  # Traefik API Gateway Metrics
  # =============================================================================
  - job_name: 'traefik'
    static_configs:
      - targets: ['traefik:8080']
    metrics_path: /metrics

  # =============================================================================
  # Microservices Metrics
  # =============================================================================
  - job_name: 'auth-service'
    static_configs:
      - targets: ['auth-service:8001']
    metrics_path: /metrics
    scrape_interval: 10s

  - job_name: 'product-service'
    static_configs:
      - targets: ['product-service:8002']
    metrics_path: /metrics
    scrape_interval: 10s

  - job_name: 'order-service'
    static_configs:
      - targets: ['order-service:8003']
    metrics_path: /metrics
    scrape_interval: 10s

  - job_name: 'chat-service'
    static_configs:
      - targets: ['chat-service:8004']
    metrics_path: /metrics
    scrape_interval: 10s

  - job_name: 'seller-service'
    static_configs:
      - targets: ['seller-service:8005']
    metrics_path: /metrics
    scrape_interval: 10s

  # =============================================================================
  # Infrastructure Metrics
  # =============================================================================
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
    metrics_path: /metrics

  - job_name: 'mysql'
    static_configs:
      - targets: ['mysql-exporter:9104']
    metrics_path: /metrics

  # =============================================================================
  # Node Exporter (Host Metrics)
  # =============================================================================
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
    metrics_path: /metrics

  # =============================================================================
  # Docker Container Metrics (cAdvisor)
  # =============================================================================
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
    metrics_path: /metrics
    scrape_interval: 10s

  # =============================================================================
  # Service Health Checks (Blackbox Exporter)
  # =============================================================================
  - job_name: 'blackbox-http'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://auth-service:8001/health
          - http://product-service:8002/health
          - http://order-service:8003/health
          - http://chat-service:8004/health
          - http://seller-service:8005/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
