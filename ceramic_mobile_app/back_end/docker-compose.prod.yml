# Ceramic Marketplace API - Production Configuration
# Uses native MySQL and Redis on host, exposes API on port 8002
# System nginx handles routing (no Docker nginx needed)

version: '3.8'

services:
  # Python FastAPI Application - Production
  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - ENVIRONMENT=production
    container_name: ceramic_api
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      # Database Configuration - Connect to native MySQL on host
      - DB_HOST=host.docker.internal
      - DB_PORT=3306
      - DB_NAME=${DB_NAME:-ceramic_marketplace}
      - DB_USER=${DB_USER:-ceramic_user}
      - DB_PASSWORD=${DB_PASSWORD}

      # Redis Configuration - Connect to native Redis on host
      - REDIS_HOST=host.docker.internal
      - REDIS_PORT=6379
      - REDIS_DB=0

      # Application Configuration
      - ENVIRONMENT=production
      - DEBUG=false
      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=${ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      - REFRESH_TOKEN_EXPIRE_DAYS=${REFRESH_TOKEN_EXPIRE_DAYS:-7}

      # Application Settings
      - API_BASE_URL=${API_BASE_URL:-http://localhost:8002}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost}
      - MAX_UPLOAD_SIZE=${MAX_UPLOAD_SIZE:-10485760}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-*}

      # Email Configuration
      - SMTP_SERVER=${SMTP_SERVER:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-Ceramic Marketplace}
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - ceramic_prod_network

networks:
  ceramic_prod_network:
    driver: bridge
