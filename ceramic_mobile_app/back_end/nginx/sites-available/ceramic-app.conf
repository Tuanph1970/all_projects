# =============================================================================
# Ceramic Marketplace API - Site Configuration
# Path: /ceramic-app
#
# Installation:
#   sudo cp this-file /etc/nginx/sites-available/ceramic-app.conf
#   sudo ln -s /etc/nginx/sites-available/ceramic-app.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Or include in main nginx.conf:
#   include /etc/nginx/sites-available/ceramic-app.conf;
# =============================================================================

# Ceramic Marketplace API upstream (Traefik Gateway on port 8002)
upstream ceramic_app_api {
    server 127.0.0.1:8002 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# Rate limiting zones for ceramic-app
limit_req_zone $binary_remote_addr zone=ceramic_api_limit:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=ceramic_conn_limit:10m;

# =============================================================================
# Ceramic App Location Blocks (include in your server block)
# =============================================================================

# Health Check for Ceramic App
location /ceramic-app/health {
    access_log off;
    proxy_pass http://ceramic_app_api/health;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# API Documentation (Swagger/ReDoc)
location ~ ^/ceramic-app/(docs|redoc|openapi\.json)$ {
    rewrite ^/ceramic-app/(.*)$ /$1 break;
    proxy_pass http://ceramic_app_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# WebSocket for Chat Service
location /ceramic-app/api/v1/chat/ws {
    rewrite ^/ceramic-app/(.*)$ /$1 break;
    proxy_pass http://ceramic_app_api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
}

# Main API Endpoints
location /ceramic-app/api/ {
    limit_req zone=ceramic_api_limit burst=20 nodelay;
    limit_conn ceramic_conn_limit 20;

    # CORS headers
    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
    add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;

    # Handle preflight OPTIONS requests
    if ($request_method = 'OPTIONS') {
        add_header 'Access-Control-Allow-Origin' '*';
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS';
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization';
        add_header 'Access-Control-Max-Age' 1728000;
        add_header 'Content-Type' 'text/plain; charset=utf-8';
        add_header 'Content-Length' 0;
        return 204;
    }

    # Strip /ceramic-app prefix and proxy to backend
    rewrite ^/ceramic-app/(.*)$ /$1 break;
    proxy_pass http://ceramic_app_api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /ceramic-app;
    proxy_buffering off;

    # Timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
}

# Ceramic App Root - Returns API info
location = /ceramic-app {
    return 200 '{"service": "Ceramic Marketplace API", "version": "1.0.0", "base_path": "/ceramic-app", "endpoints": {"auth": "/ceramic-app/api/v1/auth", "products": "/ceramic-app/api/v1/products", "orders": "/ceramic-app/api/v1/orders", "chat": "/ceramic-app/api/v1/chat", "seller": "/ceramic-app/api/v1/seller"}}';
    add_header Content-Type application/json;
}

location = /ceramic-app/ {
    return 200 '{"service": "Ceramic Marketplace API", "version": "1.0.0", "base_path": "/ceramic-app", "endpoints": {"auth": "/ceramic-app/api/v1/auth", "products": "/ceramic-app/api/v1/products", "orders": "/ceramic-app/api/v1/orders", "chat": "/ceramic-app/api/v1/chat", "seller": "/ceramic-app/api/v1/seller"}}';
    add_header Content-Type application/json;
}
