# Test Suite Configurations for Ceramic Mobile App

# Smoke Tests - Critical user journeys
smoke:
  name: "Smoke Test Suite"
  description: "Critical functionality tests"
  timeout: 1800  # 30 minutes
  tests:
    - tests/auth/login.yaml
    - tests/auth/register.yaml
    - tests/product/browse-products.yaml
    - tests/cart/add-to-cart.yaml
    - tests/seller/dashboard.yaml

# Authentication Tests
auth:
  name: "Authentication Test Suite"
  description: "All authentication related tests"
  timeout: 1200  # 20 minutes
  tests:
    - tests/auth/login.yaml
    - tests/auth/login-failure.yaml
    - tests/auth/register.yaml
    - tests/auth/logout.yaml
    - tests/auth/change-password.yaml
    - tests/auth/reset-password.yaml

# Seller Tests
seller:
  name: "Seller Feature Test Suite"
  description: "Seller dashboard and product management"
  timeout: 1500  # 25 minutes
  tests:
    - tests/seller/dashboard.yaml
    - tests/seller/dashboard-refresh.yaml
    - tests/seller/dashboard-period-filter.yaml
    - tests/seller/add-product.yaml
    - tests/seller/product-management.yaml
    - tests/seller/analytics.yaml

# Customer Tests
customer:
  name: "Customer Feature Test Suite" 
  description: "Customer browsing and shopping features"
  timeout: 1200  # 20 minutes
  tests:
    - tests/product/browse-products.yaml
    - tests/cart/add-to-cart.yaml

# Regression Tests
regression:
  name: "Regression Test Suite"
  description: "Full regression test coverage"
  timeout: 3600  # 60 minutes
  tests:
    - tests/auth/login.yaml
    - tests/auth/register.yaml
    - tests/auth/logout.yaml
    - tests/product/browse-products.yaml
    - tests/cart/add-to-cart.yaml
    - tests/seller/dashboard.yaml
    - tests/seller/dashboard-refresh.yaml
    - tests/seller/dashboard-period-filter.yaml
    - tests/seller/add-product.yaml
    - tests/seller/product-management.yaml
    - tests/seller/analytics.yaml

# Quick Tests
quick:
  name: "Quick Test Suite"
  description: "Fast essential tests"
  timeout: 600  # 10 minutes
  tests:
    - tests/auth/login.yaml
    - tests/seller/dashboard.yaml