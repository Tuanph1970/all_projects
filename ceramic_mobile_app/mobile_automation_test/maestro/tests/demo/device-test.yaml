appId: com.android.settings
name: "Device Demo Test"

---

# Launch Android Settings
- launchApp:
    appId: com.android.settings

# Wait for app to load
- waitForAnimationToEnd

# Take screenshot
- takeScreenshot: "demo-settings"

# Try to find Display setting
- tapOn: "Display"
- waitForAnimationToEnd
- takeScreenshot: "demo-display"

# Go back
- pressKey: back

# Take final screenshot  
- takeScreenshot: "demo-complete"