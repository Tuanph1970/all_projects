appId: com.ceramicmarketplace.app
name: "Seller Dashboard - Data Refresh (DASH-006)"
tags:
  - seller
  - dashboard
  - refresh
  - P3

---

# Test Case: DASH-006 - Dashboard Data Refresh
# Purpose: Verify that the seller dashboard data can be refreshed via pull-to-refresh
# Priority: P3

# Launch the app fresh
- launchApp:
    clearState: true
    permissions:
      notifications: allow

# Login as seller
- runFlow: flows/seller-login-flow.yaml

# Wait for dashboard to load completely
- waitForAnimationToEnd
- assertVisible:
    id: "seller-dashboard-screen"
    timeout: 10000

# Verify initial dashboard state
- assertVisible:
    id: "seller-dashboard-scroll"

# Take screenshot of initial state
- takeScreenshot: "dashboard-before-refresh"

# Verify dashboard data is loaded
- assertVisible:
    id: "seller-dashboard-widgets"

# Check that performance widgets are visible
- assertVisible:
    id: "seller-dashboard-total-sales"
    optional: true

- assertVisible:
    id: "seller-dashboard-total-orders"
    optional: true

# Perform pull-to-refresh gesture
# First scroll to top to ensure we're at the right position
- scroll:
    direction: UP
    duration: 500

# Execute pull-to-refresh by swiping down from near top
- swipe:
    direction: DOWN
    start: [50%, 15%]
    end: [50%, 70%]
    duration: 800

# Wait for refresh to complete
- waitForAnimationToEnd
- extendedWaitUntil:
    notVisible:
      id: "seller-dashboard-refresh"
    timeout: 15000
    optional: true

# Alternative: just wait for data to reload
- wait: 3000

# Verify dashboard is still showing correctly after refresh
- assertVisible:
    id: "seller-dashboard-screen"

- assertVisible:
    id: "seller-dashboard-scroll"

# Verify widgets are still visible after refresh
- assertVisible:
    id: "seller-dashboard-widgets"

# Take screenshot after refresh
- takeScreenshot: "dashboard-after-refresh"

# Scroll down to verify all content loaded after refresh
- scroll:
    direction: DOWN
    duration: 1000

# Check alerts section (may or may not be visible depending on data)
- assertVisible:
    id: "seller-dashboard-alerts"
    optional: true

# Check sales chart
- assertVisible:
    id: "seller-dashboard-sales-chart"
    optional: true

# Take screenshot of middle section
- takeScreenshot: "dashboard-refresh-middle"

# Scroll to bottom
- scroll:
    direction: DOWN
    duration: 1000

# Check top products section
- assertVisible:
    id: "seller-dashboard-top-products"
    optional: true

# Take final screenshot
- takeScreenshot: "dashboard-refresh-complete"

# Verify FAB is still accessible
- assertVisible:
    id: "seller-dashboard-fab-add"
