appId: com.ceramicmarketplace.app
name: "Seller - Analytics"
tags:
  - seller
  - analytics
  - reports
  
---

# Launch the app and login as seller
- launchApp:
    clearState: true
    permissions:
      notifications: allow

# Login as seller
- runFlow: flows/seller-login-flow.yaml

# Navigate to analytics tab
- waitForAnimationToEnd
- tapOn:
    id: "tab-analytics"
    
# Wait for analytics screen to load
- waitForAnimationToEnd

# Check if analytics loaded or showing error
- assertVisible:
    anyOf:
      - id: "analytics-screen"
      - id: "analytics-screen-error"
    timeout: 10000
    
# If analytics loaded successfully, test period selection
- ifTrue:
    visible:
      id: "analytics-screen"
    commands:
      # Take screenshot of default view
      - takeScreenshot: "analytics-default"
      
      # Test period selection
      - assertVisible:
          id: "analytics-period-card"
          
      # Try 7 day period
      - tapOn:
          id: "analytics-period-7"
          optional: true
      - waitForAnimationToEnd
      - takeScreenshot: "analytics-7day"
      
      # Try 30 day period
      - tapOn:
          id: "analytics-period-30"
          optional: true
      - waitForAnimationToEnd
      - takeScreenshot: "analytics-30day"
      
      # Scroll to see more metrics
      - scroll:
          direction: DOWN
          duration: 1000
          
      # Check sales metrics
      - assertVisible:
          id: "analytics-sales-card"
          optional: true
          
      # Check revenue metric
      - assertVisible:
          id: "analytics-revenue-metric"
          optional: true
          
      # Check orders metric
      - assertVisible:
          id: "analytics-orders-metric"
          optional: true
          
      # Take screenshot of sales metrics
      - takeScreenshot: "analytics-sales-metrics"
      
      # Scroll more
      - scroll:
          direction: DOWN
          duration: 1000
          
      # Check inventory card
      - assertVisible:
          id: "analytics-inventory-card"
          optional: true
          
      # Check top products
      - assertVisible:
          id: "analytics-top-products-card"
          optional: true
          
      # Take screenshot of inventory metrics
      - takeScreenshot: "analytics-inventory"
      
      # Scroll to bottom
      - scroll:
          direction: DOWN
          duration: 1000
          
      # Check customer metrics
      - assertVisible:
          id: "analytics-customer-card"
          optional: true
          
      # Take screenshot of customer metrics
      - takeScreenshot: "analytics-customers"
      
      # Test refresh
      - scroll:
          direction: UP
          duration: 2000  # Scroll to top
          
      - swipe:
          direction: DOWN
          start: [50%, 20%]
          end: [50%, 80%]
          duration: 500
          optional: true
          
# If error screen shown
- ifTrue:
    visible:
      id: "analytics-screen-error"
    commands:
      - takeScreenshot: "analytics-error"
      - assertVisible:
          id: "analytics-error-text"
          optional: true