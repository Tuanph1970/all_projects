appId: com.ceramicmarketplace.app
name: "Reset Password Flow"
tags:
  - auth
  - password
  - recovery
  
---

# Launch the app fresh
- launchApp:
    clearState: true

# Wait for login screen
- waitForAnimationToEnd
- assertVisible:
    id: "login-username-input"

# Tap forgot password link
- tapOn:
    id: "login-forgot-password-link"
    
# Wait for forgot password screen
- waitForAnimationToEnd
- assertVisible:
    id: "forgot-password-submit-button"
    
# Enter email for password reset
- tapOn:
    id: "forgot-password-email-input"
- inputText: ${TEST_EMAIL}

# Take screenshot
- takeScreenshot: "forgot-password-filled"

# Submit forgot password request
- tapOn:
    id: "forgot-password-submit-button"
    
# Wait for response
- waitForAnimationToEnd

# Verify success message
- assertVisible:
    anyOf:
      - text: "Reset email sent"
      - text: "Check your email"
      - text: "Password reset link sent"
      - text: "Instructions sent"
    timeout: 10000
    
# Take screenshot of success
- takeScreenshot: "forgot-password-success"

# Note: Actual password reset would require:
# 1. Access to email to get reset token
# 2. Deep link handling to open reset screen
# 3. New password entry
# This test only covers the request flow