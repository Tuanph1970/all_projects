appId: com.ceramicmarketplace.app
name: "Logout Flow"
tags:
  - auth
  - logout
  - smoke

---

# Launch the app and login first
- launchApp:
    clearState: true

# Quick login
- waitForAnimationToEnd
- tapOn:
    id: "login-username-input"
- inputText: ${TEST_CUSTOMER_USERNAME}
- hideKeyboard
- tapOn:
    id: "login-password-input"
- inputText: ${TEST_PASSWORD}
- hideKeyboard
- tapOn:
    id: "login-submit-button"

# Wait for home screen
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "tab-home"
    timeout: 20000

# Navigate to profile tab
- tapOn:
    id: "tab-profile"

# Wait for profile screen to load
- waitForAnimationToEnd
- takeScreenshot: "profile-screen"

# Wait for logout button to be visible (scroll if needed)
- scroll
- extendedWaitUntil:
    visible:
      id: "profile-logout-button"
    timeout: 10000

# Take screenshot of profile
- takeScreenshot: "profile-before-logout"

# Tap logout button
- tapOn:
    id: "profile-logout-button"

# Confirm logout if dialog appears
- runFlow:
    when:
      visible: "Logout"
    commands:
      - tapOn: "Logout"
- runFlow:
    when:
      visible: "Yes"
    commands:
      - tapOn: "Yes"
- runFlow:
    when:
      visible: "Confirm"
    commands:
      - tapOn: "Confirm"

# Wait for navigation
- waitForAnimationToEnd

# Verify we're back at login screen
- extendedWaitUntil:
    visible:
      id: "login-username-input"
    timeout: 10000

# Take screenshot of login screen
- takeScreenshot: "logout-success"
