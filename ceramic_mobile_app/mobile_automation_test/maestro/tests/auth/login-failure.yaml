appId: com.ceramicmarketplace.app
name: "Login Flow - Invalid Credentials"
tags:
  - auth
  - login
  - negative

---

# Launch the app fresh
- launchApp:
    clearState: true

# Wait for login screen to appear
- waitForAnimationToEnd
- assertVisible:
    id: "login-username-input"

# Test 1: Invalid password
- tapOn:
    id: "login-username-input"
- inputText: "test_customer"
- hideKeyboard

- tapOn:
    id: "login-password-input"
- inputText: "WrongPassword123"
- hideKeyboard

- tapOn:
    id: "login-submit-button"

# Wait for error and take screenshot
- waitForAnimationToEnd
- takeScreenshot: "login-invalid-password"

# Clear fields for next test
- tapOn:
    id: "login-username-input"
- eraseText: 50
- tapOn:
    id: "login-password-input"
- eraseText: 50

# Test 2: Non-existent user
- tapOn:
    id: "login-username-input"
- inputText: "nonexistent_user"
- hideKeyboard

- tapOn:
    id: "login-password-input"
- inputText: "Test@12345678"
- hideKeyboard

- tapOn:
    id: "login-submit-button"

# Wait for error and take screenshot
- waitForAnimationToEnd
- takeScreenshot: "login-nonexistent-user"

# Test 3: Empty fields
- tapOn:
    id: "login-username-input"
- eraseText: 50
- tapOn:
    id: "login-password-input"
- eraseText: 50

- tapOn:
    id: "login-submit-button"

# Wait and take screenshot
- waitForAnimationToEnd
- takeScreenshot: "login-empty-fields"

# Verify still on login screen (login failed)
- assertVisible:
    id: "login-submit-button"
