appId: com.ceramicmarketplace.app
name: "Registration Flow - New User"
tags:
  - auth
  - register
  - smoke

onFlowStart:
  - evalScript: ${output.timestamp = Date.now()}
  - evalScript: ${output.uniqueUser = 'testuser' + output.timestamp}
  - evalScript: ${output.uniqueEmail = 'testuser' + output.timestamp + '@test.com'}

---

# Launch the app fresh
- launchApp:
    clearState: true
    permissions:
      notifications: allow

# Wait for login screen to appear
- waitForAnimationToEnd
- assertVisible:
    id: "login-username-input"

# Navigate to registration
- tapOn:
    id: "login-register-link"

# Wait for registration screen
- waitForAnimationToEnd
- assertVisible:
    id: "register-submit-button"

# Fill registration form
- tapOn:
    id: "register-firstname-input"
- inputText: "Test"
- hideKeyboard

- tapOn:
    id: "register-lastname-input"
- inputText: "User"
- hideKeyboard

- tapOn:
    id: "register-username-input"
- inputText: ${output.uniqueUser}
- hideKeyboard

- tapOn:
    id: "register-email-input"
- inputText: ${output.uniqueEmail}
- hideKeyboard

- tapOn:
    id: "register-password-input"
- inputText: "Test@12345678"
- hideKeyboard

- tapOn:
    id: "register-confirm-password-input"
- inputText: "Test@12345678"
- hideKeyboard

# Scroll down to see role selection
- scroll

# Select role (customer by default)
- tapOn:
    id: "register-role-customer"

# Take screenshot before submitting
- takeScreenshot: "register-filled"

# Submit registration
- tapOn:
    id: "register-submit-button"

# Wait for registration to complete
- waitForAnimationToEnd

# Verify successful registration - should auto-login or show success message
- extendedWaitUntil:
    visible:
      id: "login-username-input"
    timeout: 20000

# Take screenshot of success
- takeScreenshot: "register-success"
