appId: com.ceramicmarketplace.app
name: "Login Verification Only"
tags:
  - auth
  - verify

---

# This test assumes credentials are already entered via ADB
# Used by fast-login-wrapper.sh

# Tap login button
- tapOn:
    id: "login-submit-button"

# Wait for login to complete
- waitForAnimationToEnd

# Verify successful login - look for home tab
- extendedWaitUntil:
    visible:
      id: "tab-home"
    timeout: 20000

# Take screenshot of home screen
- takeScreenshot: "login-success-home"
