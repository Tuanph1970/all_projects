appId: com.ceramicmarketplace.app
name: "Change Password Flow"
tags:
  - auth
  - password
  - profile
  
env:
  NEW_PASSWORD: "NewTest@12345678"
  
---

# Launch the app and login
- launchApp:
    clearState: true

# Quick login
- waitForAnimationToEnd
- tapOn:
    id: "login-username-input"
- inputText: ${TEST_CUSTOMER_USERNAME}
- tapOn:
    id: "login-password-input"
- inputText: ${TEST_PASSWORD}
- tapOn:
    id: "login-submit-button"

# Wait for home screen
- waitForAnimationToEnd
- assertVisible:
    id: "tab-home"
    timeout: 10000

# Navigate to profile
- tapOn:
    id: "tab-profile"
    
# Wait for profile screen
- waitForAnimationToEnd
- assertVisible:
    id: "profile-change-password-button"

# Tap change password button
- tapOn:
    id: "profile-change-password-button"
    
# Wait for change password screen
- waitForAnimationToEnd
- assertVisible:
    id: "change-password-submit-button"
    
# Enter current password
- tapOn:
    id: "change-password-current-input"
- inputText: ${TEST_PASSWORD}

# Enter new password
- tapOn:
    id: "change-password-new-input"
- inputText: ${NEW_PASSWORD}

# Confirm new password
- tapOn:
    id: "change-password-confirm-input"
- inputText: ${NEW_PASSWORD}

# Take screenshot before submitting
- takeScreenshot: "change-password-filled"

# Submit password change
- tapOn:
    id: "change-password-submit-button"
    
# Wait for success
- waitForAnimationToEnd

# Verify success message or navigation
- assertVisible:
    anyOf:
      - text: "Password changed successfully"
      - text: "Password updated"
      - id: "tab-profile"  # Back to profile
    timeout: 10000
    
# Take screenshot of success
- takeScreenshot: "change-password-success"

# Note: In a real test, you would logout and login with the new password
# to verify the change was successful