appId: com.ceramicmarketplace.app
name: "Change Password Flow"
tags:
  - auth
  - password
  - profile

env:
  NEW_PASSWORD: "NewTest@12345678"

---

# Launch the app and login
- launchApp:
    clearState: true

# Quick login
- waitForAnimationToEnd
- tapOn:
    id: "login-username-input"
- inputText: ${TEST_CUSTOMER_USERNAME}
- hideKeyboard
- tapOn:
    id: "login-password-input"
- inputText: ${TEST_PASSWORD}
- hideKeyboard
- tapOn:
    id: "login-submit-button"

# Wait for home screen
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "tab-home"
    timeout: 20000

# Navigate to profile tab
- tapOn:
    id: "tab-profile"

# Wait for profile screen to load
- waitForAnimationToEnd
- takeScreenshot: "profile-screen"

# Wait for change password button to be visible
- extendedWaitUntil:
    visible:
      id: "profile-change-password-button"
    timeout: 10000

# Tap change password button
- tapOn:
    id: "profile-change-password-button"

# Wait for change password screen
- waitForAnimationToEnd
- assertVisible:
    id: "change-password-submit-button"

# Enter current password
- tapOn:
    id: "change-password-current-input"
- inputText: ${TEST_PASSWORD}
- hideKeyboard

# Enter new password
- tapOn:
    id: "change-password-new-input"
- inputText: ${NEW_PASSWORD}
- hideKeyboard

# Confirm new password
- tapOn:
    id: "change-password-confirm-input"
- inputText: ${NEW_PASSWORD}
- hideKeyboard

# Take screenshot before submitting
- takeScreenshot: "change-password-filled"

# Submit password change
- tapOn:
    id: "change-password-submit-button"

# Wait for success - could return to profile or show success toast
- waitForAnimationToEnd

# Take screenshot of result
- takeScreenshot: "change-password-result"

# Give time for navigation/toast
- extendedWaitUntil:
    visible:
      id: "tab-profile"
    timeout: 15000

# Take final screenshot
- takeScreenshot: "change-password-success"
