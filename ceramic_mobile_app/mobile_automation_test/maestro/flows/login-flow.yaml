# Reusable login flow
# Usage: - runFlow: flows/login-flow.yaml

appId: com.ceramicmarketplace.app
env:
  USERNAME: ${USERNAME:-test_customer}
  PASSWORD: ${PASSWORD:-Test@12345678}

---

# Check if already logged in by looking for home tab
- assertNotVisible:
    id: "login-username-input"
    optional: true
    
# If login screen not visible, we're already logged in
- ifTrue:
    notVisible:
      id: "login-username-input"
    commands:
      - stopFlow

# Enter credentials
- tapOn:
    id: "login-username-input"
- inputText: ${USERNAME}

- tapOn:
    id: "login-password-input"
- inputText: ${PASSWORD}

# Submit login
- tapOn:
    id: "login-submit-button"
    
# Wait for login to complete
- waitForAnimationToEnd
- assertVisible:
    id: "tab-home"
    timeout: 10000