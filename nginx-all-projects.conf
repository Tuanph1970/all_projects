# ============================================================================
# Nginx sites-available config for all projects
# ----------------------------------------------------------------------------
# This file belongs in /etc/nginx/sites-available/ (included inside http {}).
# DO NOT add top-level directives here (user, worker_processes, events {}).
#
# Installation:
#   sudo cp nginx-all-projects.conf /etc/nginx/sites-available/nginx-all-projects.conf
#   sudo ln -sf /etc/nginx/sites-available/nginx-all-projects.conf /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
# ============================================================================

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

# =========================================================================
# UPSTREAM DEFINITIONS
# =========================================================================

# Ceramic Marketplace API (Traefik gateway)
upstream ceramic_api {
    server 127.0.0.1:8002 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# Stock Predict API (Traefik gateway)
upstream stock_api {
    server 127.0.0.1:18004 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# Stock Frontend (React App)
upstream stock_frontend {
    server 127.0.0.1:3004 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# =========================================================================
# MAIN SERVER - Path-based routing for all projects
# =========================================================================
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 50M;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # =====================================================================
    # ROOT - API Directory
    # =====================================================================
    location = / {
        return 200 '{
    "server": "Unified API Gateway",
    "apis": {
        "ceramic": {
            "base_url": "/ceramic",
            "api": "/ceramic/api/v1",
            "health": "/ceramic/health"
        },
        "stock": {
            "base_url": "/stock",
            "api": "/stock/stock_helper/api/v2",
            "frontend": "/stock-app",
            "health": "/stock/health"
        }
    },
    "status": "online"
}';
        add_header Content-Type application/json;
    }

    # Gateway health check
    location = /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # =====================================================================
    # CERAMIC MARKETPLACE API - /ceramic/*
    # =====================================================================

    location = /ceramic/health {
        access_log off;
        return 200 '{"status":"healthy","service":"ceramic"}';
        add_header Content-Type application/json;
    }

    # Ceramic WebSocket for Chat
    location /ceramic/api/v1/chat/ws {
        rewrite ^/ceramic/(.*)$ /$1 break;
        proxy_pass http://ceramic_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
    }

    # Ceramic API
    location /ceramic/ {
        limit_req zone=api_limit burst=20 nodelay;

        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;

        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        rewrite ^/ceramic/(.*)$ /$1 break;
        proxy_pass http://ceramic_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /ceramic;
        proxy_buffering off;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # =====================================================================
    # STOCK PREDICT API - /stock/*
    # =====================================================================

    # Stock health check (proxied to Traefik which routes to stock-data-service)
    location = /stock/health {
        access_log off;
        proxy_pass http://stock_api/stock_helper/api/v2/stocks/health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Stock chatbot WebSocket
    location /stock/stock_helper/api/v2/chat/ws {
        rewrite ^/stock/(.*)$ /$1 break;
        proxy_pass http://stock_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
    }

    # Stock API and all sub-paths
    location /stock/ {
        limit_req zone=api_limit burst=20 nodelay;

        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;

        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        rewrite ^/stock/(.*)$ /$1 break;
        proxy_pass http://stock_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /stock;
        proxy_buffering off;
        proxy_connect_timeout 60s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }

    # Stock Frontend (React App)
    location /stock-app/ {
        rewrite ^/stock-app/(.*)$ /$1 break;
        proxy_pass http://stock_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # =====================================================================
    # ERROR PAGES
    # =====================================================================
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }

    # Block hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

# =========================================================================
# VIRTUAL HOSTS (domain-based routing)
# =========================================================================

server {
    listen 80;
    server_name ceramic.localhost ceramic.yourdomain.com;

    location / {
        proxy_pass http://ceramic_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name stock.localhost stock.yourdomain.com;

    location / {
        proxy_pass http://stock_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
