# Reusable seller login flow
# Usage: - runFlow: flows/seller-login-flow.yaml

appId: com.mercai.app
env:
  USERNAME: ${USERNAME:-test_seller}
  PASSWORD: ${PASSWORD:-Test@12345678}

---

# Check if already logged in by looking for seller dashboard tab
- assertNotVisible:
    id: "login-username-input"
    optional: true
    
# If login screen not visible, we might be already logged in
- ifTrue:
    notVisible:
      id: "login-username-input"
    commands:
      - stopFlow

# Enter seller credentials
- tapOn:
    id: "login-username-input"
- inputText: ${USERNAME}

- tapOn:
    id: "login-password-input"
- inputText: ${PASSWORD}

# Submit login
- tapOn:
    id: "login-submit-button"
    
# Wait for login to complete
- waitForAnimationToEnd

# Verify seller dashboard is accessible
- assertVisible:
    id: "tab-dashboard"
    timeout: 10000