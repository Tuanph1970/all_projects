# Maestro Configuration for Mercai
name: "Mercai Tests"

# App configuration
appId: com.mercai.app
workspace: /home/tuanph/all_projects/mercai/mobile_automation_test/maestro

# Environment variables for testing
env:
  API_BASE_URL: "http://localhost:8002"
  AUTH_SERVICE_URL: "http://localhost:8002/api/auth"
  PRODUCT_SERVICE_URL: "http://localhost:8002/api/products"
  ORDER_SERVICE_URL: "http://localhost:8002/api/orders"
  SELLER_SERVICE_URL: "http://localhost:8002/api/sellers"
  CHAT_SERVICE_URL: "http://localhost:8002/api/chat"

  # Common password for all test users
  TEST_PASSWORD: "Test@12345678"

  # Customer role user
  TEST_CUSTOMER_USERNAME: "test_customer_user"
  TEST_CUSTOMER_EMAIL: "test_customer_user@test.com"

  # Seller role user
  TEST_SELLER_USERNAME: "test_seller_user"
  TEST_SELLER_EMAIL: "test_seller_user@test.com"

  # Dual role user (can switch between customer and seller)
  TEST_DUAL_USERNAME: "test_dual_user"
  TEST_DUAL_EMAIL: "test_dual_user@test.com"
  
# Test configuration
config:
  # Timeouts
  defaultTimeout: 30000  # 30 seconds
  networkTimeout: 60000  # 60 seconds for API calls
  
  # Retry configuration
  maxRetries: 3
  retryDelay: 2000  # 2 seconds
  
  # Screenshots
  screenshots:
    enabled: true
    onFailure: true
    onSuccess: false
    
  # Video recording
  video:
    enabled: false  # Enable for debugging
    
  # Test data
  testData:
    users:
      - email: "buyer1@test.com"
        password: "Test123!"
        role: "buyer"
      - email: "seller1@test.com"
        password: "Test123!"
        role: "seller"
        
# Device preferences
devices:
  android:
    preferredAPI: 30
    preferredDevice: "Pixel_4"
  ios:
    preferredVersion: "16.0"
    preferredDevice: "iPhone 14"