# =============================================================================
# Nginx Multi-Project Configuration
#
# SUPERSEDED -- kept for reference only.
#
# Two things replaced it:
#   * ../../../nginx-all-projects.conf is the host nginx config actually in
#     use, and it serves mercai under /mercai (not the /mercai-app prefix
#     below, which nothing has served for some time).
#   * Public traffic no longer passes through host nginx at all. A Cloudflare
#     Tunnel forwards api.mercai.tuan1970.com straight to the Traefik gateway
#     on :8002 -- see ../../DEPLOYMENT_CLOUDFLARE.md.
#
# Projects:
#   /mercai-app  -> Mercai API (port 8002)
#   /business     -> Business Club API (port 8000) [if needed]
#   Add more projects below...
#
# Copy to: /etc/nginx/nginx.conf
# =============================================================================

user www-data;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 50M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/rss+xml font/truetype font/opentype
               application/vnd.ms-fontobject image/svg+xml;

    # ==========================================================================
    # UPSTREAM DEFINITIONS (Add your project upstreams here)
    # ==========================================================================

    # Mercai API (Traefik Gateway)
    upstream mercai_app_api {
        server 127.0.0.1:8002 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # Business Club API (uncomment if needed)
    # upstream business_api {
    #     server 127.0.0.1:8000 max_fails=3 fail_timeout=30s;
    #     keepalive 32;
    # }

    # Add more upstreams for other projects...

    # ==========================================================================
    # RATE LIMITING ZONES
    # ==========================================================================
    limit_req_zone $binary_remote_addr zone=mercai_limit:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # ==========================================================================
    # MAIN SERVER BLOCK
    # ==========================================================================
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name api.mercai.tuan1970.com _;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Client limits
        client_max_body_size 50M;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # ==================================================================
        # ROOT - List available APIs
        # ==================================================================
        location = / {
            return 200 '{"server": "api.mercai.tuan1970.com", "apis": {"mercai-app": "/mercai-app/api/v1"}, "status": "online"}';
            add_header Content-Type application/json;
        }

        # ==================================================================
        # MERCAI - /mercai-app/*
        # ==================================================================

        # Health Check
        location /mercai-app/health {
            access_log off;
            proxy_pass http://mercai_app_api/health;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # API Documentation
        location ~ ^/mercai-app/(docs|redoc|openapi\.json)$ {
            rewrite ^/mercai-app/(.*)$ /$1 break;
            proxy_pass http://mercai_app_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WebSocket for Chat
        location /mercai-app/api/v1/chat/ws {
            rewrite ^/mercai-app/(.*)$ /$1 break;
            proxy_pass http://mercai_app_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Static uploaded files (product images)
        # Strips /mercai-app prefix, forwards to Traefik which routes
        # PathPrefix('/static/uploads') → seller-service (port 8005)
        location /mercai-app/static/ {
            rewrite ^/mercai-app/(.*)$ /$1 break;
            proxy_pass http://mercai_app_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header 'Access-Control-Allow-Origin' '*' always;
        }

        # API Endpoints
        location /mercai-app/api/ {
            limit_req zone=mercai_limit burst=20 nodelay;
            limit_conn conn_limit 20;

            # CORS
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
            add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;

            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*';
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS';
                add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization';
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain; charset=utf-8';
                add_header 'Content-Length' 0;
                return 204;
            }

            rewrite ^/mercai-app/(.*)$ /$1 break;
            proxy_pass http://mercai_app_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /mercai-app;
            proxy_buffering off;
        }

        # Mercai Root
        location = /mercai-app {
            return 200 '{"service": "Mercai API", "version": "1.0.0", "base_path": "/mercai-app", "endpoints": {"auth": "/mercai-app/api/v1/auth", "products": "/mercai-app/api/v1/products", "orders": "/mercai-app/api/v1/orders", "chat": "/mercai-app/api/v1/chat", "seller": "/mercai-app/api/v1/seller"}}';
            add_header Content-Type application/json;
        }

        location = /mercai-app/ {
            return 200 '{"service": "Mercai API", "version": "1.0.0", "base_path": "/mercai-app", "endpoints": {"auth": "/mercai-app/api/v1/auth", "products": "/mercai-app/api/v1/products", "orders": "/mercai-app/api/v1/orders", "chat": "/mercai-app/api/v1/chat", "seller": "/mercai-app/api/v1/seller"}}';
            add_header Content-Type application/json;
        }

        # ==================================================================
        # BUSINESS APP - /business/* (Uncomment if needed)
        # ==================================================================
        # location /business/ {
        #     rewrite ^/business/(.*)$ /$1 break;
        #     proxy_pass http://business_api;
        #     proxy_http_version 1.1;
        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #     proxy_set_header X-Forwarded-Proto $scheme;
        # }

        # ==================================================================
        # ADD MORE PROJECTS HERE
        # ==================================================================
        # Example:
        # location /another-app/ {
        #     rewrite ^/another-app/(.*)$ /$1 break;
        #     proxy_pass http://another_app_upstream;
        #     ...
        # }

        # ==================================================================
        # TRAEFIK DASHBOARD (Optional - for debugging)
        # ==================================================================
        location /traefik/ {
            # Restrict to local network or specific IPs in production
            # allow 10.0.0.0/8;
            # deny all;
            proxy_pass http://127.0.0.1:8080/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ==================================================================
        # Security: Block sensitive files
        # ==================================================================
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }

    # ==========================================================================
    # HTTPS SERVER (Uncomment when SSL is configured)
    # ==========================================================================
    # server {
    #     listen 443 ssl http2;
    #     listen [::]:443 ssl http2;
    #     server_name api.mercai.tuan1970.com;
    #
    #     ssl_certificate /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    #     ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_prefer_server_ciphers off;
    #     ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    #
    #     add_header Strict-Transport-Security "max-age=63072000" always;
    #
    #     # Copy all location blocks from above
    # }
}
