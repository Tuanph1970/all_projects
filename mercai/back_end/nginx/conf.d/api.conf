# =============================================================================
# Nginx Server Configuration for Mercai API
# Optimized for both HTTP and HTTPS traffic
# =============================================================================

# Upstream definition for the Python FastAPI backend
upstream mercai_api {
    # Use Docker service name and port
    server api:8002;

    # Connection settings for better performance
    keepalive 32;
    keepalive_requests 100;
    keepalive_timeout 60s;
}

# =============================================================================
# HTTP Server Configuration
# =============================================================================
server {
    listen 80;
    listen [::]:80;

    server_name _;  # Replace with your domain in production (e.g., api.yourdomain.com)

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Client upload size limit (should match API configuration)
    client_max_body_size 20M;

    # Timeout settings
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Buffer settings
    proxy_buffering on;
    proxy_buffer_size 4k;
    proxy_buffers 8 4k;
    proxy_busy_buffers_size 8k;

    # =================================================================
    # Health Check Endpoint
    # =================================================================
    location /health {
        access_log off;
        proxy_pass http://mercai_api/health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # =================================================================
    # API Documentation Endpoints (Swagger/ReDoc)
    # =================================================================
    location ~ ^/(docs|redoc|openapi.json) {
        proxy_pass http://mercai_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    # =================================================================
    # API Endpoints
    # =================================================================
    location /api/ {
        # CORS headers (adjust for production)
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;

        # Handle preflight requests
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization';
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        # Proxy to FastAPI backend
        proxy_pass http://mercai_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Disable buffering for streaming responses
        proxy_buffering off;
    }

    # =================================================================
    # Static Files and Uploads
    # =================================================================
    location /uploads/ {
        alias /app/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff";

        # Security: Prevent script execution
        location ~ \.(php|py|pl|sh|cgi)$ {
            deny all;
        }
    }

    # =================================================================
    # Root Location (API Status)
    # =================================================================
    location / {
        proxy_pass http://mercai_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # =================================================================
    # Security: Block access to sensitive files
    # =================================================================
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ /\.env {
        deny all;
        access_log off;
        log_not_found off;
    }

    # =================================================================
    # Logging Configuration
    # =================================================================
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;
}

