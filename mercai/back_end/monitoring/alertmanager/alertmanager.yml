# Alertmanager Configuration for Mercai
# =============================================================================

global:
  # Global SMTP settings
  smtp_smarthost: 'smtp.gmail.com:587'
  smtp_from: 'alertmanager@mercai.com'
  smtp_auth_username: '${SMTP_USERNAME}'
  smtp_auth_password: '${SMTP_PASSWORD}'
  smtp_require_tls: true

  # Slack settings (optional)
  slack_api_url: '${SLACK_WEBHOOK_URL}'

  # Default resolve timeout
  resolve_timeout: 5m

# Route tree
route:
  # Default receiver
  receiver: 'default-receiver'

  # Group alerts by these labels
  group_by: ['alertname', 'severity', 'service']

  # Wait time before sending first notification
  group_wait: 30s

  # Wait time before sending updated notifications
  group_interval: 5m

  # Wait time before resending
  repeat_interval: 4h

  # Child routes for specific alerts
  routes:
    # Critical alerts - immediate notification
    - match:
        severity: critical
      receiver: 'critical-alerts'
      group_wait: 10s
      repeat_interval: 1h

    # Warning alerts
    - match:
        severity: warning
      receiver: 'warning-alerts'
      group_wait: 1m
      repeat_interval: 4h

    # Database alerts
    - match:
        alertname: MySQLDown
      receiver: 'database-alerts'
      group_wait: 10s

    - match:
        alertname: RedisDown
      receiver: 'database-alerts'
      group_wait: 10s

# Inhibition rules
inhibit_rules:
  # If critical, suppress warning
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'service']

  # If service is down, suppress other alerts for that service
  - source_match:
      alertname: 'ServiceDown'
    target_match_re:
      alertname: '.+'
    equal: ['job']

# Receivers
receivers:
  # Default receiver (email)
  - name: 'default-receiver'
    email_configs:
      - to: 'admin@mercai.com'
        send_resolved: true
        headers:
          Subject: '[Mercai] {{ .GroupLabels.alertname }} - {{ .Status }}'

  # Critical alerts (email + slack)
  - name: 'critical-alerts'
    email_configs:
      - to: 'oncall@mercai.com'
        send_resolved: true
        headers:
          Subject: '[CRITICAL] {{ .GroupLabels.alertname }} - {{ .Status }}'
    slack_configs:
      - channel: '#alerts-critical'
        send_resolved: true
        title: '{{ .GroupLabels.alertname }}'
        text: |-
          {{ range .Alerts }}
          *Alert:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          *Severity:* {{ .Labels.severity }}
          *Service:* {{ .Labels.job }}
          {{ end }}
        color: '{{ if eq .Status "firing" }}danger{{ else }}good{{ end }}'

  # Warning alerts
  - name: 'warning-alerts'
    email_configs:
      - to: 'dev-team@mercai.com'
        send_resolved: true
        headers:
          Subject: '[WARNING] {{ .GroupLabels.alertname }} - {{ .Status }}'

  # Database alerts
  - name: 'database-alerts'
    email_configs:
      - to: 'dba@mercai.com'
        send_resolved: true
        headers:
          Subject: '[DATABASE] {{ .GroupLabels.alertname }} - {{ .Status }}'
    slack_configs:
      - channel: '#alerts-database'
        send_resolved: true

# Templates (optional)
templates:
  - '/etc/alertmanager/templates/*.tmpl'
