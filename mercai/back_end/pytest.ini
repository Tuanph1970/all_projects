[pytest]
# Scoped to tests/ deliberately: the legacy back_end/test_*.py scripts are
# requests-driven smoke tests that need a live server and database, and must
# not be collected here.
testpaths = tests
python_files = test_*.py
python_functions = test_*
addopts = -q --strict-markers

filterwarnings =
    # Pre-existing model warning: Category.parent / Category.children overlap.
    # Unrelated to the code under test; silenced so real warnings stay visible.
    ignore:relationship 'Category.children':sqlalchemy.exc.SAWarning
