# Traefik Dynamic Configuration - Middlewares
# Rate limiting, headers, and other security configurations

http:
  middlewares:
    # Rate Limiting Middleware
    ratelimit:
      rateLimit:
        average: 1000
        burst: 2000
        period: 1m
        sourceCriterion:
          ipStrategy:
            depth: 1

    # Coarse abuse guard for the intel endpoints. NOT the cost control.
    #
    # It was sized at 30/min when these endpoints meant a GPU generation call.
    # That is no longer what they are: reads (price position, comparable list)
    # are ordinary database queries, and the only expensive path -- an outbound
    # fetch on add/refresh -- is already bounded twice inside the service, by a
    # per-seller quota (AI_QUOTA_PER_HOUR/DAY) and a per-host politeness budget
    # (INTEL_HOST_INTERVAL_SECONDS). Leaving 30/min here just meant a handful of
    # sellers opening a screen at once got 429s for no reason; a plain API test
    # run tripped it after eleven requests.
    #
    # Keyed on Cf-Connecting-IP rather than an X-Forwarded-For depth. Every
    # request arrives through cloudflared from localhost, so an IP strategy is
    # arithmetic on a header we do not control the shape of, and getting it
    # wrong silently turns a per-client limit into a global one -- which would
    # cap ALL sellers together and be invisible until it bit. Cloudflare always
    # sets this header to the true client address. Requests that arrive without
    # it (local development straight to :8002, bypassing the tunnel) share one
    # bucket, which is the right trade for a development path.
    intel-ratelimit:
      rateLimit:
        average: 120
        burst: 40
        period: 1m
        sourceCriterion:
          requestHeaderName: Cf-Connecting-IP

    # CORS Headers
    cors:
      headers:
        accessControlAllowMethods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          - OPTIONS
        accessControlAllowHeaders:
          - Content-Type
          - Authorization
          - X-Requested-With
          - X-Anon-Id
        accessControlAllowOriginList:
          - "*"
        accessControlAllowCredentials: true
        accessControlMaxAge: 100
        addVaryHeader: true

    # Security Headers
    security-headers:
      headers:
        frameDeny: true
        sslRedirect: false
        browserXssFilter: true
        contentTypeNosniff: true
        referrerPolicy: "strict-origin-when-cross-origin"
        customResponseHeaders:
          X-Robots-Tag: "noindex,nofollow,nosnippet,noarchive,notranslate,noimageindex"

    # Retry Middleware for Circuit Breaker pattern
    retry:
      retry:
        attempts: 3
        initialInterval: 100ms

    # Compress Responses
    compress:
      compress:
        excludedContentTypes:
          - text/event-stream

    # Strip Prefix (if needed for routing)
    strip-api-prefix:
      stripPrefix:
        prefixes:
          - "/api"

  # Service-level configurations
  services:
    # Health check service aggregator
    health-aggregator:
      loadBalancer:
        healthCheck:
          path: /health
          interval: 10s
          timeout: 3s
