<svg viewBox="0 0 900 650" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="stepGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#475569"/>
    </marker>
  </defs>
  <rect width="900" height="650" fill="#f8fafc"/>
  <text x="450" y="35" text-anchor="middle" font-size="22" font-weight="bold" fill="#0f172a">The Planned Trading Approach — 7 Steps</text>
  <text x="450" y="58" text-anchor="middle" font-size="13" fill="#64748b" font-style="italic">"If making money is a slow process, losing it is quickly done." — Ihara Saikaku</text>

  <!-- Step boxes -->
  <g>
    <rect x="50" y="90" width="200" height="80" rx="10" fill="url(#stepGrad)"/>
    <text x="150" y="120" text-anchor="middle" fill="white" font-size="14" font-weight="bold">STEP 1</text>
    <text x="150" y="142" text-anchor="middle" fill="white" font-size="13">Define a Trading</text>
    <text x="150" y="158" text-anchor="middle" fill="white" font-size="13">Philosophy</text>
  </g>

  <g>
    <rect x="350" y="90" width="200" height="80" rx="10" fill="url(#stepGrad)"/>
    <text x="450" y="120" text-anchor="middle" fill="white" font-size="14" font-weight="bold">STEP 2</text>
    <text x="450" y="142" text-anchor="middle" fill="white" font-size="13">Choose Markets</text>
    <text x="450" y="158" text-anchor="middle" fill="white" font-size="13">to Be Traded</text>
  </g>

  <g>
    <rect x="650" y="90" width="200" height="80" rx="10" fill="url(#stepGrad)"/>
    <text x="750" y="120" text-anchor="middle" fill="white" font-size="14" font-weight="bold">STEP 3</text>
    <text x="750" y="142" text-anchor="middle" fill="white" font-size="13">Specify Risk</text>
    <text x="750" y="158" text-anchor="middle" fill="white" font-size="13">Control Plan</text>
  </g>

  <g>
    <rect x="650" y="220" width="200" height="80" rx="10" fill="url(#stepGrad)"/>
    <text x="750" y="250" text-anchor="middle" fill="white" font-size="14" font-weight="bold">STEP 4</text>
    <text x="750" y="272" text-anchor="middle" fill="white" font-size="13">Establish Planning</text>
    <text x="750" y="288" text-anchor="middle" fill="white" font-size="13">Time Routine</text>
  </g>

  <g>
    <rect x="350" y="220" width="200" height="80" rx="10" fill="url(#stepGrad)"/>
    <text x="450" y="250" text-anchor="middle" fill="white" font-size="14" font-weight="bold">STEP 5</text>
    <text x="450" y="272" text-anchor="middle" fill="white" font-size="13">Maintain a</text>
    <text x="450" y="288" text-anchor="middle" fill="white" font-size="13">Trader's Notebook</text>
  </g>

  <g>
    <rect x="50" y="220" width="200" height="80" rx="10" fill="url(#stepGrad)"/>
    <text x="150" y="250" text-anchor="middle" fill="white" font-size="14" font-weight="bold">STEP 6</text>
    <text x="150" y="272" text-anchor="middle" fill="white" font-size="13">Maintain a</text>
    <text x="150" y="288" text-anchor="middle" fill="white" font-size="13">Trader's Diary</text>
  </g>

  <g>
    <rect x="350" y="350" width="200" height="80" rx="10" fill="#10b981"/>
    <text x="450" y="380" text-anchor="middle" fill="white" font-size="14" font-weight="bold">STEP 7</text>
    <text x="450" y="402" text-anchor="middle" fill="white" font-size="13">Analyze Personal</text>
    <text x="450" y="418" text-anchor="middle" fill="white" font-size="13">Trading</text>
  </g>

  <!-- Arrows connecting steps -->
  <line x1="250" y1="130" x2="345" y2="130" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="550" y1="130" x2="645" y2="130" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="750" y1="170" x2="750" y2="215" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="645" y1="260" x2="555" y2="260" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="345" y1="260" x2="255" y2="260" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="150" y1="300" x2="150" y2="380" stroke="#475569" stroke-width="2"/>
  <line x1="150" y1="380" x2="345" y2="380" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Feedback loop -->
  <path d="M 550 390 Q 700 390 700 250 Q 700 130 555 130" stroke="#10b981" stroke-width="2" fill="none" stroke-dasharray="5,5" marker-end="url(#arrow)"/>
  <text x="730" y="200" font-size="11" fill="#10b981" font-style="italic">feedback loop</text>

  <!-- Bottom panel: Key principles -->
  <rect x="50" y="470" width="800" height="160" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="450" y="495" text-anchor="middle" font-size="15" font-weight="bold" fill="#78350f">Why a Plan Matters</text>
  <text x="70" y="520" font-size="12" fill="#78350f">• Successful speculators all use a systematic, disciplined approach</text>
  <text x="70" y="540" font-size="12" fill="#78350f">• A plan replaces emotion-driven decisions with rule-driven actions</text>
  <text x="70" y="560" font-size="12" fill="#78350f">• Without a plan: hot tips, gut feelings, market chatter — recipe for losses</text>
  <text x="70" y="580" font-size="12" fill="#78350f">• With a plan: defined philosophy, markets, risk, routine, records, and review</text>
  <text x="70" y="605" font-size="12" font-weight="bold" fill="#78350f">A trading plan is to a trader what blueprints are to a builder.</text>
</svg>
