<svg viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg">
  <rect width="900" height="600" fill="#f8fafc"/>
  <text x="450" y="35" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">Risk Control Plan — 7 Elements</text>
  <text x="450" y="58" text-anchor="middle" font-size="13" fill="#64748b" font-style="italic">"The rigid control of losses is perhaps the most critical prerequisite for successful trading."</text>

  <!-- Center hub -->
  <circle cx="450" cy="310" r="70" fill="#1e40af"/>
  <text x="450" y="305" text-anchor="middle" fill="white" font-size="14" font-weight="bold">RISK</text>
  <text x="450" y="325" text-anchor="middle" fill="white" font-size="14" font-weight="bold">CONTROL</text>

  <!-- 7 spokes -->
  <!-- 1. Max Risk Per Trade -->
  <g>
    <line x1="450" y1="240" x2="450" y2="160" stroke="#475569" stroke-width="2"/>
    <rect x="340" y="100" width="220" height="60" rx="8" fill="#fee2e2" stroke="#dc2626"/>
    <text x="450" y="125" text-anchor="middle" font-size="13" font-weight="bold" fill="#991b1b">1. Max Risk Per Trade</text>
    <text x="450" y="145" text-anchor="middle" font-size="11" fill="#7f1d1d">Cap at ~3% of equity (never &gt;7%)</text>
  </g>

  <!-- 2. Stop-Loss Strategy (top-right) -->
  <g>
    <line x1="510" y1="270" x2="600" y2="200" stroke="#475569" stroke-width="2"/>
    <rect x="600" y="170" width="220" height="60" rx="8" fill="#fed7aa" stroke="#ea580c"/>
    <text x="710" y="195" text-anchor="middle" font-size="13" font-weight="bold" fill="#7c2d12">2. Stop-Loss Strategy</text>
    <text x="710" y="215" text-anchor="middle" font-size="11" fill="#7c2d12">Know exit BEFORE you enter</text>
  </g>

  <!-- 3. Diversification (right) -->
  <g>
    <line x1="520" y1="310" x2="610" y2="310" stroke="#475569" stroke-width="2"/>
    <rect x="610" y="280" width="220" height="60" rx="8" fill="#fef08a" stroke="#ca8a04"/>
    <text x="720" y="305" text-anchor="middle" font-size="13" font-weight="bold" fill="#713f12">3. Diversification</text>
    <text x="720" y="325" text-anchor="middle" font-size="11" fill="#713f12">Multiple uncorrelated markets</text>
  </g>

  <!-- 4. Reduced Leverage Correlated (bottom-right) -->
  <g>
    <line x1="510" y1="350" x2="600" y2="420" stroke="#475569" stroke-width="2"/>
    <rect x="600" y="395" width="220" height="60" rx="8" fill="#bbf7d0" stroke="#16a34a"/>
    <text x="710" y="420" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">4. Lower Leverage if Correlated</text>
    <text x="710" y="440" text-anchor="middle" font-size="11" fill="#14532d">Avoid stacking similar bets</text>
  </g>

  <!-- 5. Volatility Adjustments (bottom) -->
  <g>
    <line x1="450" y1="380" x2="450" y2="465" stroke="#475569" stroke-width="2"/>
    <rect x="340" y="465" width="220" height="60" rx="8" fill="#bae6fd" stroke="#0284c7"/>
    <text x="450" y="490" text-anchor="middle" font-size="13" font-weight="bold" fill="#0c4a6e">5. Volatility Adjustments</text>
    <text x="450" y="510" text-anchor="middle" font-size="11" fill="#0c4a6e">Size DOWN in volatile markets</text>
  </g>

  <!-- 6. Adjust Leverage to Equity (bottom-left) -->
  <g>
    <line x1="390" y1="350" x2="300" y2="420" stroke="#475569" stroke-width="2"/>
    <rect x="80" y="395" width="220" height="60" rx="8" fill="#ddd6fe" stroke="#7c3aed"/>
    <text x="190" y="420" text-anchor="middle" font-size="13" font-weight="bold" fill="#4c1d95">6. Adjust to Equity Changes</text>
    <text x="190" y="440" text-anchor="middle" font-size="11" fill="#4c1d95">Equity drops 20% → leverage drops 20%</text>
  </g>

  <!-- 7. Losing Period Adjustments (left) -->
  <g>
    <line x1="380" y1="310" x2="290" y2="310" stroke="#475569" stroke-width="2"/>
    <rect x="70" y="280" width="220" height="60" rx="8" fill="#fbcfe8" stroke="#db2777"/>
    <text x="180" y="305" text-anchor="middle" font-size="13" font-weight="bold" fill="#831843">7. Losing-Streak Cutback</text>
    <text x="180" y="325" text-anchor="middle" font-size="11" fill="#831843">Discretionary only — pause &amp; reset</text>
  </g>

  <!-- Bottom note -->
  <rect x="60" y="540" width="780" height="50" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="450" y="565" text-anchor="middle" font-size="12" fill="#78350f">The author calls this "risk control" rather than "money management" — losses must be controlled rigidly,</text>
  <text x="450" y="582" text-anchor="middle" font-size="12" fill="#78350f">not just managed. One bad lapse can knock a trader out of the game permanently.</text>
</svg>
