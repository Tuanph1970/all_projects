<svg viewBox="0 0 800 580" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="580" fill="#f8fafc"/>
  <text x="400" y="35" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">Trader's Diary &amp; Self-Analysis</text>

  <!-- Diary card mockup -->
  <g transform="translate(50, 70)">
    <rect x="0" y="0" width="700" height="280" rx="10" fill="white" stroke="#1e40af" stroke-width="2"/>
    <rect x="0" y="0" width="700" height="40" rx="10" fill="#1e40af"/>
    <text x="350" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="white">Trade #047 — AAPL Long, March 15, 2024</text>
    
    <!-- Three sections of the diary entry -->
    <text x="20" y="65" font-size="13" font-weight="bold" fill="#1e3a8a">1. Reasons for Trade (filled at entry, not after)</text>
    <text x="35" y="85" font-size="12" fill="#334155">• Daily chart formed a 3-week cup-and-handle pattern with rising volume</text>
    <text x="35" y="103" font-size="12" fill="#334155">• Earnings beat last week + sector strength in semiconductors</text>
    <text x="35" y="121" font-size="12" fill="#334155">• Stop placed below handle low ($170), risking 1.5% of account ($1,500)</text>
    
    <line x1="20" y1="135" x2="680" y2="135" stroke="#cbd5e1"/>
    
    <text x="20" y="155" font-size="13" font-weight="bold" fill="#16a34a">2. How It Turned Out</text>
    <text x="35" y="175" font-size="12" fill="#334155">• Held 4 trading days. Trailing stop hit at $188.50 after a sharp reversal candle.</text>
    <text x="35" y="193" font-size="12" fill="#334155">• Net profit: +$4,050 (gross) − $20 commission = +$4,030</text>
    
    <line x1="20" y1="207" x2="680" y2="207" stroke="#cbd5e1"/>
    
    <text x="20" y="227" font-size="13" font-weight="bold" fill="#dc2626">3. Lessons (in CAPS for what really matters)</text>
    <text x="35" y="247" font-size="12" fill="#334155">• Pattern played out as expected — reinforces using cup-and-handle on liquid stocks</text>
    <text x="35" y="265" font-size="12" font-weight="bold" fill="#dc2626">• MISTAKE: ALMOST WIDENED STOP ON DAY 2 PULLBACK!! DO NOT WIDEN STOPS!!</text>
  </g>

  <!-- Bottom: 3 reasons it works -->
  <text x="400" y="385" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">Why a written diary works when memory fails</text>
  
  <rect x="50" y="405" width="220" height="140" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="160" y="430" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">Captures Reality</text>
  <text x="65" y="455" font-size="11" fill="#1e40af">Reasons written AT ENTRY</text>
  <text x="65" y="473" font-size="11" fill="#1e40af">prevent self-serving</text>
  <text x="65" y="491" font-size="11" fill="#1e40af">reconstruction after the</text>
  <text x="65" y="509" font-size="11" fill="#1e40af">fact ("I knew it would...")</text>
  <text x="65" y="532" font-size="11" font-style="italic" fill="#1e40af">→ Honest record</text>

  <rect x="290" y="405" width="220" height="140" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="400" y="430" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">Reveals Patterns</text>
  <text x="305" y="455" font-size="11" fill="#15803d">Repeated mistakes show up</text>
  <text x="305" y="473" font-size="11" fill="#15803d">when entries are reviewed.</text>
  <text x="305" y="491" font-size="11" fill="#15803d">"I keep buying tops in</text>
  <text x="305" y="509" font-size="11" fill="#15803d">small caps after a gap..."</text>
  <text x="305" y="532" font-size="11" font-style="italic" fill="#15803d">→ Insight</text>

  <rect x="530" y="405" width="220" height="140" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="640" y="430" text-anchor="middle" font-size="13" font-weight="bold" fill="#78350f">Eradicates Mistakes</text>
  <text x="545" y="455" font-size="11" fill="#92400e">CAPS + exclamation marks</text>
  <text x="545" y="473" font-size="11" fill="#92400e">make the lesson stick.</text>
  <text x="545" y="491" font-size="11" fill="#92400e">Periodic re-reading</text>
  <text x="545" y="509" font-size="11" fill="#92400e">reinforces the habit.</text>
  <text x="545" y="532" font-size="11" font-style="italic" fill="#92400e">→ Behavior change</text>
</svg>
