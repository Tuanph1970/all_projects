<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Arial, sans-serif">
  <rect width="800" height="500" fill="#fafafa"/>
  <text x="400" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a1a">Holding Winners — Trailing Stops vs. Fixed Objectives</text>

  <!-- Chart area -->
  <rect x="50" y="60" width="700" height="320" fill="#fff" stroke="#999"/>

  <!-- Grid -->
  <g stroke="#eee" stroke-width="1">
    <line x1="50" y1="120" x2="750" y2="120"/>
    <line x1="50" y1="180" x2="750" y2="180"/>
    <line x1="50" y1="240" x2="750" y2="240"/>
    <line x1="50" y1="300" x2="750" y2="300"/>
  </g>

  <!-- Y axis labels -->
  <g font-size="10" fill="#666">
    <text x="40" y="125" text-anchor="end">$140</text>
    <text x="40" y="185" text-anchor="end">$120</text>
    <text x="40" y="245" text-anchor="end">$110</text>
    <text x="40" y="305" text-anchor="end">$100</text>
    <text x="40" y="345" text-anchor="end">$90</text>
  </g>

  <!-- Entry -->
  <line x1="100" y1="290" x2="100" y2="305" stroke="#2e7d32" stroke-width="3"/>
  <text x="100" y="325" text-anchor="middle" font-size="11" fill="#2e7d32" font-weight="bold">Entry $100</text>

  <!-- Price path - strong uptrend -->
  <polyline points="100,300 140,290 180,275 220,260 260,250 300,235 340,225 380,210 420,200 460,180 500,165 540,150 580,135 620,120 660,110 700,105 740,115"
            fill="none" stroke="#1976d2" stroke-width="2.5"/>

  <!-- Fixed objective line -->
  <line x1="50" y1="220" x2="750" y2="220" stroke="#f57c00" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="745" y="215" text-anchor="end" font-size="11" fill="#f57c00" font-weight="bold">Fixed Objective $115</text>

  <!-- Exit point at fixed objective -->
  <circle cx="380" cy="220" r="7" fill="#f57c00" stroke="#fff" stroke-width="2"/>
  <text x="380" y="245" text-anchor="middle" font-size="10" fill="#f57c00" font-weight="bold">Exit too early!</text>

  <!-- Trailing stop staircase -->
  <g stroke="#7b1fa2" stroke-width="2" fill="none" stroke-dasharray="4,2">
    <line x1="100" y1="320" x2="180" y2="320"/>
    <line x1="180" y1="320" x2="180" y2="305"/>
    <line x1="180" y1="305" x2="260" y2="305"/>
    <line x1="260" y1="305" x2="260" y2="285"/>
    <line x1="260" y1="285" x2="340" y2="285"/>
    <line x1="340" y1="285" x2="340" y2="255"/>
    <line x1="340" y1="255" x2="420" y2="255"/>
    <line x1="420" y1="255" x2="420" y2="225"/>
    <line x1="420" y1="225" x2="500" y2="225"/>
    <line x1="500" y1="225" x2="500" y2="200"/>
    <line x1="500" y1="200" x2="580" y2="200"/>
    <line x1="580" y1="200" x2="580" y2="170"/>
    <line x1="580" y1="170" x2="660" y2="170"/>
    <line x1="660" y1="170" x2="660" y2="140"/>
    <line x1="660" y1="140" x2="740" y2="140"/>
  </g>

  <!-- Trailing stop exit -->
  <circle cx="730" cy="118" r="7" fill="#7b1fa2" stroke="#fff" stroke-width="2"/>
  <text x="730" y="100" text-anchor="middle" font-size="11" fill="#7b1fa2" font-weight="bold">Trailing exit $138</text>

  <text x="200" y="80" font-size="11" fill="#7b1fa2" font-weight="bold">— — Trailing stop (rises behind price)</text>

  <!-- Bottom panel: comparison -->
  <g>
    <rect x="50" y="395" width="340" height="90" fill="#fff3e0" stroke="#f57c00" rx="6"/>
    <text x="60" y="415" font-size="13" font-weight="bold" fill="#e65100">Fixed Objective approach</text>
    <text x="60" y="435" font-size="11" fill="#333">+ Locks in defined R:R per trade</text>
    <text x="60" y="450" font-size="11" fill="#333">– Caps your big wins</text>
    <text x="60" y="465" font-size="11" fill="#333">– You miss the trends that pay for losers</text>
    <text x="60" y="478" font-size="11" font-weight="bold" fill="#e65100">P/L: +$15</text>

    <rect x="410" y="395" width="340" height="90" fill="#f3e5f5" stroke="#7b1fa2" rx="6"/>
    <text x="420" y="415" font-size="13" font-weight="bold" fill="#4a148c">Trailing Stop approach (preferred)</text>
    <text x="420" y="435" font-size="11" fill="#333">+ Captures the full trend when it runs</text>
    <text x="420" y="450" font-size="11" fill="#333">+ Big winners offset many small losers</text>
    <text x="420" y="465" font-size="11" fill="#333">– Always gives back some open profit</text>
    <text x="420" y="478" font-size="11" font-weight="bold" fill="#4a148c">P/L: +$38</text>
  </g>
</svg>
