<svg viewBox="0 0 800 580" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="580" fill="#f8fafc"/>
  <text x="400" y="35" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">Maximum Risk Per Trade — The 3% Rule</text>

  <!-- Risk zones -->
  <text x="400" y="75" text-anchor="middle" font-size="14" font-weight="bold" fill="#334155">Risk Per Trade as % of Account Equity</text>
  
  <rect x="80" y="95" width="640" height="40" fill="#86efac"/>
  <rect x="80" y="95" width="180" height="40" fill="#22c55e"/>
  <rect x="260" y="95" width="180" height="40" fill="#fbbf24"/>
  <rect x="440" y="95" width="180" height="40" fill="#fb923c"/>
  <rect x="620" y="95" width="100" height="40" fill="#dc2626"/>
  
  <text x="170" y="120" text-anchor="middle" font-size="13" font-weight="bold" fill="white">Safe (≤3%)</text>
  <text x="350" y="120" text-anchor="middle" font-size="13" font-weight="bold" fill="white">Aggressive (3-5%)</text>
  <text x="530" y="120" text-anchor="middle" font-size="13" font-weight="bold" fill="white">Risky (5-7%)</text>
  <text x="670" y="120" text-anchor="middle" font-size="13" font-weight="bold" fill="white">Reconsider</text>
  
  <!-- Scale -->
  <line x1="80" y1="150" x2="720" y2="150" stroke="#475569" stroke-width="1"/>
  <line x1="80" y1="145" x2="80" y2="155" stroke="#475569"/>
  <line x1="260" y1="145" x2="260" y2="155" stroke="#475569"/>
  <line x1="440" y1="145" x2="440" y2="155" stroke="#475569"/>
  <line x1="620" y1="145" x2="620" y2="155" stroke="#475569"/>
  <line x1="720" y1="145" x2="720" y2="155" stroke="#475569"/>
  <text x="80" y="170" text-anchor="middle" font-size="11" fill="#475569">0%</text>
  <text x="260" y="170" text-anchor="middle" font-size="11" fill="#475569">3%</text>
  <text x="440" y="170" text-anchor="middle" font-size="11" fill="#475569">5%</text>
  <text x="620" y="170" text-anchor="middle" font-size="11" fill="#475569">7%</text>
  <text x="720" y="170" text-anchor="middle" font-size="11" fill="#475569">&gt;7%</text>

  <!-- Worked example -->
  <rect x="60" y="200" width="680" height="240" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="400" y="225" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e3a8a">Position Sizing Formula</text>
  
  <rect x="200" y="240" width="400" height="50" rx="5" fill="white" stroke="#3b82f6"/>
  <text x="400" y="263" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e3a8a">Shares = (Equity × Risk%) ÷ (Entry − Stop)</text>
  <text x="400" y="280" text-anchor="middle" font-size="11" fill="#64748b">distance from entry to stop, in $ per share</text>

  <text x="80" y="315" font-size="13" font-weight="bold" fill="#0f172a">Example — Trader with $100,000, 3% risk cap, buying TSLA at $200, stop at $190:</text>
  <text x="80" y="340" font-size="12" fill="#334155">  • Max $ risk = $100,000 × 0.03 = <tspan font-weight="bold">$3,000</tspan></text>
  <text x="80" y="362" font-size="12" fill="#334155">  • Risk per share = $200 − $190 = <tspan font-weight="bold">$10</tspan></text>
  <text x="80" y="384" font-size="12" fill="#334155">  • Max position size = $3,000 ÷ $10 = <tspan font-weight="bold" fill="#16a34a">300 shares</tspan></text>
  <text x="80" y="410" font-size="12" font-style="italic" fill="#475569">If TSLA hits the $190 stop, you lose $3,000 (3% of equity) — recoverable.</text>
  <text x="80" y="428" font-size="12" font-style="italic" fill="#475569">Without sizing rules, a trader might buy 500 shares and lose $5,000 (5%) — twice as painful.</text>

  <!-- Why it matters -->
  <rect x="60" y="465" width="680" height="100" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="400" y="490" text-anchor="middle" font-size="14" font-weight="bold" fill="#78350f">Why this rule is the backbone of survival</text>
  <text x="80" y="513" font-size="12" fill="#78350f">• 10 losses in a row at 3% = down ~26% (recoverable)</text>
  <text x="80" y="533" font-size="12" fill="#78350f">• 10 losses in a row at 10% = down ~65% (need a 186% gain just to break even)</text>
  <text x="80" y="553" font-size="12" font-weight="bold" fill="#78350f">Drawdown math is brutal — small risk per trade keeps you in the game.</text>
</svg>
