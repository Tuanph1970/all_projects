<svg viewBox="0 0 800 540" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="540" fill="#f8fafc"/>
  <text x="400" y="35" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">Planning Time Routine — 30-60 Minutes Each Evening</text>

  <!-- Clock illustration -->
  <g transform="translate(400, 180)">
    <circle cx="0" cy="0" r="100" fill="white" stroke="#1e40af" stroke-width="3"/>
    <circle cx="0" cy="0" r="5" fill="#1e40af"/>
    <line x1="0" y1="0" x2="0" y2="-70" stroke="#1e40af" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="50" y2="20" stroke="#1e40af" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Hour markers -->
    <text x="0" y="-80" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e40af">12</text>
    <text x="80" y="5" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e40af">3</text>
    <text x="0" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e40af">6</text>
    <text x="-80" y="5" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e40af">9</text>
  </g>

  <!-- Three task boxes around clock -->
  <g>
    <rect x="40" y="100" width="280" height="80" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="180" y="125" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e3a8a">1. Update Systems &amp; Charts</text>
    <text x="55" y="148" font-size="11" fill="#1e40af">• Refresh indicators with today's close</text>
    <text x="55" y="164" font-size="11" fill="#1e40af">• Re-check fundamentals on news days</text>
  </g>

  <g>
    <rect x="480" y="100" width="280" height="80" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="620" y="125" text-anchor="middle" font-size="14" font-weight="bold" fill="#14532d">2. Plan New Trades</text>
    <text x="495" y="148" font-size="11" fill="#15803d">• Identify next-day setups</text>
    <text x="495" y="164" font-size="11" fill="#15803d">• Specify entry: market, limit, contingent</text>
  </g>

  <g>
    <rect x="260" y="320" width="280" height="80" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="400" y="345" text-anchor="middle" font-size="14" font-weight="bold" fill="#78350f">3. Update Stops on Open Positions</text>
    <text x="275" y="368" font-size="11" fill="#92400e">• Adjust trailing stops only IN your favor</text>
    <text x="275" y="384" font-size="11" fill="#92400e">• Never widen a stop after you're in</text>
  </g>

  <!-- Bottom: routine box -->
  <rect x="50" y="430" width="700" height="90" rx="10" fill="#f1f5f9" stroke="#64748b"/>
  <text x="400" y="455" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">Habit, not heroism</text>
  <text x="65" y="478" font-size="12" fill="#334155">Done every evening, this routine keeps the trader ahead of the market open. The work is small,</text>
  <text x="65" y="498" font-size="12" fill="#334155">repetitive, and unglamorous — exactly the qualities that compound into long-term edge.</text>
</svg>
