<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="600" fill="#f8fafc"/>
  <text x="400" y="35" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">Adjusting Position Size: Volatility &amp; Equity Changes</text>

  <!-- Top section: Volatility Adjustment -->
  <text x="400" y="75" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e3a8a">Volatility Adjustment — fewer shares when ATR is wider</text>
  
  <!-- Two stocks comparison -->
  <rect x="50" y="100" width="340" height="180" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="220" y="125" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">Calm Stock (KO)</text>
  <text x="65" y="150" font-size="12" fill="#1e40af">Price: $60 · Daily ATR: $1</text>
  <text x="65" y="172" font-size="12" fill="#1e40af">Stop placed 2 × ATR = $2 below</text>
  <text x="65" y="194" font-size="12" fill="#1e40af">Risk per share = $2</text>
  <text x="65" y="220" font-size="13" font-weight="bold" fill="#1e3a8a">$3,000 risk budget ÷ $2 = 1,500 shares</text>
  <text x="65" y="245" font-size="11" font-style="italic" fill="#1e40af">Capital deployed: $90,000</text>

  <rect x="410" y="100" width="340" height="180" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="580" y="125" text-anchor="middle" font-size="13" font-weight="bold" fill="#991b1b">Wild Stock (TSLA)</text>
  <text x="425" y="150" font-size="12" fill="#7f1d1d">Price: $250 · Daily ATR: $10</text>
  <text x="425" y="172" font-size="12" fill="#7f1d1d">Stop placed 2 × ATR = $20 below</text>
  <text x="425" y="194" font-size="12" fill="#7f1d1d">Risk per share = $20</text>
  <text x="425" y="220" font-size="13" font-weight="bold" fill="#991b1b">$3,000 risk budget ÷ $20 = 150 shares</text>
  <text x="425" y="245" font-size="11" font-style="italic" fill="#7f1d1d">Capital deployed: $37,500</text>

  <text x="400" y="305" text-anchor="middle" font-size="12" font-style="italic" fill="#475569">Same dollar risk ($3,000), wildly different share counts. The stop distance, not the price, drives sizing.</text>

  <!-- Bottom: Equity-based leverage adjustment -->
  <text x="400" y="345" text-anchor="middle" font-size="15" font-weight="bold" fill="#7c2d12">Equity-Based Leverage — scale up when winning, scale down when losing</text>
  
  <!-- Equity curve diagram -->
  <g transform="translate(50, 370)">
    <rect x="0" y="0" width="700" height="180" fill="white" stroke="#cbd5e1"/>
    
    <!-- Y-axis -->
    <text x="-5" y="30" text-anchor="end" font-size="10" fill="#475569">$120k</text>
    <text x="-5" y="80" text-anchor="end" font-size="10" fill="#475569">$100k</text>
    <text x="-5" y="130" text-anchor="end" font-size="10" fill="#475569">$80k</text>
    <text x="-5" y="170" text-anchor="end" font-size="10" fill="#475569">$60k</text>
    
    <line x1="0" y1="80" x2="700" y2="80" stroke="#94a3b8" stroke-dasharray="3,3"/>
    <text x="710" y="83" font-size="10" fill="#64748b">start</text>
    
    <!-- Equity curve -->
    <polyline points="0,80 80,70 160,55 240,40 320,30 400,55 480,90 560,120 640,150 700,140" 
              stroke="#1e40af" stroke-width="2.5" fill="none"/>
    
    <!-- Markers -->
    <circle cx="320" cy="30" r="5" fill="#16a34a"/>
    <text x="320" y="22" text-anchor="middle" font-size="10" fill="#16a34a">Peak: $120k</text>
    <text x="320" y="50" text-anchor="middle" font-size="9" fill="#16a34a">+20% → leverage UP 20%</text>
    
    <circle cx="640" cy="150" r="5" fill="#dc2626"/>
    <text x="640" y="172" text-anchor="middle" font-size="10" fill="#dc2626">Trough: $80k</text>
    <text x="640" y="142" text-anchor="middle" font-size="9" fill="#dc2626">−20% → leverage DOWN 20%</text>
  </g>
  
  <text x="400" y="585" text-anchor="middle" font-size="12" font-style="italic" fill="#475569">Position size always scales with current equity, not the original deposit.</text>
</svg>
