<svg viewBox="0 0 800 580" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="580" fill="#f8fafc"/>
  <text x="400" y="35" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">Diversification: Why Risk Drops When Markets Aren't Synced</text>

  <!-- Top: 2-trader comparison -->
  <text x="400" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#334155">$20,000 Account · Average Drawdown $3,000 per Market</text>

  <!-- Left: 2 contracts of one market -->
  <rect x="50" y="100" width="340" height="220" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="220" y="125" text-anchor="middle" font-size="14" font-weight="bold" fill="#991b1b">Trader A: 2 contracts of GOLD only</text>
  
  <rect x="100" y="150" width="60" height="120" fill="#fbbf24"/>
  <rect x="180" y="150" width="60" height="120" fill="#fbbf24"/>
  <text x="130" y="290" text-anchor="middle" font-size="11" fill="#78350f">Gold #1</text>
  <text x="210" y="290" text-anchor="middle" font-size="11" fill="#78350f">Gold #2</text>
  
  <text x="220" y="307" text-anchor="middle" font-size="13" font-weight="bold" fill="#991b1b">Drawdown: $6,000 = 30% of equity</text>

  <!-- Right: 1 contract each of 2 markets -->
  <rect x="410" y="100" width="340" height="220" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="580" y="125" text-anchor="middle" font-size="14" font-weight="bold" fill="#14532d">Trader B: 1 GOLD + 1 SOYBEANS</text>
  
  <rect x="460" y="150" width="60" height="120" fill="#fbbf24"/>
  <rect x="540" y="190" width="60" height="80" fill="#84cc16"/>
  <text x="490" y="290" text-anchor="middle" font-size="11" fill="#78350f">Gold</text>
  <text x="570" y="290" text-anchor="middle" font-size="11" fill="#365314">Soybeans</text>
  
  <text x="580" y="307" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">Drawdown: ~$4,500 = 22% of equity</text>

  <!-- Why it works -->
  <rect x="50" y="350" width="700" height="100" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="400" y="375" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e3a8a">The Math Behind the Magic</text>
  <text x="70" y="400" font-size="12" fill="#1e40af">Markets that aren't synchronized rarely lose at the same time. Worst case (perfectly synced):</text>
  <text x="70" y="420" font-size="12" fill="#1e40af">drawdowns add up. Realistic case: gold's bad week ≠ soybeans' bad week, so total drawdown shrinks.</text>
  <text x="70" y="440" font-size="12" font-weight="bold" fill="#1e40af">Add inversely correlated markets and risk drops even further.</text>

  <!-- Three levels of diversification -->
  <text x="400" y="485" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">Three Levels of Diversification</text>
  
  <rect x="50" y="500" width="220" height="60" rx="8" fill="#f0fdfa" stroke="#0d9488"/>
  <text x="160" y="522" text-anchor="middle" font-size="13" font-weight="bold" fill="#134e4a">1. Multiple Markets</text>
  <text x="160" y="542" text-anchor="middle" font-size="11" fill="#134e4a">stocks + bonds + commodities</text>
  
  <rect x="290" y="500" width="220" height="60" rx="8" fill="#f0fdfa" stroke="#0d9488"/>
  <text x="400" y="522" text-anchor="middle" font-size="13" font-weight="bold" fill="#134e4a">2. Multiple Systems</text>
  <text x="400" y="542" text-anchor="middle" font-size="11" fill="#134e4a">trend + countertrend + breakout</text>
  
  <rect x="530" y="500" width="220" height="60" rx="8" fill="#f0fdfa" stroke="#0d9488"/>
  <text x="640" y="522" text-anchor="middle" font-size="13" font-weight="bold" fill="#134e4a">3. Multiple Parameters</text>
  <text x="640" y="542" text-anchor="middle" font-size="11" fill="#134e4a">N=10, N=20, N=40 breakouts</text>
</svg>
