<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" font-family="Arial, sans-serif">
  <rect width="700" height="400" fill="#fafafa"/>
  <text x="350" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">GTC vs Day Order — Why "Resting" Matters</text>

  <!-- Two timelines side by side -->
  <text x="170" y="60" text-anchor="middle" font-size="13" font-weight="bold" fill="#2ca02c">GTC Stop (recommended)</text>
  <text x="530" y="60" text-anchor="middle" font-size="13" font-weight="bold" fill="#d62728">Mental / Day-only Stop</text>

  <!-- Left panel -->
  <rect x="40" y="75" width="270" height="290" fill="#fff" stroke="#bbb"/>
  <line x1="60" y1="340" x2="290" y2="340" stroke="#333"/>
  <line x1="60" y1="100" x2="60" y2="340" stroke="#333"/>

  <!-- Price line dropping with gap -->
  <polyline points="70,200 100,205 130,210 160,215 190,225 210,230" fill="none" stroke="#1f77b4" stroke-width="2"/>
  <!-- Gap -->
  <line x1="210" y1="230" x2="225" y2="270" stroke="#1f77b4" stroke-width="2" stroke-dasharray="3,3"/>
  <polyline points="225,270 250,275 275,278" fill="none" stroke="#1f77b4" stroke-width="2"/>

  <!-- Stop level -->
  <line x1="60" y1="245" x2="290" y2="245" stroke="#d62728" stroke-dasharray="5,3"/>
  <text x="65" y="240" font-size="10" fill="#d62728">stop level</text>

  <!-- Trigger -->
  <circle cx="225" cy="270" r="5" fill="#2ca02c"/>
  <text x="232" y="266" font-size="10" fill="#2ca02c">order auto-fills at open</text>
  <text x="100" y="365" font-size="10" fill="#444">Order rests in book — fires even overnight</text>

  <!-- Right panel -->
  <rect x="370" y="75" width="290" height="290" fill="#fff" stroke="#bbb"/>
  <line x1="390" y1="340" x2="640" y2="340" stroke="#333"/>
  <line x1="390" y1="100" x2="390" y2="340" stroke="#333"/>

  <polyline points="400,200 430,205 460,210 490,215 520,225 540,230" fill="none" stroke="#1f77b4" stroke-width="2"/>
  <line x1="540" y1="230" x2="555" y2="290" stroke="#1f77b4" stroke-width="2" stroke-dasharray="3,3"/>
  <polyline points="555,290 580,300 610,308" fill="none" stroke="#1f77b4" stroke-width="2"/>

  <line x1="390" y1="245" x2="640" y2="245" stroke="#d62728" stroke-dasharray="5,3"/>
  <text x="395" y="240" font-size="10" fill="#d62728">stop level (only in trader's head)</text>

  <circle cx="610" cy="308" r="5" fill="#d62728"/>
  <text x="555" y="320" font-size="10" fill="#d62728">trader sees gap → panics → fills here</text>
  <text x="430" y="365" font-size="10" fill="#444">Slippage = additional loss</text>
</svg>
