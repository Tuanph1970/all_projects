<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" font-family="Arial, sans-serif">
  <rect width="700" height="400" fill="#fafafa"/>
  <text x="350" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">Stop-Loss Liquidation Point — Defined Before Entry</text>

  <!-- Axes -->
  <line x1="60" y1="60" x2="60" y2="340" stroke="#333" stroke-width="1.5"/>
  <line x1="60" y1="340" x2="660" y2="340" stroke="#333" stroke-width="1.5"/>
  <text x="40" y="200" font-size="11" fill="#555" transform="rotate(-90 40 200)">Price</text>
  <text x="360" y="370" font-size="11" fill="#555" text-anchor="middle">Time →</text>

  <!-- Price path: rises, drops through stop -->
  <polyline points="80,250 120,230 160,210 200,200 240,205 280,195 320,210 360,230 400,260 440,290 480,310 520,305" 
            fill="none" stroke="#1f77b4" stroke-width="2.2"/>

  <!-- Entry marker -->
  <circle cx="200" cy="200" r="6" fill="#2ca02c"/>
  <text x="208" y="195" font-size="12" fill="#2ca02c" font-weight="bold">ENTRY  $50</text>

  <!-- Stop level horizontal line -->
  <line x1="60" y1="285" x2="660" y2="285" stroke="#d62728" stroke-width="1.6" stroke-dasharray="6,4"/>
  <text x="600" y="280" font-size="12" fill="#d62728" font-weight="bold" text-anchor="end">STOP  $48</text>

  <!-- Hit point -->
  <circle cx="460" cy="295" r="6" fill="#d62728"/>
  <text x="468" y="299" font-size="12" fill="#d62728" font-weight="bold">EXIT</text>

  <!-- Risk band -->
  <rect x="60" y="200" width="600" height="85" fill="#d62728" fill-opacity="0.07"/>
  <text x="70" y="245" font-size="11" fill="#d62728" font-style="italic">Defined risk zone (loss is capped here)</text>

  <!-- Annotation arrow -->
  <line x1="200" y1="180" x2="200" y2="200" stroke="#2ca02c" stroke-width="1"/>
  <text x="200" y="172" font-size="10" fill="#2ca02c" text-anchor="middle">stop is set BEFORE this moment</text>
</svg>
