<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" font-family="Arial, sans-serif">
  <rect width="700" height="400" fill="#fafafa"/>
  <text x="350" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">Money Stop — When the Nearest Technical Stop Is Too Far Away</text>

  <!-- Axes -->
  <line x1="60" y1="60" x2="60" y2="340" stroke="#333"/>
  <line x1="60" y1="340" x2="660" y2="340" stroke="#333"/>

  <!-- Sharp price drop -->
  <polyline points="80,90 110,100 140,115 170,135 200,170 230,200 260,225 290,235 320,245 350,255 380,250 410,255 440,260" 
            fill="none" stroke="#1f77b4" stroke-width="2"/>

  <!-- Entry (short trade after sharp drop) -->
  <circle cx="380" cy="250" r="6" fill="#2ca02c"/>
  <text x="390" y="248" font-size="11" fill="#2ca02c" font-weight="bold">SHORT entry</text>

  <!-- Technical stop (contract high) — far away -->
  <line x1="60" y1="90" x2="660" y2="90" stroke="#9467bd" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="660" y="84" font-size="11" fill="#9467bd" text-anchor="end" font-weight="bold">technical stop = contract high (far away — risk too big)</text>

  <!-- Money stop — chosen by dollar-risk budget -->
  <line x1="60" y1="220" x2="660" y2="220" stroke="#d62728" stroke-width="1.8" stroke-dasharray="4,2"/>
  <text x="660" y="216" font-size="11" fill="#d62728" text-anchor="end" font-weight="bold">money stop — sized to 2% of equity</text>

  <!-- Bracket showing money-stop distance -->
  <line x1="100" y1="220" x2="100" y2="250" stroke="#d62728" stroke-width="1"/>
  <text x="105" y="240" font-size="10" fill="#d62728">money stop distance</text>

  <!-- Bracket showing technical-stop distance -->
  <line x1="200" y1="90" x2="200" y2="250" stroke="#9467bd" stroke-width="1"/>
  <text x="208" y="170" font-size="10" fill="#9467bd">technical stop distance (way too big)</text>

  <text x="350" y="375" text-anchor="middle" font-size="11" fill="#555" font-style="italic">Money stop has no technical meaning — its only job is to enforce the dollar-risk rule.</text>
</svg>
