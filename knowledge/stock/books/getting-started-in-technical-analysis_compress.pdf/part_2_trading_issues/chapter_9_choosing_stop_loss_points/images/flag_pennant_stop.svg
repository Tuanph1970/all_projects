<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" font-family="Arial, sans-serif">
  <rect width="700" height="400" fill="#fafafa"/>
  <text x="350" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">Flag / Pennant Stop — Opposite End of the Pattern</text>

  <!-- Axes -->
  <line x1="60" y1="60" x2="60" y2="340" stroke="#333"/>
  <line x1="60" y1="340" x2="660" y2="340" stroke="#333"/>

  <!-- Flagpole (sharp rise) -->
  <line x1="100" y1="310" x2="240" y2="160" stroke="#1f77b4" stroke-width="2.5"/>
  <text x="115" y="245" font-size="11" fill="#1f77b4" transform="rotate(-45 115 245)">flagpole</text>

  <!-- Flag (parallel channel sloping down slightly) -->
  <line x1="240" y1="160" x2="340" y2="185" stroke="#888" stroke-width="1.5"/>
  <line x1="240" y1="185" x2="340" y2="210" stroke="#888" stroke-width="1.5"/>
  <polygon points="240,160 340,185 340,210 240,185" fill="#1f77b4" fill-opacity="0.08" stroke="none"/>

  <!-- Wiggle inside flag -->
  <polyline points="245,170 260,180 275,170 290,195 305,180 320,200 335,190" 
            fill="none" stroke="#1f77b4" stroke-width="1.3"/>

  <!-- Breakout above flag -->
  <polyline points="340,185 365,165 395,150 425,140 455,125 485,110" 
            fill="none" stroke="#1f77b4" stroke-width="2"/>

  <!-- Entry -->
  <circle cx="365" cy="165" r="6" fill="#2ca02c"/>
  <text x="375" y="160" font-size="11" fill="#2ca02c" font-weight="bold">ENTRY</text>

  <!-- Stop just below flag's lower boundary -->
  <line x1="240" y1="215" x2="660" y2="215" stroke="#d62728" stroke-width="1.6" stroke-dasharray="5,3"/>
  <text x="660" y="232" font-size="11" fill="#d62728" text-anchor="end" font-weight="bold">STOP — opposite end of flag</text>

  <!-- Annotation -->
  <text x="290" y="155" font-size="11" fill="#666" font-style="italic">flag</text>
  <text x="180" y="160" font-size="10" fill="#444">prior strong trend</text>

  <text x="350" y="375" text-anchor="middle" font-size="11" fill="#555" font-style="italic">If price falls back through the flag's lower boundary, the continuation premise is dead.</text>
</svg>
