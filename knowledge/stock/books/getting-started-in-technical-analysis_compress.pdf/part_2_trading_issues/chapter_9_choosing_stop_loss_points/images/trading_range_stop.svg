<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" font-family="Arial, sans-serif">
  <rect width="700" height="400" fill="#fafafa"/>
  <text x="350" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">Trading Range Stop — Place Below the Midpoint, Not the Top</text>

  <!-- Axes -->
  <line x1="60" y1="60" x2="60" y2="340" stroke="#333"/>
  <line x1="60" y1="340" x2="660" y2="340" stroke="#333"/>

  <!-- Range box -->
  <rect x="80" y="180" width="350" height="80" fill="#1f77b4" fill-opacity="0.07" stroke="#1f77b4" stroke-dasharray="4,3"/>
  <line x1="80" y1="180" x2="430" y2="180" stroke="#1f77b4" stroke-width="2"/>
  <line x1="80" y1="260" x2="430" y2="260" stroke="#1f77b4" stroke-width="2"/>

  <text x="65" y="184" font-size="11" fill="#1f77b4" text-anchor="end">$48 high</text>
  <text x="65" y="225" font-size="11" fill="#666" text-anchor="end">$45 mid</text>
  <text x="65" y="265" font-size="11" fill="#1f77b4" text-anchor="end">$42 low</text>

  <!-- Midpoint dashed line -->
  <line x1="80" y1="220" x2="430" y2="220" stroke="#888" stroke-dasharray="3,3"/>

  <!-- Choppy price action inside range -->
  <polyline points="90,210 110,200 130,235 150,195 170,250 190,210 210,240 230,205 250,255 270,210 290,250 310,200 330,245 350,205 370,250 390,215 410,200 425,185" 
            fill="none" stroke="#1f77b4" stroke-width="1.5" opacity="0.7"/>

  <!-- Breakout up -->
  <polyline points="425,185 450,160 475,145 500,135 525,150 550,170 575,160 600,140 625,130" 
            fill="none" stroke="#1f77b4" stroke-width="2"/>

  <!-- Entry -->
  <circle cx="450" cy="160" r="6" fill="#2ca02c"/>
  <text x="455" y="155" font-size="11" fill="#2ca02c" font-weight="bold">ENTRY $49.50</text>

  <!-- Three candidate stops -->
  <line x1="430" y1="180" x2="660" y2="180" stroke="#ff7f0e" stroke-dasharray="4,2"/>
  <text x="660" y="178" font-size="10" fill="#ff7f0e" text-anchor="end">⚠ near-edge stop $48 — too tight</text>

  <line x1="430" y1="220" x2="660" y2="220" stroke="#2ca02c" stroke-width="2"/>
  <text x="660" y="218" font-size="11" fill="#2ca02c" text-anchor="end" font-weight="bold">✓ midpoint stop $45 (recommended)</text>

  <line x1="430" y1="260" x2="660" y2="260" stroke="#9467bd" stroke-dasharray="4,2"/>
  <text x="660" y="276" font-size="10" fill="#9467bd" text-anchor="end">far-edge stop $42 — safest but largest loss</text>

  <text x="350" y="375" text-anchor="middle" font-size="11" fill="#555" font-style="italic">Stops at the near edge get hit by routine retracements.</text>
</svg>
