<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" font-family="Arial, sans-serif">
  <rect width="700" height="400" fill="#fafafa"/>
  <text x="350" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">Wide-Ranging Day Stop — True Low of the Breakout Bar</text>

  <!-- Axes -->
  <line x1="60" y1="60" x2="60" y2="340" stroke="#333"/>
  <line x1="60" y1="340" x2="660" y2="340" stroke="#333"/>

  <!-- Helper to draw OHLC bars: vertical high-low + close tick on the right -->
  <!-- Normal bars (small ranges) -->
  <g stroke="#1f77b4" stroke-width="2">
    <line x1="100" y1="240" x2="100" y2="260"/><line x1="100" y1="255" x2="108" y2="255"/>
    <line x1="130" y1="235" x2="130" y2="258"/><line x1="130" y1="250" x2="138" y2="250"/>
    <line x1="160" y1="240" x2="160" y2="262"/><line x1="160" y1="252" x2="168" y2="252"/>
    <line x1="190" y1="238" x2="190" y2="258"/><line x1="190" y1="248" x2="198" y2="248"/>
    <line x1="220" y1="235" x2="220" y2="255"/><line x1="220" y1="245" x2="228" y2="245"/>
    <line x1="250" y1="232" x2="250" y2="252"/><line x1="250" y1="242" x2="258" y2="242"/>
  </g>

  <!-- THE wide-ranging up day (much taller bar) -->
  <g stroke="#d62728" stroke-width="3">
    <line x1="290" y1="160" x2="290" y2="265"/>
    <line x1="290" y1="170" x2="302" y2="170"/>   <!-- close near high -->
  </g>
  <text x="305" y="160" font-size="11" fill="#d62728" font-weight="bold">$52 high</text>
  <text x="305" y="270" font-size="11" fill="#d62728" font-weight="bold">$48 true low</text>
  <text x="290" y="155" font-size="10" fill="#d62728" text-anchor="middle">wide-ranging day</text>

  <!-- Continuation upward -->
  <g stroke="#1f77b4" stroke-width="2">
    <line x1="330" y1="150" x2="330" y2="175"/><line x1="330" y1="155" x2="338" y2="155"/>
    <line x1="360" y1="140" x2="360" y2="165"/><line x1="360" y1="148" x2="368" y2="148"/>
    <line x1="390" y1="125" x2="390" y2="155"/><line x1="390" y1="135" x2="398" y2="135"/>
    <line x1="420" y1="115" x2="420" y2="140"/><line x1="420" y1="122" x2="428" y2="122"/>
    <line x1="450" y1="105" x2="450" y2="130"/><line x1="450" y1="115" x2="458" y2="115"/>
  </g>

  <!-- Entry on continuation -->
  <circle cx="330" cy="155" r="6" fill="#2ca02c"/>
  <text x="338" y="148" font-size="11" fill="#2ca02c" font-weight="bold">ENTRY $53</text>

  <!-- Stop line at true low of WRD -->
  <line x1="60" y1="265" x2="660" y2="265" stroke="#d62728" stroke-width="1.6" stroke-dasharray="6,3"/>
  <text x="660" y="282" font-size="11" fill="#d62728" text-anchor="end" font-weight="bold">STOP — true low of wide-ranging day</text>

  <text x="160" y="295" font-size="10" fill="#666" font-style="italic">average daily range ≈ $1.50</text>
  <line x1="100" y1="288" x2="250" y2="288" stroke="#666" stroke-dasharray="2,2"/>

  <text x="350" y="375" text-anchor="middle" font-size="11" fill="#555" font-style="italic">If price closes back through the bar's true low, the conviction it implied is gone.</text>
</svg>
