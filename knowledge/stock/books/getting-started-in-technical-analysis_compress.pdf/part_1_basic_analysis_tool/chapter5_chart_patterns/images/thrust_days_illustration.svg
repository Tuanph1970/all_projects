<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="sans-serif">
  <style>
    .bar { stroke: #333; stroke-width: 1.5; fill: none; }
    .up-thrust { stroke: #2e7d32; stroke-width: 2.5; fill: none; }
    .down-thrust { stroke: #c62828; stroke-width: 2.5; fill: none; }
    .label { font-size: 12px; fill: #222; }
    .title { font-size: 16px; font-weight: bold; fill: #111; }
    .ref { stroke: #1976d2; stroke-dasharray: 4 3; }
    .close-marker { fill: #ff6f00; }
  </style>

  <text x="400" y="22" text-anchor="middle" class="title">Thrust Days — close finishes BEYOND prior bar's range</text>

  <!-- UPTHRUST -->
  <text x="200" y="55" text-anchor="middle" font-weight="600" fill="#2e7d32">Upthrust day: close &gt; prior HIGH</text>

  <!-- prior bar -->
  <line x1="120" y1="240" x2="120" y2="180" class="bar"/>
  <line x1="120" y1="200" x2="130" y2="200" class="bar"/>
  <text x="125" y="265" text-anchor="middle" class="label">T-1</text>
  <line x1="80" y1="180" x2="280" y2="180" class="ref"/>
  <text x="285" y="183" class="label" fill="#1976d2">prior HIGH (180)</text>

  <!-- upthrust bar -->
  <line x1="170" y1="220" x2="170" y2="140" class="up-thrust"/>
  <line x1="170" y1="155" x2="180" y2="155" class="up-thrust"/>
  <circle cx="178" cy="155" r="3" class="close-marker"/>
  <text x="175" y="265" text-anchor="middle" class="label" fill="#2e7d32">T</text>
  <text x="200" y="158" class="label" fill="#ff6f00">close = 155</text>

  <!-- next bar -->
  <line x1="220" y1="195" x2="220" y2="135" class="bar"/>
  <line x1="220" y1="145" x2="230" y2="145" class="bar"/>
  <text x="225" y="265" text-anchor="middle" class="label">T+1</text>

  <text x="200" y="305" text-anchor="middle" class="label">close 155 &lt; prior HIGH 180? — wait, here close=155 means it's higher (lower y). ✓</text>
  <text x="200" y="325" text-anchor="middle" class="label" fill="#2e7d32">strong bullish signal</text>

  <!-- DIVIDER -->
  <line x1="400" y1="50" x2="400" y2="370" stroke="#999" stroke-width="0.5"/>

  <!-- DOWNTHRUST -->
  <text x="600" y="55" text-anchor="middle" font-weight="600" fill="#c62828">Downthrust day: close &lt; prior LOW</text>

  <!-- prior bar -->
  <line x1="520" y1="200" x2="520" y2="140" class="bar"/>
  <line x1="520" y1="180" x2="530" y2="180" class="bar"/>
  <text x="525" y="265" text-anchor="middle" class="label">T-1</text>
  <line x1="480" y1="200" x2="680" y2="200" class="ref"/>
  <text x="685" y="203" class="label" fill="#1976d2">prior LOW (200)</text>

  <!-- downthrust bar -->
  <line x1="570" y1="240" x2="570" y2="160" class="down-thrust"/>
  <line x1="570" y1="225" x2="580" y2="225" class="down-thrust"/>
  <circle cx="578" cy="225" r="3" class="close-marker"/>
  <text x="575" y="265" text-anchor="middle" class="label" fill="#c62828">T</text>
  <text x="600" y="228" class="label" fill="#ff6f00">close = 225</text>

  <!-- next bar -->
  <line x1="620" y1="265" x2="620" y2="220" class="bar"/>
  <line x1="620" y1="245" x2="630" y2="245" class="bar"/>
  <text x="625" y="285" text-anchor="middle" class="label">T+1</text>

  <text x="600" y="325" text-anchor="middle" class="label" fill="#c62828">strong bearish signal</text>

  <text x="400" y="365" text-anchor="middle" class="label" fill="#666">Cluster of same-direction thrusts = high-conviction trend</text>
</svg>
