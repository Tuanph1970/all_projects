<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="sans-serif">
  <style>
    .bar { stroke: #333; stroke-width: 1.5; fill: none; }
    .rev { stroke: #c62828; stroke-width: 2.5; fill: none; }
    .label { font-size: 12px; fill: #222; }
    .title { font-size: 16px; font-weight: bold; fill: #111; }
    .ref { stroke: #1976d2; stroke-dasharray: 4 3; }
  </style>

  <text x="400" y="22" text-anchor="middle" class="title">Reversal High Day — Standard vs Strong (Schwager)</text>

  <!-- STANDARD -->
  <text x="200" y="55" text-anchor="middle" font-weight="600" fill="#444">Standard: close &lt; prior close</text>

  <!-- climbing -->
  <line x1="40" y1="280" x2="40" y2="250" class="bar"/>
  <line x1="40" y1="265" x2="48" y2="265" class="bar"/>
  <line x1="65" y1="260" x2="65" y2="220" class="bar"/>
  <line x1="65" y1="235" x2="73" y2="235" class="bar"/>
  <line x1="90" y1="240" x2="90" y2="200" class="bar"/>
  <line x1="90" y1="215" x2="98" y2="215" class="bar"/>
  <line x1="115" y1="220" x2="115" y2="180" class="bar"/>
  <line x1="115" y1="200" x2="123" y2="200" class="bar"/>
  <!-- prior day T-1 -->
  <line x1="140" y1="200" x2="140" y2="160" class="bar"/>
  <line x1="140" y1="170" x2="150" y2="170" class="bar"/>
  <text x="145" y="155" text-anchor="middle" class="label">T-1</text>
  <line x1="115" y1="170" x2="200" y2="170" class="ref"/>
  <text x="208" y="173" class="label" fill="#1976d2">prior close</text>

  <!-- reversal day -->
  <line x1="170" y1="200" x2="170" y2="140" class="rev"/>
  <line x1="170" y1="180" x2="180" y2="180" class="rev"/>
  <text x="175" y="135" text-anchor="middle" class="label" fill="#c62828">T (new high)</text>

  <!-- after -->
  <line x1="200" y1="220" x2="200" y2="180" class="bar"/>
  <line x1="200" y1="200" x2="208" y2="200" class="bar"/>
  <line x1="225" y1="240" x2="225" y2="195" class="bar"/>
  <line x1="225" y1="220" x2="233" y2="220" class="bar"/>

  <text x="200" y="320" text-anchor="middle" class="label">close (180) &lt; prior close (170) ✓</text>
  <text x="200" y="335" text-anchor="middle" class="label" fill="#c62828">but condition is weak — many false signals</text>

  <!-- DIVIDER -->
  <line x1="400" y1="50" x2="400" y2="370" stroke="#999" stroke-width="0.5"/>

  <!-- STRONG -->
  <text x="600" y="55" text-anchor="middle" font-weight="600" fill="#444">Strong: close &lt; prior LOW</text>

  <!-- climbing -->
  <line x1="440" y1="280" x2="440" y2="250" class="bar"/>
  <line x1="440" y1="265" x2="448" y2="265" class="bar"/>
  <line x1="465" y1="260" x2="465" y2="220" class="bar"/>
  <line x1="465" y1="235" x2="473" y2="235" class="bar"/>
  <line x1="490" y1="240" x2="490" y2="200" class="bar"/>
  <line x1="490" y1="215" x2="498" y2="215" class="bar"/>
  <line x1="515" y1="220" x2="515" y2="180" class="bar"/>
  <line x1="515" y1="200" x2="523" y2="200" class="bar"/>
  <!-- T-1 -->
  <line x1="540" y1="195" x2="540" y2="155" class="bar"/>
  <line x1="540" y1="165" x2="550" y2="165" class="bar"/>
  <text x="545" y="150" text-anchor="middle" class="label">T-1</text>
  <line x1="515" y1="195" x2="610" y2="195" class="ref"/>
  <text x="618" y="198" class="label" fill="#1976d2">prior LOW</text>

  <!-- reversal day -->
  <line x1="570" y1="230" x2="570" y2="135" class="rev"/>
  <line x1="570" y1="215" x2="580" y2="215" class="rev"/>
  <text x="575" y="130" text-anchor="middle" class="label" fill="#c62828">T (new high)</text>

  <!-- after -->
  <line x1="600" y1="240" x2="600" y2="210" class="bar"/>
  <line x1="600" y1="225" x2="608" y2="225" class="bar"/>
  <line x1="625" y1="270" x2="625" y2="225" class="bar"/>
  <line x1="625" y1="245" x2="633" y2="245" class="bar"/>

  <text x="600" y="320" text-anchor="middle" class="label">close (215) &lt; prior LOW (195) ✓</text>
  <text x="600" y="335" text-anchor="middle" class="label" fill="#2e7d32">far fewer false signals</text>
</svg>
