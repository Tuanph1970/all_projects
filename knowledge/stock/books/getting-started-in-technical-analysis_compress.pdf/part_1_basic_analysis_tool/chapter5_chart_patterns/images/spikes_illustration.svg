<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="sans-serif">
  <style>
    .bar { stroke: #333; stroke-width: 1.5; fill: none; }
    .spike-bar { stroke: #c62828; stroke-width: 2.5; fill: none; }
    .label { font-size: 12px; fill: #222; }
    .title { font-size: 16px; font-weight: bold; fill: #111; }
    .trendline { stroke: #1976d2; stroke-dasharray: 4 3; }
  </style>

  <text x="400" y="22" text-anchor="middle" class="title">Spike High and Spike Low</text>

  <!-- SPIKE HIGH PANEL -->
  <text x="200" y="55" text-anchor="middle" font-weight="600" fill="#444" font-size="14">Spike High (after advance)</text>

  <!-- climbing bars -->
  <line x1="40" y1="280" x2="40" y2="260" class="bar"/>
  <line x1="40" y1="270" x2="48" y2="270" class="bar"/>
  <line x1="60" y1="270" x2="60" y2="240" class="bar"/>
  <line x1="60" y1="250" x2="68" y2="250" class="bar"/>
  <line x1="80" y1="250" x2="80" y2="225" class="bar"/>
  <line x1="80" y1="235" x2="88" y2="235" class="bar"/>
  <line x1="100" y1="240" x2="100" y2="210" class="bar"/>
  <line x1="100" y1="220" x2="108" y2="220" class="bar"/>
  <line x1="120" y1="220" x2="120" y2="195" class="bar"/>
  <line x1="120" y1="200" x2="128" y2="200" class="bar"/>
  <line x1="140" y1="210" x2="140" y2="180" class="bar"/>
  <line x1="140" y1="186" x2="148" y2="186" class="bar"/>
  <line x1="160" y1="195" x2="160" y2="170" class="bar"/>
  <line x1="160" y1="175" x2="168" y2="175" class="bar"/>

  <!-- the spike -->
  <line x1="180" y1="190" x2="180" y2="100" class="spike-bar"/>
  <line x1="180" y1="180" x2="188" y2="180" class="spike-bar"/>

  <!-- bars after spike -->
  <line x1="200" y1="200" x2="200" y2="170" class="bar"/>
  <line x1="200" y1="180" x2="208" y2="180" class="bar"/>
  <line x1="220" y1="220" x2="220" y2="190" class="bar"/>
  <line x1="220" y1="200" x2="228" y2="200" class="bar"/>
  <line x1="240" y1="240" x2="240" y2="210" class="bar"/>
  <line x1="240" y1="225" x2="248" y2="225" class="bar"/>
  <line x1="260" y1="260" x2="260" y2="225" class="bar"/>
  <line x1="260" y1="240" x2="268" y2="240" class="bar"/>
  <line x1="280" y1="275" x2="280" y2="240" class="bar"/>
  <line x1="280" y1="255" x2="288" y2="255" class="bar"/>
  <line x1="300" y1="290" x2="300" y2="255" class="bar"/>
  <line x1="300" y1="270" x2="308" y2="270" class="bar"/>

  <!-- annotation -->
  <line x1="180" y1="100" x2="220" y2="80" class="trendline" stroke="#c62828"/>
  <text x="225" y="83" class="label" fill="#c62828" font-weight="600">extreme high</text>
  <text x="225" y="98" class="label" fill="#c62828">far above neighbors</text>
  <line x1="190" y1="180" x2="225" y2="200" class="trendline" stroke="#c62828"/>
  <text x="230" y="203" class="label" fill="#c62828">close near LOW of bar</text>

  <!-- DIVIDER -->
  <line x1="400" y1="50" x2="400" y2="350" stroke="#999" stroke-width="0.5"/>

  <!-- SPIKE LOW PANEL -->
  <text x="600" y="55" text-anchor="middle" font-weight="600" fill="#444" font-size="14">Spike Low (after decline)</text>

  <!-- declining bars -->
  <line x1="440" y1="170" x2="440" y2="150" class="bar"/>
  <line x1="440" y1="160" x2="448" y2="160" class="bar"/>
  <line x1="460" y1="180" x2="460" y2="155" class="bar"/>
  <line x1="460" y1="170" x2="468" y2="170" class="bar"/>
  <line x1="480" y1="200" x2="480" y2="170" class="bar"/>
  <line x1="480" y1="185" x2="488" y2="185" class="bar"/>
  <line x1="500" y1="220" x2="500" y2="190" class="bar"/>
  <line x1="500" y1="205" x2="508" y2="205" class="bar"/>
  <line x1="520" y1="240" x2="520" y2="210" class="bar"/>
  <line x1="520" y1="225" x2="528" y2="225" class="bar"/>
  <line x1="540" y1="260" x2="540" y2="230" class="bar"/>
  <line x1="540" y1="245" x2="548" y2="245" class="bar"/>
  <line x1="560" y1="280" x2="560" y2="250" class="bar"/>
  <line x1="560" y1="265" x2="568" y2="265" class="bar"/>

  <!-- the spike low -->
  <line x1="580" y1="350" x2="580" y2="270" class="spike-bar"/>
  <line x1="580" y1="280" x2="588" y2="280" class="spike-bar"/>

  <!-- bars after spike -->
  <line x1="600" y1="280" x2="600" y2="250" class="bar"/>
  <line x1="600" y1="265" x2="608" y2="265" class="bar"/>
  <line x1="620" y1="260" x2="620" y2="225" class="bar"/>
  <line x1="620" y1="240" x2="628" y2="240" class="bar"/>
  <line x1="640" y1="240" x2="640" y2="200" class="bar"/>
  <line x1="640" y1="215" x2="648" y2="215" class="bar"/>
  <line x1="660" y1="220" x2="660" y2="180" class="bar"/>
  <line x1="660" y1="195" x2="668" y2="195" class="bar"/>
  <line x1="680" y1="200" x2="680" y2="160" class="bar"/>
  <line x1="680" y1="175" x2="688" y2="175" class="bar"/>
  <line x1="700" y1="180" x2="700" y2="140" class="bar"/>
  <line x1="700" y1="155" x2="708" y2="155" class="bar"/>
  <line x1="720" y1="160" x2="720" y2="120" class="bar"/>
  <line x1="720" y1="135" x2="728" y2="135" class="bar"/>

  <line x1="580" y1="350" x2="620" y2="370" class="trendline" stroke="#c62828"/>
  <text x="625" y="373" class="label" fill="#c62828" font-weight="600">extreme low</text>

  <text x="400" y="395" text-anchor="middle" class="label" fill="#666">Three confirming features: wide separation • close at opposite extreme • prior trend</text>
</svg>
