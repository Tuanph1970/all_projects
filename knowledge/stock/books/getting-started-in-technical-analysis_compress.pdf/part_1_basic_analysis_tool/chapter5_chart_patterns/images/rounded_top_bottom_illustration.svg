<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="sans-serif">
  <style>
    .price { stroke: #333; stroke-width: 1.8; fill: none; }
    .arc { stroke: #1976d2; stroke-width: 1.5; stroke-dasharray: 5 3; fill: none; }
    .label { font-size: 12px; fill: #222; }
    .title { font-size: 16px; font-weight: bold; fill: #111; }
    .sub { font-size: 13px; font-weight: 600; fill: #444; }
    .annot { font-size: 11px; fill: #555; font-style: italic; }
  </style>

  <text x="400" y="22" text-anchor="middle" class="title">Rounded Top and Rounded Bottom (Saucer)</text>

  <!-- ROUNDED TOP -->
  <text x="200" y="55" text-anchor="middle" class="sub">Rounded Top</text>

  <!-- gentle rise + dome + gentle fall -->
  <path d="M 20 310 Q 60 290 90 250 Q 120 210 160 170 Q 200 130 240 110 Q 280 100 320 110 Q 360 130 380 170 Q 395 210 395 260 Q 395 300 395 320"
        class="price"/>

  <!-- guide arc -->
  <path d="M 60 280 Q 200 70 360 280" class="arc"/>

  <text x="200" y="100" text-anchor="middle" class="annot">slow, gradual curve — momentum fading</text>
  <text x="60" y="335" class="label">accumulation ends</text>
  <text x="370" y="335" text-anchor="end" class="label" fill="#c62828">distribution → decline</text>

  <!-- DIVIDER -->
  <line x1="430" y1="50" x2="430" y2="370" stroke="#999" stroke-width="0.5"/>

  <!-- ROUNDED BOTTOM -->
  <text x="615" y="55" text-anchor="middle" class="sub">Rounded Bottom (Saucer)</text>

  <path d="M 460 90 Q 490 130 510 175 Q 535 230 560 270 Q 600 305 640 310 Q 680 305 720 270 Q 745 230 770 175 Q 785 130 795 90"
        class="price"/>

  <!-- guide arc -->
  <path d="M 490 130 Q 625 350 770 130" class="arc"/>

  <text x="625" y="160" text-anchor="middle" class="annot">slow base building — selling exhausted</text>
  <text x="475" y="80" class="label">decline ends</text>
  <text x="780" y="80" text-anchor="end" class="label" fill="#2e7d32">slow advance begins</text>
</svg>
