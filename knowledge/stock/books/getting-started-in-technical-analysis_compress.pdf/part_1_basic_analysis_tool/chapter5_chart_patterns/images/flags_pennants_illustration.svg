<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="sans-serif">
  <style>
    .price { stroke: #333; stroke-width: 1.5; fill: none; }
    .pole { stroke: #1976d2; stroke-width: 2.5; fill: none; }
    .channel { stroke: #c62828; stroke-width: 1.5; stroke-dasharray: 4 3; fill: none; }
    .target-line { stroke: #2e7d32; stroke-width: 1.5; stroke-dasharray: 3 3; fill: none; }
    .label { font-size: 12px; fill: #222; }
    .title { font-size: 16px; font-weight: bold; fill: #111; }
    .sub { font-size: 13px; font-weight: 600; fill: #444; }
  </style>

  <text x="400" y="22" text-anchor="middle" class="title">Flag and Pennant — Pause Inside a Trend</text>

  <!-- FLAG -->
  <text x="200" y="55" text-anchor="middle" class="sub">Flag (parallel lines)</text>

  <!-- flagpole going up -->
  <polyline points="50,300 70,280 90,250 110,220 130,180 150,140 170,110" class="pole"/>
  <text x="80" y="270" class="label" fill="#1976d2">flagpole</text>

  <!-- flag (parallel down-sloping channel) -->
  <polyline points="170,110 185,130 200,120 215,135 230,125 245,140 260,130 275,145"
            class="price"/>
  <line x1="170" y1="110" x2="280" y2="145" class="channel"/>
  <line x1="190" y1="130" x2="280" y2="158" class="channel"/>

  <!-- breakout -->
  <polyline points="275,145 290,115 305,80" class="pole"/>

  <!-- target projection -->
  <line x1="275" y1="145" x2="275" y2="40" class="target-line"/>
  <line x1="50" y1="300" x2="50" y2="40" class="target-line"/>
  <line x1="50" y1="40" x2="305" y2="40" class="target-line"/>
  <text x="180" y="35" text-anchor="middle" class="label" fill="#2e7d32">target = pole height</text>

  <text x="200" y="345" text-anchor="middle" class="label">tight, short consolidation</text>
  <text x="200" y="362" text-anchor="middle" class="label">→ breakout in pole's direction</text>

  <!-- DIVIDER -->
  <line x1="400" y1="50" x2="400" y2="380" stroke="#999" stroke-width="0.5"/>

  <!-- PENNANT -->
  <text x="600" y="55" class="sub" text-anchor="middle">Pennant (converging lines)</text>

  <!-- flagpole down -->
  <polyline points="450,80 470,100 490,130 510,170 530,210 550,250 570,275" class="pole" stroke="#c62828"/>
  <text x="475" y="170" class="label" fill="#c62828">flagpole</text>

  <!-- pennant -->
  <polyline points="570,275 585,250 600,260 615,255 630,258 645,256 660,257" class="price"/>
  <line x1="570" y1="275" x2="660" y2="262" class="channel"/>
  <line x1="585" y1="250" x2="660" y2="252" class="channel"/>

  <!-- breakdown continuation -->
  <polyline points="660,257 680,290 700,320 720,350" class="pole" stroke="#c62828"/>

  <line x1="660" y1="257" x2="660" y2="365" class="target-line"/>
  <line x1="450" y1="80" x2="450" y2="365" class="target-line"/>
  <line x1="450" y1="365" x2="660" y2="365" class="target-line"/>
  <text x="555" y="378" text-anchor="middle" class="label" fill="#2e7d32">target = pole height</text>

  <text x="600" y="345" text-anchor="middle" class="label">narrowing range, like a small triangle</text>
</svg>
