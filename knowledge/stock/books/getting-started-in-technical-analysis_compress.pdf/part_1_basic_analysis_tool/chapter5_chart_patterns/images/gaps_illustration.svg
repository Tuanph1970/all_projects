<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="sans-serif">
  <style>
    .bar { stroke: #333; stroke-width: 1.5; fill: none; }
    .gap-zone { fill: #ffe082; opacity: 0.5; }
    .label { font-size: 12px; fill: #222; }
    .title { font-size: 16px; font-weight: bold; fill: #111; }
    .subtitle { font-size: 13px; font-weight: 600; fill: #444; }
    .arrow { stroke: #c62828; stroke-width: 1.5; fill: none; marker-end: url(#arr); }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c62828"/>
    </marker>
  </defs>

  <text x="400" y="22" text-anchor="middle" class="title">The Four Types of Gaps</text>

  <!-- COMMON GAP -->
  <text x="100" y="55" text-anchor="middle" class="subtitle">Common</text>
  <line x1="40"  y1="200" x2="40"  y2="160" class="bar"/>
  <line x1="40"  y1="180" x2="50"  y2="180" class="bar"/>
  <line x1="65"  y1="190" x2="65"  y2="150" class="bar"/>
  <line x1="65"  y1="165" x2="75"  y2="165" class="bar"/>
  <rect x="80" y="135" width="35" height="15" class="gap-zone"/>
  <line x1="100" y1="170" x2="100" y2="130" class="bar"/>
  <line x1="100" y1="155" x2="110" y2="155" class="bar"/>
  <line x1="125" y1="200" x2="125" y2="160" class="bar"/>
  <line x1="125" y1="175" x2="135" y2="175" class="bar"/>
  <line x1="150" y1="210" x2="150" y2="170" class="bar"/>
  <line x1="150" y1="185" x2="160" y2="185" class="bar"/>
  <text x="100" y="240" text-anchor="middle" class="label">small, in range</text>

  <!-- BREAKAWAY GAP -->
  <text x="290" y="55" text-anchor="middle" class="subtitle">Breakaway</text>
  <line x1="220" y1="240" x2="350" y2="240" stroke="#1976d2" stroke-dasharray="4 3"/>
  <text x="355" y="244" class="label" fill="#1976d2">resistance</text>
  <line x1="225" y1="250" x2="225" y2="220" class="bar"/>
  <line x1="225" y1="235" x2="235" y2="235" class="bar"/>
  <line x1="245" y1="260" x2="245" y2="225" class="bar"/>
  <line x1="245" y1="240" x2="255" y2="240" class="bar"/>
  <line x1="265" y1="250" x2="265" y2="220" class="bar"/>
  <line x1="265" y1="232" x2="275" y2="232" class="bar"/>
  <rect x="280" y="170" width="50" height="50" class="gap-zone"/>
  <line x1="290" y1="190" x2="290" y2="155" class="bar"/>
  <line x1="290" y1="170" x2="300" y2="170" class="bar"/>
  <line x1="315" y1="180" x2="315" y2="140" class="bar"/>
  <line x1="315" y1="155" x2="325" y2="155" class="bar"/>
  <text x="290" y="290" text-anchor="middle" class="label">large gap out of range</text>
  <text x="290" y="305" text-anchor="middle" class="label" fill="#c62828">most reliable signal</text>

  <!-- RUNAWAY GAP -->
  <text x="510" y="55" text-anchor="middle" class="subtitle">Runaway</text>
  <line x1="440" y1="290" x2="440" y2="260" class="bar"/>
  <line x1="440" y1="275" x2="450" y2="275" class="bar"/>
  <line x1="460" y1="270" x2="460" y2="240" class="bar"/>
  <line x1="460" y1="252" x2="470" y2="252" class="bar"/>
  <rect x="478" y="208" width="35" height="22" class="gap-zone"/>
  <line x1="488" y1="225" x2="488" y2="200" class="bar"/>
  <line x1="488" y1="208" x2="498" y2="208" class="bar"/>
  <line x1="510" y1="200" x2="510" y2="170" class="bar"/>
  <line x1="510" y1="180" x2="520" y2="180" class="bar"/>
  <rect x="528" y="138" width="35" height="22" class="gap-zone"/>
  <line x1="540" y1="160" x2="540" y2="125" class="bar"/>
  <line x1="540" y1="138" x2="550" y2="138" class="bar"/>
  <line x1="565" y1="120" x2="565" y2="90" class="bar"/>
  <line x1="565" y1="100" x2="575" y2="100" class="bar"/>
  <text x="510" y="320" text-anchor="middle" class="label">mid-trend acceleration</text>

  <!-- EXHAUSTION GAP -->
  <text x="710" y="55" text-anchor="middle" class="subtitle">Exhaustion</text>
  <line x1="640" y1="200" x2="640" y2="170" class="bar"/>
  <line x1="640" y1="180" x2="650" y2="180" class="bar"/>
  <line x1="660" y1="180" x2="660" y2="150" class="bar"/>
  <line x1="660" y1="160" x2="670" y2="160" class="bar"/>
  <line x1="680" y1="160" x2="680" y2="130" class="bar"/>
  <line x1="680" y1="140" x2="690" y2="140" class="bar"/>
  <rect x="697" y="100" width="35" height="20" class="gap-zone"/>
  <line x1="710" y1="120" x2="710" y2="95" class="bar"/>
  <line x1="710" y1="105" x2="720" y2="105" class="bar"/>
  <line x1="735" y1="160" x2="735" y2="130" class="bar"/>
  <line x1="735" y1="155" x2="745" y2="155" class="bar"/>
  <line x1="755" y1="200" x2="755" y2="160" class="bar"/>
  <line x1="755" y1="195" x2="765" y2="195" class="bar"/>
  <path d="M 720 80 Q 740 60 760 90" class="arrow"/>
  <text x="715" y="55" class="label" fill="#c62828">trend reverses</text>
  <text x="710" y="240" text-anchor="middle" class="label">last gap before reversal</text>

  <text x="400" y="380" text-anchor="middle" class="label" fill="#666">Yellow zones = "empty" price area where no trade occurred</text>
</svg>
