<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="sans-serif">
  <style>
    .price { stroke: #333; stroke-width: 1.8; fill: none; }
    .neckline { stroke: #1976d2; stroke-width: 1.6; stroke-dasharray: 5 3; fill: none; }
    .target-line { stroke: #2e7d32; stroke-width: 1.5; stroke-dasharray: 3 3; fill: none; }
    .label { font-size: 12px; fill: #222; }
    .title { font-size: 16px; font-weight: bold; fill: #111; }
    .sub { font-size: 13px; font-weight: 600; fill: #444; }
    .anchor { fill: #c62828; }
    .trend { stroke: #888; stroke-width: 1; stroke-dasharray: 2 4; fill: none; }
  </style>

  <text x="400" y="22" text-anchor="middle" class="title">Head and Shoulders / Inverse Head and Shoulders</text>

  <!-- HEAD AND SHOULDERS (TOP) -->
  <text x="200" y="55" text-anchor="middle" class="sub">Head and Shoulders Top</text>

  <!-- prior uptrend -->
  <polyline points="20,310 45,275 70,240 95,205 115,170" class="price"/>
  <line x1="20" y1="310" x2="115" y2="170" class="trend"/>
  <text x="22" y="325" class="label" fill="#888">prior major uptrend</text>

  <!-- left shoulder -->
  <polyline points="115,170 140,145 160,135" class="price"/>
  <circle cx="160" cy="135" r="4" class="anchor"/>
  <text x="160" y="123" text-anchor="middle" class="label" fill="#c62828">LS</text>
  <polyline points="160,135 185,165 210,200" class="price"/>
  <circle cx="210" cy="200" r="3" fill="#1976d2"/>

  <!-- head -->
  <polyline points="210,200 240,160 265,120 285,95" class="price"/>
  <circle cx="285" cy="95" r="4" class="anchor"/>
  <text x="285" y="83" text-anchor="middle" class="label" fill="#c62828">Head</text>
  <polyline points="285,95 310,135 335,175 360,205" class="price"/>
  <circle cx="360" cy="205" r="3" fill="#1976d2"/>

  <!-- right shoulder -->
  <polyline points="360,205 385,180 405,145 415,138" class="price"/>
  <circle cx="415" cy="138" r="4" class="anchor"/>
  <text x="415" y="126" text-anchor="middle" class="label" fill="#c62828">RS</text>
  <polyline points="415,138 430,170 445,200" class="price"/>

  <!-- neckline -->
  <line x1="200" y1="200" x2="445" y2="205" class="neckline"/>
  <text x="190" y="200" text-anchor="end" class="label" fill="#1976d2">neckline</text>

  <!-- breakdown -->
  <polyline points="445,200 458,225 470,250" class="price" stroke="#c62828" stroke-width="2"/>
  <text x="465" y="270" class="label" fill="#c62828">break</text>

  <!-- target measurement -->
  <line x1="285" y1="95" x2="285" y2="200" class="target-line"/>
  <text x="275" y="148" text-anchor="end" class="label" fill="#2e7d32">H</text>
  <line x1="445" y1="200" x2="445" y2="305" class="target-line"/>
  <line x1="410" y1="305" x2="475" y2="305" class="target-line"/>
  <text x="480" y="308" class="label" fill="#2e7d32">target</text>

  <!-- DIVIDER -->
  <line x1="490" y1="50" x2="490" y2="370" stroke="#999" stroke-width="0.5"/>

  <!-- INVERSE HEAD AND SHOULDERS (BOTTOM) -->
  <text x="650" y="55" text-anchor="middle" class="sub">Inverse Head and Shoulders</text>

  <polyline points="510,90 535,120 560,155 580,195 600,225" class="price"/>
  <line x1="510" y1="90" x2="600" y2="225" class="trend"/>

  <!-- left shoulder (low) -->
  <polyline points="600,225 620,255 635,265" class="price"/>
  <circle cx="635" cy="265" r="4" class="anchor"/>
  <text x="635" y="282" text-anchor="middle" class="label" fill="#c62828">LS</text>
  <polyline points="635,265 655,235 675,200" class="price"/>
  <circle cx="675" cy="200" r="3" fill="#1976d2"/>

  <!-- head (lower low) -->
  <polyline points="675,200 695,245 710,290 720,310" class="price"/>
  <circle cx="720" cy="310" r="4" class="anchor"/>
  <text x="720" y="327" text-anchor="middle" class="label" fill="#c62828">Head</text>
  <polyline points="720,310 735,275 750,235 765,200" class="price"/>
  <circle cx="765" cy="200" r="3" fill="#1976d2"/>

  <!-- right shoulder -->
  <polyline points="765,200 775,235 783,260" class="price"/>
  <circle cx="783" cy="260" r="4" class="anchor"/>
  <text x="783" y="277" text-anchor="middle" class="label" fill="#c62828">RS</text>
  <polyline points="783,260 790,230 798,200" class="price"/>

  <!-- neckline -->
  <line x1="675" y1="200" x2="798" y2="200" class="neckline"/>
  <text x="668" y="195" text-anchor="end" class="label" fill="#1976d2">neckline</text>
</svg>
