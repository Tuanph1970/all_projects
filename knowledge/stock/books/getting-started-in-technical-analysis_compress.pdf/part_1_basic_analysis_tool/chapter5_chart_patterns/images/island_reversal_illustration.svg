<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="sans-serif">
  <style>
    .bar { stroke: #333; stroke-width: 1.6; }
    .island { fill: #fff3cd; stroke: #f1c40f; stroke-width: 1.5; stroke-dasharray: 4 3; }
    .gap-line { stroke: #c62828; stroke-width: 1.2; stroke-dasharray: 3 3; }
    .gap-fill { fill: #ffebee; opacity: 0.7; }
    .label { font-size: 12px; fill: #222; }
    .title { font-size: 16px; font-weight: bold; fill: #111; }
    .sub { font-size: 13px; font-weight: 600; fill: #444; }
    .annot { font-size: 11px; fill: #555; font-style: italic; }
    .arrow-up { stroke: #2e7d32; stroke-width: 1.5; fill: none; }
    .arrow-dn { stroke: #c62828; stroke-width: 1.5; fill: none; }
  </style>

  <text x="400" y="22" text-anchor="middle" class="title">Island Reversal (Top)</text>
  <text x="400" y="42" text-anchor="middle" class="sub">Exhaustion gap up → sideways island → breakaway gap down</text>

  <!-- Bars helper: x positions every 20px, vertical line is high-to-low -->

  <!-- Phase 1: uptrend -->
  <line x1="50" y1="320" x2="50" y2="290" class="bar"/>
  <line x1="50" y1="305" x2="56" y2="305" class="bar"/>
  <line x1="44" y1="298" x2="50" y2="298" class="bar"/>
  <line x1="75" y1="305" x2="75" y2="270" class="bar"/>
  <line x1="75" y1="295" x2="81" y2="295" class="bar"/>
  <line x1="69" y1="278" x2="75" y2="278" class="bar"/>
  <line x1="100" y1="285" x2="100" y2="245" class="bar"/>
  <line x1="100" y1="275" x2="106" y2="275" class="bar"/>
  <line x1="94" y1="252" x2="100" y2="252" class="bar"/>
  <line x1="125" y1="265" x2="125" y2="220" class="bar"/>
  <line x1="125" y1="255" x2="131" y2="255" class="bar"/>
  <line x1="119" y1="228" x2="125" y2="228" class="bar"/>
  <line x1="150" y1="240" x2="150" y2="195" class="bar"/>
  <line x1="150" y1="230" x2="156" y2="230" class="bar"/>
  <line x1="144" y1="200" x2="150" y2="200" class="bar"/>
  <line x1="175" y1="215" x2="175" y2="170" class="bar"/>
  <line x1="175" y1="205" x2="181" y2="205" class="bar"/>
  <line x1="169" y1="178" x2="175" y2="178" class="bar"/>
  <line x1="200" y1="190" x2="200" y2="155" class="bar"/>
  <line x1="200" y1="180" x2="206" y2="180" class="bar"/>
  <line x1="194" y1="160" x2="200" y2="160" class="bar"/>
  <line x1="225" y1="170" x2="225" y2="135" class="bar"/>
  <line x1="225" y1="160" x2="231" y2="160" class="bar"/>
  <line x1="219" y1="142" x2="225" y2="142" class="bar"/>

  <!-- gap up box -->
  <rect x="240" y="100" width="22" height="30" class="gap-fill"/>
  <text x="251" y="120" text-anchor="middle" class="label" fill="#c62828">gap</text>

  <!-- ISLAND (highlighted region) -->
  <rect x="265" y="60" width="125" height="55" class="island"/>
  <text x="328" y="55" text-anchor="middle" class="label" fill="#b8860b">ISLAND</text>

  <!-- island bars (sideways high) -->
  <line x1="275" y1="100" x2="275" y2="75" class="bar"/>
  <line x1="275" y1="92" x2="281" y2="92" class="bar"/>
  <line x1="269" y1="80" x2="275" y2="80" class="bar"/>

  <line x1="300" y1="105" x2="300" y2="68" class="bar"/>
  <line x1="300" y1="92" x2="306" y2="92" class="bar"/>
  <line x1="294" y1="75" x2="300" y2="75" class="bar"/>

  <line x1="325" y1="98" x2="325" y2="72" class="bar"/>
  <line x1="325" y1="88" x2="331" y2="88" class="bar"/>
  <line x1="319" y1="78" x2="325" y2="78" class="bar"/>

  <line x1="350" y1="102" x2="350" y2="78" class="bar"/>
  <line x1="350" y1="92" x2="356" y2="92" class="bar"/>
  <line x1="344" y1="82" x2="350" y2="82" class="bar"/>

  <line x1="375" y1="108" x2="375" y2="82" class="bar"/>
  <line x1="375" y1="98" x2="381" y2="98" class="bar"/>
  <line x1="369" y1="86" x2="375" y2="86" class="bar"/>

  <!-- gap down box -->
  <rect x="390" y="115" width="22" height="35" class="gap-fill"/>
  <text x="401" y="138" text-anchor="middle" class="label" fill="#c62828">gap</text>

  <!-- Phase 3: downtrend -->
  <line x1="425" y1="170" x2="425" y2="145" class="bar"/>
  <line x1="425" y1="158" x2="431" y2="158" class="bar"/>
  <line x1="419" y1="152" x2="425" y2="152" class="bar"/>

  <line x1="450" y1="195" x2="450" y2="165" class="bar"/>
  <line x1="450" y1="180" x2="456" y2="180" class="bar"/>
  <line x1="444" y1="170" x2="450" y2="170" class="bar"/>

  <line x1="475" y1="220" x2="475" y2="185" class="bar"/>
  <line x1="475" y1="208" x2="481" y2="208" class="bar"/>
  <line x1="469" y1="195" x2="475" y2="195" class="bar"/>

  <line x1="500" y1="245" x2="500" y2="210" class="bar"/>
  <line x1="500" y1="232" x2="506" y2="232" class="bar"/>
  <line x1="494" y1="218" x2="500" y2="218" class="bar"/>

  <line x1="525" y1="270" x2="525" y2="235" class="bar"/>
  <line x1="525" y1="258" x2="531" y2="258" class="bar"/>
  <line x1="519" y1="245" x2="525" y2="245" class="bar"/>

  <line x1="550" y1="295" x2="550" y2="258" class="bar"/>
  <line x1="550" y1="282" x2="556" y2="282" class="bar"/>
  <line x1="544" y1="270" x2="550" y2="270" class="bar"/>

  <line x1="575" y1="315" x2="575" y2="280" class="bar"/>
  <line x1="575" y1="305" x2="581" y2="305" class="bar"/>
  <line x1="569" y1="290" x2="575" y2="290" class="bar"/>

  <line x1="600" y1="335" x2="600" y2="300" class="bar"/>
  <line x1="600" y1="322" x2="606" y2="322" class="bar"/>
  <line x1="594" y1="310" x2="600" y2="310" class="bar"/>

  <!-- arrows for trend phases -->
  <path d="M 50 360 L 225 360" class="arrow-up"/>
  <polygon points="225,360 218,355 218,365" fill="#2e7d32"/>
  <text x="138" y="378" text-anchor="middle" class="label" fill="#2e7d32">prior uptrend</text>

  <text x="328" y="135" text-anchor="middle" class="annot">consolidation in mid-air</text>

  <path d="M 425 360 L 600 360" class="arrow-dn"/>
  <polygon points="600,360 593,355 593,365" fill="#c62828"/>
  <text x="513" y="378" text-anchor="middle" class="label" fill="#c62828">new downtrend</text>

  <!-- gap level lines emphasizing both gaps are above the island bottom and below the surrounding -->
  <line x1="240" y1="115" x2="265" y2="115" class="gap-line"/>
  <line x1="390" y1="115" x2="412" y2="115" class="gap-line"/>

  <!-- legend / commentary -->
  <text x="660" y="80" class="sub">Key features:</text>
  <text x="660" y="105" class="label">• Gap UP starts the island</text>
  <text x="660" y="125" class="label">• Gap DOWN ends it</text>
  <text x="660" y="145" class="label">• Both gaps near same level</text>
  <text x="660" y="165" class="label">• Cluster of bars stranded</text>
  <text x="660" y="185" class="label">• Strong reversal signal</text>
  <text x="660" y="220" class="annot">Inverse pattern at bottoms:</text>
  <text x="660" y="238" class="annot">gap down → island → gap up</text>
</svg>
