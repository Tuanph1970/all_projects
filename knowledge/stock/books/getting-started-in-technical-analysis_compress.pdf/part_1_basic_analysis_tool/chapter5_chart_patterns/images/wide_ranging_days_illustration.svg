<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="sans-serif">
  <style>
    .bar { stroke: #333; stroke-width: 1.5; fill: none; }
    .wide-up { stroke: #2e7d32; stroke-width: 3; fill: none; }
    .wide-dn { stroke: #c62828; stroke-width: 3; fill: none; }
    .label { font-size: 12px; fill: #222; }
    .title { font-size: 16px; font-weight: bold; fill: #111; }
    .annot { stroke: #1976d2; stroke-dasharray: 4 3; }
    .close { fill: #ff6f00; }
  </style>

  <text x="400" y="22" text-anchor="middle" class="title">Wide-Ranging Days (VR &gt; 2.0) — Strong vs Weak Close</text>

  <!-- Up day with strong close, after decline -->
  <text x="200" y="55" text-anchor="middle" font-weight="600" fill="#2e7d32">Wide-range UP, strong close → bullish reversal</text>

  <!-- declining bars -->
  <line x1="40" y1="120" x2="40" y2="100" class="bar"/>
  <line x1="40" y1="110" x2="48" y2="110" class="bar"/>
  <line x1="65" y1="135" x2="65" y2="115" class="bar"/>
  <line x1="65" y1="125" x2="73" y2="125" class="bar"/>
  <line x1="90" y1="160" x2="90" y2="140" class="bar"/>
  <line x1="90" y1="150" x2="98" y2="150" class="bar"/>
  <line x1="115" y1="185" x2="115" y2="165" class="bar"/>
  <line x1="115" y1="175" x2="123" y2="175" class="bar"/>
  <line x1="140" y1="210" x2="140" y2="190" class="bar"/>
  <line x1="140" y1="200" x2="148" y2="200" class="bar"/>
  <line x1="165" y1="230" x2="165" y2="210" class="bar"/>
  <line x1="165" y1="220" x2="173" y2="220" class="bar"/>

  <!-- WIDE-RANGE BAR -->
  <line x1="200" y1="240" x2="200" y2="100" class="wide-up"/>
  <line x1="200" y1="115" x2="212" y2="115" class="wide-up"/>
  <circle cx="210" cy="115" r="3.5" class="close"/>
  <text x="220" y="118" class="label" fill="#ff6f00">close near HIGH</text>

  <line x1="155" y1="260" x2="270" y2="260" class="annot"/>
  <text x="220" y="275" class="label">range ≈ 2.8 × ATR</text>

  <!-- continuation -->
  <line x1="240" y1="120" x2="240" y2="95" class="bar"/>
  <line x1="240" y1="105" x2="248" y2="105" class="bar"/>
  <line x1="265" y1="105" x2="265" y2="80" class="bar"/>
  <line x1="265" y1="90" x2="273" y2="90" class="bar"/>
  <line x1="290" y1="95" x2="290" y2="65" class="bar"/>
  <line x1="290" y1="75" x2="298" y2="75" class="bar"/>

  <text x="200" y="320" text-anchor="middle" class="label" fill="#2e7d32">After extended decline → upside reversal</text>

  <!-- DIVIDER -->
  <line x1="400" y1="50" x2="400" y2="370" stroke="#999" stroke-width="0.5"/>

  <!-- Down day with weak close, after advance -->
  <text x="600" y="55" text-anchor="middle" font-weight="600" fill="#c62828">Wide-range DOWN, weak close → bearish reversal</text>

  <!-- climbing bars -->
  <line x1="440" y1="280" x2="440" y2="260" class="bar"/>
  <line x1="440" y1="270" x2="448" y2="270" class="bar"/>
  <line x1="465" y1="265" x2="465" y2="245" class="bar"/>
  <line x1="465" y1="255" x2="473" y2="255" class="bar"/>
  <line x1="490" y1="250" x2="490" y2="230" class="bar"/>
  <line x1="490" y1="240" x2="498" y2="240" class="bar"/>
  <line x1="515" y1="235" x2="515" y2="215" class="bar"/>
  <line x1="515" y1="225" x2="523" y2="225" class="bar"/>
  <line x1="540" y1="220" x2="540" y2="200" class="bar"/>
  <line x1="540" y1="210" x2="548" y2="210" class="bar"/>
  <line x1="565" y1="205" x2="565" y2="185" class="bar"/>
  <line x1="565" y1="195" x2="573" y2="195" class="bar"/>

  <!-- WIDE-RANGE BAR -->
  <line x1="600" y1="320" x2="600" y2="180" class="wide-dn"/>
  <line x1="600" y1="305" x2="612" y2="305" class="wide-dn"/>
  <circle cx="610" cy="305" r="3.5" class="close"/>
  <text x="620" y="308" class="label" fill="#ff6f00">close near LOW</text>

  <line x1="555" y1="340" x2="670" y2="340" class="annot"/>
  <text x="620" y="355" class="label">range ≈ 2.5 × ATR</text>

  <!-- continuation -->
  <line x1="640" y1="335" x2="640" y2="315" class="bar"/>
  <line x1="640" y1="325" x2="648" y2="325" class="bar"/>
  <line x1="665" y1="350" x2="665" y2="330" class="bar"/>
  <line x1="665" y1="340" x2="673" y2="340" class="bar"/>
</svg>
