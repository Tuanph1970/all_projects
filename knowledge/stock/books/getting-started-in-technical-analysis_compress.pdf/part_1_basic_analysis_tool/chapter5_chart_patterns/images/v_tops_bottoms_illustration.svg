<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="sans-serif">
  <style>
    .price { stroke: #333; stroke-width: 1.8; fill: none; }
    .spike { stroke: #c62828; stroke-width: 2.5; fill: none; }
    .label { font-size: 12px; fill: #222; }
    .title { font-size: 16px; font-weight: bold; fill: #111; }
    .sub { font-size: 13px; font-weight: 600; fill: #444; }
  </style>

  <text x="400" y="22" text-anchor="middle" class="title">V Top and V Bottom — Turn-on-a-Dime Reversals</text>

  <!-- V TOP -->
  <text x="200" y="55" text-anchor="middle" class="sub">V Top</text>

  <!-- climbing leg -->
  <polyline points="40,300 70,275 100,245 130,210 160,170 180,130" class="price"/>
  <!-- spike at apex -->
  <line x1="190" y1="160" x2="190" y2="80" class="spike"/>
  <line x1="190" y1="155" x2="200" y2="155" class="spike"/>
  <text x="195" y="70" text-anchor="middle" class="label" fill="#c62828">apex spike</text>

  <!-- declining leg -->
  <polyline points="200,155 220,170 240,210 270,240 300,275 330,300" class="price"/>

  <text x="200" y="335" text-anchor="middle" class="label">no consolidation, no shoulder</text>
  <text x="200" y="352" text-anchor="middle" class="label">→ confirm with spike, reversal day, or gap</text>

  <!-- DIVIDER -->
  <line x1="400" y1="50" x2="400" y2="370" stroke="#999" stroke-width="0.5"/>

  <!-- V BOTTOM -->
  <text x="600" y="55" text-anchor="middle" class="sub">V Bottom</text>

  <!-- declining leg -->
  <polyline points="440,80 470,110 500,150 530,200 560,240 580,275" class="price"/>
  <!-- spike low at apex -->
  <line x1="590" y1="240" x2="590" y2="320" class="spike"/>
  <line x1="590" y1="245" x2="600" y2="245" class="spike"/>
  <text x="595" y="335" text-anchor="middle" class="label" fill="#c62828">apex spike</text>

  <!-- climbing leg -->
  <polyline points="600,245 620,225 640,195 670,160 700,120 730,80" class="price"/>

  <text x="600" y="365" text-anchor="middle" class="label">often follows parabolic move</text>
</svg>
