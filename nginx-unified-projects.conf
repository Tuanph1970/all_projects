# ============================================================================
# Unified Nginx Configuration for All Three Projects
# ============================================================================
# This configuration routes requests to all three backend projects:
#   - Ceramic Mobile App: Port 8002 → /ceramic/
#   - Stock Predict: Port 8080 → /stock/
#   - Mathematic Mobile: Port 8003 → /math/
#
# Installation:
#   sudo cp nginx-unified-projects.conf /etc/nginx/sites-available/
#   sudo ln -sf /etc/nginx/sites-available/nginx-unified-projects.conf /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
# ============================================================================

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=30r/s;

# Upstream definitions
upstream ceramic_api {
    server 127.0.0.1:8002 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

upstream stock_api {
    server 127.0.0.1:18004 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

upstream math_api {
    server 127.0.0.1:8003 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# Main server block
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Client settings
    client_max_body_size 50M;
    client_body_buffer_size 128k;

    # Timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/rss+xml application/atom+xml image/svg+xml;

    # =========================================================================
    # ROOT - API Directory
    # =========================================================================
    location = / {
        return 200 '{
            "server": "Unified API Gateway",
            "apis": {
                "ceramic": {
                    "base_url": "/ceramic",
                    "api": "/ceramic/api/v1",
                    "docs": "/ceramic/docs",
                    "health": "/ceramic/health"
                },
                "stock": {
                    "base_url": "/stock",
                    "api": "/stock/api",
                    "docs": "/stock/docs",
                    "health": "/stock/health"
                },
                "math": {
                    "base_url": "/math",
                    "api": "/math/api",
                    "docs": "/math/swagger",
                    "health": "/math/health"
                }
            },
            "status": "online"
        }';
        add_header Content-Type application/json;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # =========================================================================
    # CERAMIC MOBILE APP API - /ceramic/*
    # =========================================================================

    # Ceramic Health Check
    location /ceramic/health {
        access_log off;
        rewrite ^/ceramic/(.*)$ /$1 break;
        proxy_pass http://ceramic_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Ceramic API Documentation
    location ~ ^/ceramic/(docs|redoc|openapi\.json)$ {
        rewrite ^/ceramic/(.*)$ /$1 break;
        proxy_pass http://ceramic_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Ceramic WebSocket for Chat
    location /ceramic/api/v1/chat/ws {
        rewrite ^/ceramic/(.*)$ /$1 break;
        proxy_pass http://ceramic_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
    }

    # Ceramic API Endpoints
    location /ceramic/ {
        limit_req zone=api_limit burst=20 nodelay;

        # CORS headers
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;

        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        rewrite ^/ceramic/(.*)$ /$1 break;
        proxy_pass http://ceramic_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /ceramic;
        proxy_buffering off;
    }

    # =========================================================================
    # STOCK PREDICT API - /stock/*
    # =========================================================================

    # Stock Health Check
    location = /stock/health {
        access_log off;
        proxy_pass http://stock_api/stock_helper/api/v2/stocks/health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Stock API
    location /stock/ {
        limit_req zone=api_limit burst=20 nodelay;

        # CORS headers
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;

        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        proxy_pass http://stock_api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Script-Name /stock;
        proxy_buffering off;
    }

    # =========================================================================
    # MATHEMATIC MOBILE API - /math/*
    # =========================================================================

    # Math Health Check
    location /math/health {
        access_log off;
        rewrite ^/math/(.*)$ /$1 break;
        proxy_pass http://math_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Math Swagger Documentation
    location ~ ^/math/(swagger|swagger-ui)(.*)$ {
        proxy_pass http://math_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Math API Endpoints
    location /math/ {
        limit_req zone=api_limit burst=20 nodelay;

        # CORS headers
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;

        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        rewrite ^/math/(.*)$ /$1 break;
        proxy_pass http://math_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /math;
        proxy_buffering off;
    }

    # =========================================================================
    # ERROR PAGES
    # =========================================================================
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }

    # Security: Block sensitive files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

