# Nginx configuration for React SPA (standalone container)
server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Handle /stock-app/ prefixed static assets (React homepage setting)
    location /stock-app/static/ {
        alias /usr/share/nginx/html/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must never be cached — it references hashed JS/CSS bundles.
    # Without this, a stale cached index.html requests a bundle hash that no
    # longer exists after a redeploy, causing a blank page.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
    }

    # Handle /stock-app/ prefixed assets (favicon, manifest, etc.)
    location /stock-app/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /index.html;
        # No caching for HTML entry point
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Static assets with caching (direct access)
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The React app is mounted under basename="/stock-app" (see App.js).
    # Visiting "/" without the prefix produces a blank page because
    # BrowserRouter refuses to match. Redirect root to the app's base path.
    # absolute_redirect off + $uri keep the original host:port from the
    # browser instead of letting nginx substitute server_name (which drops
    # the published Docker port).
    absolute_redirect off;
    location = / {
        return 302 /stock-app/;
    }

    # React Router - SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Health check
    location /health {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    # =========================================================================
    # SAME-ORIGIN API PROXY → Traefik gateway
    # -------------------------------------------------------------------------
    # The frontend is built with REACT_APP_API_URL empty, so it calls the API
    # with RELATIVE URLs (/stock_helper/api/v2/...). That means the browser
    # always talks to the same origin it loaded the page from — no CORS, and it
    # works from localhost, the LAN IP, or a remote/public IP identically.
    # These blocks forward those calls to the Traefik gateway on the Docker
    # network. A variable + Docker's embedded DNS (127.0.0.11) defers name
    # resolution to request time so nginx still starts if Traefik is briefly down.
    # =========================================================================

    # Chatbot WebSocket (needs Upgrade/Connection headers)
    location /stock_helper/api/v2/chat/ws {
        resolver 127.0.0.11 valid=30s;
        set $traefik_upstream traefik;
        proxy_pass http://$traefik_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
    }

    # All other API calls
    location /stock_helper/ {
        resolver 127.0.0.11 valid=30s;
        set $traefik_upstream traefik;
        proxy_pass http://$traefik_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_connect_timeout 60s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }
}
