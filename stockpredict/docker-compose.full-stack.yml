# =============================================================================
# Stock Predict Full-Stack Deployment
# =============================================================================
# This file deploys the complete Stock Predict solution:
#   - Backend API (Microservices)
#   - Frontend React App
#   - MySQL Database
#   - Supporting services (Redis, RabbitMQ, Traefik, etc.)
#
# Port Allocation (to avoid conflicts with other projects):
#   - API Gateway: 8004 (HTTP), 8444 (HTTPS)
#   - Traefik Dashboard: 8084
#   - Frontend: 3004
#   - MySQL: 3309
#   - Redis: 6382
#   - RabbitMQ: 5674 (AMQP), 15674 (Management)
#   - Grafana: 3100
#   - Prometheus: 9094
#   - Jaeger: 16686
#
# Usage:
#   docker compose -f docker-compose.full-stack.yml up -d --build
#
# =============================================================================

services:
  # =============================================================================
  # API GATEWAY - Traefik
  # =============================================================================
  traefik:
    image: traefik:v3.2
    container_name: stock_traefik
    command:
      - "--api.insecure=true"
      - "--api.dashboard=true"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.constraints=Label(`traefik.project`,`stock`)"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--accesslog=true"
      - "--accesslog.format=json"
      - "--log.level=INFO"
      - "--metrics.prometheus=true"
      - "--metrics.prometheus.buckets=0.1,0.3,1.2,5.0"
    ports:
      - "18004:80"    # API Gateway (temp remap from 8004 to avoid math-solver conflict)
      - "8444:443"    # HTTPS
      - "8084:8080"   # Traefik dashboard
    volumes:
      - ./stock_microservices/traefik:/etc/traefik/dynamic:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - stock-network
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.project=stock"
      - "traefik.http.routers.stock-dashboard.rule=Host(`traefik.localhost`)"
      - "traefik.http.routers.stock-dashboard.service=api@internal"

  # =============================================================================
  # FRONTEND - React App
  # =============================================================================
  frontend:
    build:
      context: ./stock_react_javascript/stock-react-app
      dockerfile: Dockerfile
      args:
        # API Gateway URL baked into the frontend at build time. Defaults to
        # localhost; deploy-interactive.sh sets it to the host's LAN IP so the
        # app also works from other machines on the network.
        # NOTE: `-` (not `:-`) so an explicit empty value is honored → relative
        # API URLs (same-origin via nginx). Unset falls back to the localhost default.
        - REACT_APP_API_URL=${REACT_APP_API_URL-http://localhost:18004}
    container_name: stock_frontend
    environment:
      - NODE_ENV=production
    ports:
      - "3004:80"
    networks:
      - stock-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    labels:
      - "traefik.enable=true"
      - "traefik.project=stock"
      - "traefik.http.routers.stock-frontend.rule=Host(`stock.localhost`) || PathPrefix(`/app`)"
      - "traefik.http.routers.stock-frontend.entrypoints=web"
      - "traefik.http.routers.stock-frontend.priority=5"
      - "traefik.http.services.stock-frontend.loadbalancer.server.port=80"

  # =============================================================================
  # DATABASE - MySQL
  # =============================================================================
  mysql:
    image: mysql:8.0
    container_name: stock_mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-Mysql_2025}
      MYSQL_USER: ${MYSQL_USER:-stockuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-stockpass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-defaultdb}
    ports:
      - "3309:3306"   # Unique port to avoid conflicts
    volumes:
      - mysql_data:/var/lib/mysql
      - ./stock_microservices/mysql/init:/docker-entrypoint-initdb.d:ro
    networks:
      - stock-network
    restart: unless-stopped
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -P 3306 -u root -p$$MYSQL_ROOT_PASSWORD -e 'SELECT 1' 2>/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 180s

  # =============================================================================
  # MESSAGE BROKER - RabbitMQ
  # =============================================================================
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: stock_rabbitmq
    hostname: stock_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-stockuser}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-stockpass}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/stock}
    ports:
      - "5674:5672"   # AMQP (unique port)
      - "15674:15672" # Management UI (unique port)
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./stock_microservices/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./stock_microservices/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    networks:
      - stock-network
    restart: unless-stopped
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.project=stock"
      - "traefik.http.routers.stock-rabbitmq.rule=Host(`rabbitmq.stock.localhost`)"
      - "traefik.http.routers.stock-rabbitmq.entrypoints=web"
      - "traefik.http.services.stock-rabbitmq.loadbalancer.server.port=15672"

  # =============================================================================
  # CACHE - Redis
  # =============================================================================
  redis:
    image: redis:7.2-alpine
    container_name: stock_redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6382:6379"   # Unique port to avoid conflicts
    volumes:
      - redis_data:/data
    networks:
      - stock-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =============================================================================
  # OBSERVABILITY - Prometheus
  # =============================================================================
  prometheus:
    image: prom/prometheus:v2.50.0
    container_name: stock_prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    ports:
      - "9094:9090"   # Unique port to avoid conflicts
    volumes:
      - ./stock_microservices/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./stock_microservices/monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    networks:
      - stock-network
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.project=stock"
      - "traefik.http.routers.stock-prometheus.rule=Host(`prometheus.stock.localhost`)"
      - "traefik.http.routers.stock-prometheus.entrypoints=web"
      - "traefik.http.services.stock-prometheus.loadbalancer.server.port=9090"

  # =============================================================================
  # OBSERVABILITY - Grafana
  # =============================================================================
  grafana:
    image: grafana/grafana:10.3.1
    container_name: stock_grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: "http://grafana.localhost"
    ports:
      - "${GRAFANA_PORT:-3100}:3000"
    volumes:
      - ./stock_microservices/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    networks:
      - stock-network
    restart: unless-stopped
    depends_on:
      - prometheus
    labels:
      - "traefik.enable=true"
      - "traefik.project=stock"
      - "traefik.http.routers.stock-grafana.rule=Host(`grafana.stock.localhost`)"
      - "traefik.http.routers.stock-grafana.entrypoints=web"
      - "traefik.http.services.stock-grafana.loadbalancer.server.port=3000"

  # =============================================================================
  # OBSERVABILITY - Jaeger (Distributed Tracing)
  # =============================================================================
  jaeger:
    image: jaegertracing/all-in-one:1.54
    container_name: stock_jaeger
    environment:
      COLLECTOR_ZIPKIN_HOST_PORT: ":9411"
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "6831:6831/udp"  # Jaeger thrift compact
      - "16686:16686"    # Jaeger UI
      - "4317:4317"      # OTLP gRPC
      - "4318:4318"      # OTLP HTTP
    networks:
      - stock-network
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.project=stock"
      - "traefik.http.routers.stock-jaeger.rule=Host(`jaeger.stock.localhost`)"
      - "traefik.http.routers.stock-jaeger.entrypoints=web"
      - "traefik.http.services.stock-jaeger.loadbalancer.server.port=16686"

  # =============================================================================
  # MICROSERVICES
  # =============================================================================

  # Auth Service
  auth-service:
    build:
      context: ./stock_microservices
      dockerfile: services/auth-service/Dockerfile
    container_name: stock_auth_service
    environment:
      - SERVICE_NAME=auth-service
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3004,http://localhost:3000}
      - SERVICE_VERSION=1.0.0
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - DEBUG=${DEBUG:-0}
      - API_PREFIX=stock_helper
      - DATABASE_HOST=mysql
      - DATABASE_PORT=3306
      - DATABASE_USER=${MYSQL_USER:-stockuser}
      - DATABASE_PASSWORD=${MYSQL_PASSWORD:-stockpass}
      - DATABASE_NAME=${MYSQL_DATABASE:-defaultdb}
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=${RABBITMQ_USER:-stockuser}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-stockpass}
      - RABBITMQ_VHOST=${RABBITMQ_VHOST:-/stock}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-secret-key-change-in-production}
      - JWT_ALGORITHM=HS256
      - JWT_ACCESS_TOKEN_EXPIRE_MINUTES=30
      - JWT_REFRESH_TOKEN_EXPIRE_DAYS=7
      - TRACING_ENABLED=true
      - TRACING_JAEGER_HOST=jaeger
      - TRACING_JAEGER_PORT=6831
    expose:
      - "8007"
    networks:
      - stock-network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8007/health/live')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    labels:
      - "traefik.enable=true"
      - "traefik.project=stock"
      - "traefik.http.routers.stock-auth.rule=PathPrefix(`/stock_helper/api/v2/auth`)"
      - "traefik.http.routers.stock-auth.entrypoints=web"
      - "traefik.http.routers.stock-auth.priority=10"
      - "traefik.http.services.stock-auth.loadbalancer.server.port=8007"

  # Stock Data Service
  stock-data-service:
    build:
      context: ./stock_microservices
      dockerfile: services/stock-data-service/Dockerfile
    container_name: stock_data_service
    environment:
      - SERVICE_NAME=stock-data-service
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3004,http://localhost:3000}
      - SERVICE_VERSION=1.0.0
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - DEBUG=${DEBUG:-0}
      - API_PREFIX=stock_helper
      - DATABASE_HOST=mysql
      - DATABASE_PORT=3306
      - DATABASE_USER=${MYSQL_USER:-stockuser}
      - DATABASE_PASSWORD=${MYSQL_PASSWORD:-stockpass}
      - DATABASE_NAME=${MYSQL_DATABASE:-defaultdb}
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=${RABBITMQ_USER:-stockuser}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-stockpass}
      - RABBITMQ_VHOST=${RABBITMQ_VHOST:-/stock}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-secret-key-change-in-production}
      - VNSTOCK_DATA_SOURCE=${VNSTOCK_DATA_SOURCE:-VCI}
      - TRACING_ENABLED=true
      - TRACING_JAEGER_HOST=jaeger
      - TRACING_JAEGER_PORT=6831
    expose:
      - "8001"
    networks:
      - stock-network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8001/health/live')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.project=stock"
      - "traefik.http.routers.stock-stocks.rule=PathPrefix(`/stock_helper/api/v2/companies`) || PathPrefix(`/stock_helper/api/v2/stocks`) || PathPrefix(`/stock_helper/api/v2/market`) || PathPrefix(`/stock_helper/api/v2/industries`) || PathPrefix(`/stock_helper/api/v2/priceboards`)"
      - "traefik.http.routers.stock-stocks.entrypoints=web"
      - "traefik.http.routers.stock-stocks.priority=10"
      - "traefik.http.services.stock-stocks.loadbalancer.server.port=8001"

  # Portfolio Service
  portfolio-service:
    build:
      context: ./stock_microservices
      dockerfile: services/portfolio-service/Dockerfile
    container_name: stock_portfolio_service
    environment:
      - SERVICE_NAME=portfolio-service
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3004,http://localhost:3000}
      - SERVICE_VERSION=1.0.0
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - DEBUG=${DEBUG:-0}
      - API_PREFIX=stock_helper
      - DATABASE_HOST=mysql
      - DATABASE_PORT=3306
      - DATABASE_USER=${MYSQL_USER:-stockuser}
      - DATABASE_PASSWORD=${MYSQL_PASSWORD:-stockpass}
      - DATABASE_NAME=${MYSQL_DATABASE:-defaultdb}
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=${RABBITMQ_USER:-stockuser}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-stockpass}
      - RABBITMQ_VHOST=${RABBITMQ_VHOST:-/stock}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-secret-key-change-in-production}
      - JWT_ALGORITHM=HS256
      - AUTH_SERVICE_URL=http://auth-service:8007
      - STOCK_DATA_SERVICE_URL=http://stock-data-service:8001
      - TRACING_ENABLED=true
      - TRACING_JAEGER_HOST=jaeger
      - TRACING_JAEGER_PORT=6831
    expose:
      - "8003"
    networks:
      - stock-network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8003/health/live')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.project=stock"
      - "traefik.http.routers.stock-portfolio.rule=PathPrefix(`/stock_helper/api/v2/portfolio`)"
      - "traefik.http.routers.stock-portfolio.entrypoints=web"
      - "traefik.http.routers.stock-portfolio.priority=10"
      - "traefik.http.services.stock-portfolio.loadbalancer.server.port=8003"

  # News Service - company & macro news ingestion + good/bad company-news notifications
  news-service:
    build:
      context: ./stock_microservices
      dockerfile: services/news-service/Dockerfile
    container_name: stock_news_service
    environment:
      - SERVICE_NAME=news-service
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3004,http://localhost:3000}
      - SERVICE_VERSION=0.1.0
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - DEBUG=${DEBUG:-0}
      - API_PREFIX=stock_helper
      # root: news-service auto-creates its DB on startup, which needs CREATE DATABASE
      # (stockuser is DB-scoped only).
      - DATABASE_URL=mysql+pymysql://root:${MYSQL_ROOT_PASSWORD:-Mysql_2025}@mysql:3306/stock_news
      - STOCK_DATA_SERVICE_URL=http://stock-data-service:8001
      - AI_INSIGHTS_SERVICE_URL=http://ai-insights-service:8005
      - PORTFOLIO_SERVICE_URL=http://portfolio-service:8003
      - DECISION_HELPER_SERVICE_URL=http://decision-helper-service:8010
      - EVENT_REACTION_SERVICE_URL=http://event-reaction-service:8012
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=${RABBITMQ_USER:-stockuser}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-stockpass}
      - RABBITMQ_VHOST=${RABBITMQ_VHOST:-/stock}
      - ENABLE_COMPANY=1
      - ENABLE_MACRO=${NEWS_ENABLE_MACRO:-1}
      - ENABLE_BRIDGE=${NEWS_ENABLE_BRIDGE:-1}
      - ENABLE_EMAIL=0
      - COMPANY_POLL_INTERVAL_SECONDS=${NEWS_COMPANY_POLL_INTERVAL:-900}
      - MACRO_POLL_INTERVAL_SECONDS=${NEWS_MACRO_POLL_INTERVAL:-1800}
      # Optional JSON economic-calendar registry (actual+consensus) for bridged,
      # measurable events. Empty -> built-in Fed/Treasury RSS (news corpus only,
      # not bridged, since press releases carry no numeric actual/consensus).
      - FEED_REGISTRY_PATH=${NEWS_FEED_REGISTRY_PATH:-}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-secret-key-change-in-production}
      - JWT_ALGORITHM=HS256
      - TRACING_ENABLED=true
      - TRACING_JAEGER_HOST=jaeger
      - TRACING_JAEGER_PORT=6831
    expose:
      - "8013"
    networks:
      - stock-network
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8013/health/live')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    labels:
      - "traefik.enable=true"
      - "traefik.project=stock"
      - "traefik.http.routers.stock-news.rule=PathPrefix(`/stock_helper/api/v2/news`)"
      - "traefik.http.routers.stock-news.entrypoints=web"
      - "traefik.http.routers.stock-news.priority=10"
      - "traefik.http.services.stock-news.loadbalancer.server.port=8013"

  # Event-Reaction Service - price reaction to events (measure / cross-section)
  event-reaction-service:
    build:
      context: ./stock_microservices
      dockerfile: services/event-reaction-service/Dockerfile
    container_name: stock_event_reaction_service
    environment:
      - SERVICE_NAME=event-reaction-service
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3004,http://localhost:3000}
      - SERVICE_VERSION=0.1.0
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - DEBUG=${DEBUG:-0}
      - API_PREFIX=stock_helper
      - STOCK_DATA_SERVICE_URL=http://stock-data-service:8001
      # root: event-reaction-service auto-creates its DB on startup, which needs
      # CREATE DATABASE (stockuser is DB-scoped only).
      - DATABASE_URL=mysql+pymysql://root:${MYSQL_ROOT_PASSWORD:-Mysql_2025}@mysql:3306/stock_event_reaction
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-secret-key-change-in-production}
      - JWT_ALGORITHM=HS256
      - TRACING_ENABLED=true
      - TRACING_JAEGER_HOST=jaeger
      - TRACING_JAEGER_PORT=6831
    expose:
      - "8012"
    networks:
      - stock-network
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8012/health/live')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    labels:
      - "traefik.enable=true"
      - "traefik.project=stock"
      - "traefik.http.routers.stock-event-reaction.rule=PathPrefix(`/stock_helper/api/v2/event-reaction`)"
      - "traefik.http.routers.stock-event-reaction.entrypoints=web"
      - "traefik.http.routers.stock-event-reaction.priority=10"
      - "traefik.http.services.stock-event-reaction.loadbalancer.server.port=8012"

  # Prediction Service
  prediction-service:
    build:
      context: ./stock_microservices
      dockerfile: services/prediction-service/Dockerfile
    container_name: stock_prediction_service
    environment:
      - SERVICE_NAME=prediction-service
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3004,http://localhost:3000}
      - SERVICE_VERSION=1.0.0
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - DEBUG=${DEBUG:-0}
      - API_PREFIX=stock_helper
      - DATABASE_HOST=mysql
      - DATABASE_PORT=3306
      - DATABASE_USER=${MYSQL_USER:-stockuser}
      - DATABASE_PASSWORD=${MYSQL_PASSWORD:-stockpass}
      - DATABASE_NAME=${MYSQL_DATABASE:-defaultdb}
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=${RABBITMQ_USER:-stockuser}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-stockpass}
      - RABBITMQ_VHOST=${RABBITMQ_VHOST:-/stock}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-secret-key-change-in-production}
      - JWT_ALGORITHM=HS256
      - STOCK_DATA_SERVICE_URL=http://stock-data-service:8001
      - MODEL_PATH=/app/models
      - TRACING_ENABLED=true
      - TRACING_JAEGER_HOST=jaeger
      - TRACING_JAEGER_PORT=6831
    expose:
      - "8002"
    volumes:
      - prediction_models:/app/models
    networks:
      - stock-network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      stock-data-service:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8002/health/live')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    labels:
      - "traefik.enable=true"
      - "traefik.project=stock"
      - "traefik.http.routers.stock-predictions.rule=PathPrefix(`/stock_helper/api/v2/predictions`) || PathPrefix(`/stock_helper/api/v2/predict`) || PathPrefix(`/stock_helper/api/v2/models`) || PathPrefix(`/stock_helper/api/v2/solutions`)"
      - "traefik.http.routers.stock-predictions.entrypoints=web"
      - "traefik.http.routers.stock-predictions.priority=10"
      - "traefik.http.services.stock-predictions.loadbalancer.server.port=8002"

  # Analysis Service
  analysis-service:
    build:
      context: ./stock_microservices
      dockerfile: services/analysis-service/Dockerfile
    container_name: stock_analysis_service
    environment:
      - SERVICE_NAME=analysis-service
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3004,http://localhost:3000}
      - SERVICE_VERSION=1.0.0
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - DEBUG=${DEBUG:-0}
      - API_PREFIX=stock_helper
      - DATABASE_HOST=mysql
      - DATABASE_PORT=3306
      - DATABASE_USER=${MYSQL_USER:-stockuser}
      - DATABASE_PASSWORD=${MYSQL_PASSWORD:-stockpass}
      - DATABASE_NAME=${MYSQL_DATABASE:-defaultdb}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=${RABBITMQ_USER:-stockuser}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-stockpass}
      - RABBITMQ_VHOST=${RABBITMQ_VHOST:-/stock}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-secret-key-change-in-production}
      - STOCK_DATA_SERVICE_URL=http://stock-data-service:8001
      - TRACING_ENABLED=true
      - TRACING_JAEGER_HOST=jaeger
      - TRACING_JAEGER_PORT=6831
    expose:
      - "8004"
    networks:
      - stock-network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      stock-data-service:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8004/health/live')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.project=stock"
      - "traefik.http.routers.stock-analysis.rule=PathPrefix(`/stock_helper/api/v2/analysis`)"
      - "traefik.http.routers.stock-analysis.entrypoints=web"
      - "traefik.http.routers.stock-analysis.priority=10"
      - "traefik.http.services.stock-analysis.loadbalancer.server.port=8004"

  # AI Insights Service
  ai-insights-service:
    build:
      context: ./stock_microservices
      dockerfile: services/ai-insights-service/Dockerfile
    container_name: stock_ai_insights_service
    environment:
      - SERVICE_NAME=ai-insights-service
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3004,http://localhost:3000}
      - SERVICE_VERSION=1.0.0
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - DEBUG=${DEBUG:-0}
      - API_PREFIX=stock_helper
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-secret-key-change-in-production}
      - STOCK_DATA_SERVICE_URL=http://stock-data-service:8001
      - ANALYSIS_SERVICE_URL=http://analysis-service:8004
      - PREDICTION_SERVICE_URL=http://prediction-service:8002
      - LLM_PROVIDER=${LLM_PROVIDER:-auto}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-gpt-4}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.openai.com/v1}
    expose:
      - "8005"
    networks:
      - stock-network
    depends_on:
      redis:
        condition: service_healthy
      stock-data-service:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8005/health/live')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.project=stock"
      - "traefik.http.routers.stock-ai.rule=PathPrefix(`/stock_helper/api/v2/ai`)"
      - "traefik.http.routers.stock-ai.entrypoints=web"
      - "traefik.http.routers.stock-ai.priority=10"
      - "traefik.http.services.stock-ai.loadbalancer.server.port=8005"

  # Journal Service
  journal-service:
    build:
      context: ./stock_microservices
      dockerfile: services/journal-service/Dockerfile
    container_name: stock_journal_service
    environment:
      - SERVICE_NAME=journal-service
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3004,http://localhost:3000}
      - SERVICE_VERSION=1.0.0
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - DEBUG=${DEBUG:-0}
      - API_PREFIX=stock_helper
      - DATABASE_HOST=mysql
      - DATABASE_PORT=3306
      - DATABASE_USER=${MYSQL_USER:-stockuser}
      - DATABASE_PASSWORD=${MYSQL_PASSWORD:-stockpass}
      - DATABASE_NAME=${MYSQL_DATABASE:-defaultdb}
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=${RABBITMQ_USER:-stockuser}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-stockpass}
      - RABBITMQ_VHOST=${RABBITMQ_VHOST:-/stock}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-secret-key-change-in-production}
      - JWT_ALGORITHM=HS256
      - AUTH_SERVICE_URL=http://auth-service:8007
      - STOCK_DATA_SERVICE_URL=http://stock-data-service:8001
      - UPLOAD_DIR=/app/uploads/diary_charts
      - MAX_UPLOAD_SIZE_MB=10
      - TRACING_ENABLED=true
      - TRACING_JAEGER_HOST=jaeger
      - TRACING_JAEGER_PORT=6831
    expose:
      - "8008"
    volumes:
      - journal_uploads:/app/uploads
    networks:
      - stock-network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8008/health/live')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.project=stock"
      - "traefik.http.routers.stock-journal.rule=PathPrefix(`/stock_helper/api/v2/journal`)"
      - "traefik.http.routers.stock-journal.entrypoints=web"
      - "traefik.http.routers.stock-journal.priority=10"
      - "traefik.http.services.stock-journal.loadbalancer.server.port=8008"

  # Chatbot Service
  chatbot-service:
    build:
      context: ./stock_microservices
      dockerfile: services/chatbot-service/Dockerfile
    container_name: stock_chatbot_service
    environment:
      - SERVICE_NAME=chatbot-service
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3004,http://localhost:3000}
      - SERVICE_VERSION=1.0.0
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - DEBUG=${DEBUG:-0}
      - API_PREFIX=stock_helper
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-secret-key-change-in-production}
      - STOCK_DATA_SERVICE_URL=http://stock-data-service:8001
      - ANALYSIS_SERVICE_URL=http://analysis-service:8004
      - PREDICTION_SERVICE_URL=http://prediction-service:8002
      - AI_INSIGHTS_SERVICE_URL=http://ai-insights-service:8005
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    expose:
      - "8006"
    networks:
      - stock-network
    depends_on:
      redis:
        condition: service_healthy
      stock-data-service:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8006/health/live')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.project=stock"
      - "traefik.http.routers.stock-chatbot.rule=PathPrefix(`/stock_helper/api/v2/chat`)"
      - "traefik.http.routers.stock-chatbot.entrypoints=web"
      - "traefik.http.routers.stock-chatbot.priority=10"
      - "traefik.http.services.stock-chatbot.loadbalancer.server.port=8006"

  # Knowledge QA Service - Knowledge base Q&A with Graph RAG (Neo4j + Ollama)
  knowledge-qa-service:
    build:
      context: ./stock_microservices
      dockerfile: services/knowledge-qa-service/Dockerfile
    container_name: stock_knowledge_qa_service
    environment:
      - SERVICE_NAME=knowledge-qa-service
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3004,http://localhost:3000}
      - SERVICE_VERSION=1.0.0
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - DEBUG=${DEBUG:-0}
      - API_PREFIX=stock_helper
      - NEO4J_URI=bolt://host.docker.internal:7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-neo4jabc}
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.1}
      - OLLAMA_TIMEOUT=120.0
      - TRACING_ENABLED=true
      - TRACING_JAEGER_HOST=jaeger
      - TRACING_JAEGER_PORT=6831
    expose:
      - "8009"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - stock-network
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8009/health/live')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.project=stock"
      - "traefik.http.routers.stock-knowledge-qa.rule=PathPrefix(`/stock_helper/api/v2/knowledge-qa`)"
      - "traefik.http.routers.stock-knowledge-qa.entrypoints=web"
      - "traefik.http.routers.stock-knowledge-qa.priority=10"
      - "traefik.http.services.stock-knowledge-qa.loadbalancer.server.port=8009"

  # Decision Helper Service — Schwager-based trader decision pipeline
  decision-helper-service:
    build:
      context: ./stock_microservices
      dockerfile: services/decision-helper-service/Dockerfile
    container_name: stock_decision_helper_service
    environment:
      - SERVICE_NAME=decision-helper-service
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3004,http://localhost:3000}
      - SERVICE_VERSION=0.1.0
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - DEBUG=${DEBUG:-0}
      - API_PREFIX=stock_helper
      - DATABASE_HOST=mysql
      - DATABASE_PORT=3306
      - DATABASE_USER=${MYSQL_USER:-stockuser}
      - DATABASE_PASSWORD=${MYSQL_PASSWORD:-stockpass}
      - DATABASE_NAME=${MYSQL_DATABASE:-defaultdb}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=${RABBITMQ_USER:-stockuser}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-stockpass}
      - RABBITMQ_VHOST=${RABBITMQ_VHOST:-/stock}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-secret-key-change-in-production}
      - JWT_ALGORITHM=HS256
      - STOCK_DATA_SERVICE_URL=http://stock-data-service:8001
      - ANALYSIS_SERVICE_URL=http://analysis-service:8004
      - AI_INSIGHTS_SERVICE_URL=http://ai-insights-service:8005
      - JOURNAL_SERVICE_URL=http://journal-service:8008
      - MARKET_GATEWAY_TIMEOUT_MS=${MARKET_GATEWAY_TIMEOUT_MS:-10000}
      - TRACING_ENABLED=true
      - TRACING_JAEGER_HOST=jaeger
      - TRACING_JAEGER_PORT=6831
    expose:
      - "8010"
    networks:
      - stock-network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8010/health/live')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    labels:
      - "traefik.enable=true"
      - "traefik.project=stock"
      - "traefik.http.routers.stock-decision-helper.rule=PathPrefix(`/stock_helper/api/v2/helper`)"
      - "traefik.http.routers.stock-decision-helper.entrypoints=web"
      - "traefik.http.routers.stock-decision-helper.priority=10"
      - "traefik.http.services.stock-decision-helper.loadbalancer.server.port=8010"

  # Chart decomposition service - VMD/EMD/Heston etc.
  chart-decomp-service:
    build:
      context: ./stock_microservices
      dockerfile: services/chart-decomp-service/Dockerfile
    container_name: stock_chart_decomp_service
    environment:
      - SERVICE_NAME=chart-decomp-service
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3004,http://localhost:3000}
      - SERVICE_VERSION=0.1.0
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - DEBUG=${DEBUG:-0}
      - API_PREFIX=stock_helper
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-secret-key-change-in-production}
      - JWT_ALGORITHM=HS256
      - TRACING_ENABLED=true
      - TRACING_JAEGER_HOST=jaeger
      - TRACING_JAEGER_PORT=6831
    expose:
      - "8011"
    networks:
      - stock-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8011/health/live')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    labels:
      - "traefik.enable=true"
      - "traefik.project=stock"
      - "traefik.http.routers.stock-chart-decomp.rule=PathPrefix(`/stock_helper/api/v2/chart-decomp`)"
      - "traefik.http.routers.stock-chart-decomp.entrypoints=web"
      - "traefik.http.routers.stock-chart-decomp.priority=10"
      - "traefik.http.services.stock-chart-decomp.loadbalancer.server.port=8011"

  # Ollama - Local LLM inference server (CPU mode)
  ollama:
    image: ollama/ollama
    container_name: stock_ollama
    profiles:
      - cpu
    expose:
      - "11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - stock-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:11434/api/tags || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Ollama with NVIDIA GPU acceleration
  ollama-gpu:
    image: ollama/ollama
    container_name: stock_ollama
    profiles:
      - gpu
    expose:
      - "11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - stock-network
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:11434/api/tags || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

networks:
  stock-network:
    driver: bridge
    name: stock-network

volumes:
  mysql_data:
    name: stock-mysql-data
  rabbitmq_data:
    name: stock-rabbitmq-data
  redis_data:
    name: stock-redis-data
  prometheus_data:
    name: stock-prometheus-data
  grafana_data:
    name: stock-grafana-data
  prediction_models:
    name: stock-prediction-models
  journal_uploads:
    name: stock-journal-uploads
  ollama_data:
    name: stock-ollama-data
