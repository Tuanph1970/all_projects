# Grafana Dashboard Provisioning

apiVersion: 1

providers:
  - name: 'Stock Helper Dashboards'
    orgId: 1
    folder: 'Stock Helper'
    folderUid: 'stock-helper'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/json
