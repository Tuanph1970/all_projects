# =============================================================================
# Stock Helper Microservices - Local Development Override
# =============================================================================
# Usage: docker compose -f docker-compose.yml -f docker-compose.local.yml up -d
#
# This override file provides local development settings:
#   - Exposes additional ports for debugging
#   - Development environment variables
#   - Port allocation: Mercai=8002, Math=8003, Stock=8004
# =============================================================================

services:
  # =============================================================================
  # Override RabbitMQ - Expose management port
  # =============================================================================
  rabbitmq:
    ports:
      - "5672:5672"
      - "15672:15672"

  # =============================================================================
  # Override Redis - Expose for debugging with unique port
  # =============================================================================
  redis:
    ports:
      - "6382:6379"  # Use 6382 to avoid conflict with Mercai (6379) and Math (6380)
