# =============================================================================
# Stock Helper Microservices - Standalone Local Development Configuration
# =============================================================================
# Usage: docker compose -f docker-compose.local.yml up -d
#
# This is a STANDALONE configuration for local development:
#   - Uses LOCAL MySQL (host.docker.internal) instead of SSH tunnel
#   - No SSH tunnel service
#   - Development-friendly ports
#   - Avoids port 8002 which is reserved for Ceramic app
# =============================================================================

services:
  # =============================================================================
  # API GATEWAY - Traefik
  # =============================================================================
  traefik:
    image: traefik:v3.2
    container_name: stock-traefik
    command:
      - "--api.insecure=true"
      - "--api.dashboard=true"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:8088"
      - "--entrypoints.websecure.address=:443"
      - "--accesslog=true"
      - "--accesslog.format=json"
      - "--log.level=INFO"
      - "--metrics.prometheus=true"
    ports:
      - "8088:8088"
      - "8089:8080"  # Dashboard
    volumes:
      - ./traefik:/etc/traefik/dynamic:ro
    networks:
      - stock-network
    restart: unless-stopped

  # =============================================================================
  # MESSAGE BROKER - RabbitMQ
  # =============================================================================
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: stock-rabbitmq
    hostname: stock-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-stockuser}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-stockpass}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/stock}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    networks:
      - stock-network
    restart: unless-stopped
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # =============================================================================
  # CACHE - Redis
  # =============================================================================
  redis:
    image: redis:7.2-alpine
    container_name: stock-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6382:6379"  # Use 6382 to avoid conflict with other projects
    volumes:
      - redis_data:/data
    networks:
      - stock-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =============================================================================
  # OBSERVABILITY - Prometheus
  # =============================================================================
  prometheus:
    image: prom/prometheus:v2.50.0
    container_name: stock-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - stock-network
    restart: unless-stopped

  # =============================================================================
  # OBSERVABILITY - Grafana
  # =============================================================================
  grafana:
    image: grafana/grafana:10.3.1
    container_name: stock-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "${GRAFANA_PORT:-3100}:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    networks:
      - stock-network
    restart: unless-stopped
    depends_on:
      - prometheus

  # =============================================================================
  # OBSERVABILITY - Jaeger
  # =============================================================================
  jaeger:
    image: jaegertracing/all-in-one:1.54
    container_name: stock-jaeger
    environment:
      COLLECTOR_ZIPKIN_HOST_PORT: ":9411"
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    networks:
      - stock-network
    restart: unless-stopped

  # =============================================================================
  # MICROSERVICES - Using LOCAL MySQL
  # =============================================================================

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    container_name: stock-auth-service
    environment:
      - SERVICE_NAME=auth-service
      - SERVICE_VERSION=1.0.0
      - ENVIRONMENT=development
      - DEBUG=1
      - API_PREFIX=stock_helper
      - DATABASE_HOST=host.docker.internal
      - DATABASE_PORT=3306
      - DATABASE_USER=${MYSQL_USER:-stockuser}
      - DATABASE_PASSWORD=${MYSQL_PASSWORD:-Mysql_2025}
      - DATABASE_NAME=defaultdb
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=${RABBITMQ_USER:-stockuser}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-stockpass}
      - RABBITMQ_VHOST=${RABBITMQ_VHOST:-/stock}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-secret-key-change-in-production}
      - JWT_ALGORITHM=HS256
      - TRACING_ENABLED=true
      - TRACING_JAEGER_HOST=jaeger
      - TRACING_JAEGER_PORT=6831
    ports:
      - "8007:8007"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - stock-network
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8007/health/live')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  stock-data-service:
    build:
      context: .
      dockerfile: services/stock-data-service/Dockerfile
    container_name: stock-data-service
    environment:
      - SERVICE_NAME=stock-data-service
      - SERVICE_VERSION=1.0.0
      - ENVIRONMENT=development
      - DEBUG=1
      - API_PREFIX=stock_helper
      - DATABASE_HOST=host.docker.internal
      - DATABASE_PORT=3306
      - DATABASE_USER=${MYSQL_USER:-stockuser}
      - DATABASE_PASSWORD=${MYSQL_PASSWORD:-Mysql_2025}
      - DATABASE_NAME=defaultdb
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=${RABBITMQ_USER:-stockuser}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-stockpass}
      - RABBITMQ_VHOST=${RABBITMQ_VHOST:-/stock}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - VNSTOCK_DATA_SOURCE=${VNSTOCK_DATA_SOURCE:-VCI}
      - TRACING_ENABLED=true
      - TRACING_JAEGER_HOST=jaeger
      - TRACING_JAEGER_PORT=6831
    ports:
      - "8001:8001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - stock-network
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8001/health/live')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  portfolio-service:
    build:
      context: .
      dockerfile: services/portfolio-service/Dockerfile
    container_name: stock-portfolio-service
    environment:
      - SERVICE_NAME=portfolio-service
      - SERVICE_VERSION=1.0.0
      - ENVIRONMENT=development
      - DEBUG=1
      - API_PREFIX=stock_helper
      - DATABASE_HOST=host.docker.internal
      - DATABASE_PORT=3306
      - DATABASE_USER=${MYSQL_USER:-stockuser}
      - DATABASE_PASSWORD=${MYSQL_PASSWORD:-Mysql_2025}
      - DATABASE_NAME=defaultdb
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=${RABBITMQ_USER:-stockuser}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-stockpass}
      - RABBITMQ_VHOST=${RABBITMQ_VHOST:-/stock}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-secret-key-change-in-production}
      - AUTH_SERVICE_URL=http://auth-service:8007
      - STOCK_DATA_SERVICE_URL=http://stock-data-service:8001
      - TRACING_ENABLED=true
      - TRACING_JAEGER_HOST=jaeger
      - TRACING_JAEGER_PORT=6831
    ports:
      - "8013:8003"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - stock-network
    depends_on:
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8003/health/live')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  prediction-service:
    build:
      context: .
      dockerfile: services/prediction-service/Dockerfile
    container_name: stock-prediction-service
    environment:
      - SERVICE_NAME=prediction-service
      - SERVICE_VERSION=1.0.0
      - ENVIRONMENT=development
      - DEBUG=1
      - API_PREFIX=stock_helper
      - DATABASE_HOST=host.docker.internal
      - DATABASE_PORT=3306
      - DATABASE_USER=${MYSQL_USER:-stockuser}
      - DATABASE_PASSWORD=${MYSQL_PASSWORD:-Mysql_2025}
      - DATABASE_NAME=defaultdb
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=${RABBITMQ_USER:-stockuser}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-stockpass}
      - RABBITMQ_VHOST=${RABBITMQ_VHOST:-/stock}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-secret-key-change-in-production}
      - STOCK_DATA_SERVICE_URL=http://stock-data-service:8001
      - MODEL_PATH=/app/models
      - TRACING_ENABLED=true
      - TRACING_JAEGER_HOST=jaeger
      - TRACING_JAEGER_PORT=6831
    expose:
      - "8002"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - prediction_models:/app/models
    networks:
      - stock-network
    depends_on:
      redis:
        condition: service_healthy
      stock-data-service:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8002/health/live')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  analysis-service:
    build:
      context: .
      dockerfile: services/analysis-service/Dockerfile
    container_name: stock-analysis-service
    environment:
      - SERVICE_NAME=analysis-service
      - SERVICE_VERSION=1.0.0
      - ENVIRONMENT=development
      - DEBUG=1
      - API_PREFIX=stock_helper
      - DATABASE_HOST=host.docker.internal
      - DATABASE_PORT=3306
      - DATABASE_USER=${MYSQL_USER:-stockuser}
      - DATABASE_PASSWORD=${MYSQL_PASSWORD:-Mysql_2025}
      - DATABASE_NAME=defaultdb
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-secret-key-change-in-production}
      - STOCK_DATA_SERVICE_URL=http://stock-data-service:8001
      - TRACING_ENABLED=true
      - TRACING_JAEGER_HOST=jaeger
      - TRACING_JAEGER_PORT=6831
    ports:
      - "8004:8004"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - stock-network
    depends_on:
      redis:
        condition: service_healthy
      stock-data-service:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8004/health/live')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  ai-insights-service:
    build:
      context: .
      dockerfile: services/ai-insights-service/Dockerfile
    container_name: stock-ai-insights-service
    environment:
      - SERVICE_NAME=ai-insights-service
      - SERVICE_VERSION=1.0.0
      - ENVIRONMENT=development
      - DEBUG=1
      - API_PREFIX=stock_helper
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-secret-key-change-in-production}
      - STOCK_DATA_SERVICE_URL=http://stock-data-service:8001
      - ANALYSIS_SERVICE_URL=http://analysis-service:8004
      - PREDICTION_SERVICE_URL=http://prediction-service:8002
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-gpt-4}
    ports:
      - "8005:8005"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - stock-network
    depends_on:
      redis:
        condition: service_healthy
      stock-data-service:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8005/health/live')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  chatbot-service:
    build:
      context: .
      dockerfile: services/chatbot-service/Dockerfile
    container_name: stock-chatbot-service
    environment:
      - SERVICE_NAME=chatbot-service
      - SERVICE_VERSION=1.0.0
      - ENVIRONMENT=development
      - DEBUG=1
      - API_PREFIX=stock_helper
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-secret-key-change-in-production}
      - STOCK_DATA_SERVICE_URL=http://stock-data-service:8001
      - ANALYSIS_SERVICE_URL=http://analysis-service:8004
      - PREDICTION_SERVICE_URL=http://prediction-service:8002
      - AI_INSIGHTS_SERVICE_URL=http://ai-insights-service:8005
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    ports:
      - "8006:8006"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - stock-network
    depends_on:
      redis:
        condition: service_healthy
      stock-data-service:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8006/health/live')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  stock-network:
    driver: bridge
    name: stock-network

volumes:
  rabbitmq_data:
    name: stock-rabbitmq-data
  redis_data:
    name: stock-redis-data
  prometheus_data:
    name: stock-prometheus-data
  grafana_data:
    name: stock-grafana-data
  prediction_models:
    name: stock-prediction-models
