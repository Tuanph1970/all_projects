# Stock Helper Microservices - Production Configuration
# Usage: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# IMPORTANT:
# - Port 8002 is NOT exposed to avoid conflict with existing service
# - All services are accessed through Nginx reverse proxy on port 80/443
# - React client is served as static files through Nginx

services:
  # =============================================================================
  # NGINX - Production Reverse Proxy & Static Files
  # =============================================================================
  # NOTE: Uses ports 8080/8443 to avoid conflict with system nginx on 80/443
  # Option 1: Use these ports directly
  # Option 2: Configure system nginx to proxy to these ports (see DEPLOYMENT.md)
  # =============================================================================
  nginx:
    image: nginx:1.25-alpine
    container_name: stock-nginx
    ports:
      - "8080:80"    # Changed from 80 to avoid system nginx conflict
      - "8443:443"   # Changed from 443 to avoid system nginx conflict
    volumes:
      - ./production/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./production/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./production/ssl:/etc/nginx/ssl:ro
      - ../stock_react_javascript/stock-react-app/build:/usr/share/nginx/html:ro
    networks:
      - stock-network
    depends_on:
      - traefik
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  # =============================================================================
  # OVERRIDE: Traefik - Internal only in production
  # =============================================================================
  traefik:
    ports: []  # Remove external ports, access via Nginx
    expose:
      - "8088"
      - "8080"
    environment:
      - TZ=Asia/Ho_Chi_Minh

  # =============================================================================
  # OVERRIDE: RabbitMQ - Internal only
  # =============================================================================
  rabbitmq:
    ports: []  # Remove external ports
    expose:
      - "5672"
      - "15672"

  # =============================================================================
  # OVERRIDE: Redis - Internal only
  # =============================================================================
  redis:
    expose:
      - "6379"
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD:-stockredis}

  # =============================================================================
  # OVERRIDE: Prometheus - Internal only
  # =============================================================================
  prometheus:
    ports: []
    expose:
      - "9090"

  # =============================================================================
  # OVERRIDE: Grafana - Internal only (access via Nginx)
  # =============================================================================
  grafana:
    ports: []
    expose:
      - "3000"
    environment:
      - GF_SERVER_ROOT_URL=https://${DOMAIN:-stock.example.com}/grafana
      - GF_SERVER_SERVE_FROM_SUB_PATH=true

  # =============================================================================
  # OVERRIDE: Jaeger - Internal only
  # =============================================================================
  jaeger:
    ports: []
    expose:
      - "16686"
      - "4317"
      - "4318"
      - "6831"
      - "6832"

  # =============================================================================
  # MICROSERVICES - All internal, accessed via Nginx → Traefik
  # =============================================================================
  auth-service:
    ports: []
    expose:
      - "8007"
    environment:
      - ENVIRONMENT=production
      - DEBUG=0
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  stock-data-service:
    ports: []
    expose:
      - "8001"
    environment:
      - ENVIRONMENT=production
      - DEBUG=0
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  portfolio-service:
    ports: []
    expose:
      - "8003"
    environment:
      - ENVIRONMENT=production
      - DEBUG=0
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  prediction-service:
    # IMPORTANT: No ports exposed - avoids conflict with existing port 8002 service
    expose:
      - "8002"
    environment:
      - ENVIRONMENT=production
      - DEBUG=0
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  analysis-service:
    ports: []
    expose:
      - "8004"
    environment:
      - ENVIRONMENT=production
      - DEBUG=0
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  ai-insights-service:
    ports: []
    expose:
      - "8005"
    environment:
      - ENVIRONMENT=production
      - DEBUG=0
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  chatbot-service:
    ports: []
    expose:
      - "8006"
    environment:
      - ENVIRONMENT=production
      - DEBUG=0
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

networks:
  stock-network:
    driver: bridge
    name: stock-network
