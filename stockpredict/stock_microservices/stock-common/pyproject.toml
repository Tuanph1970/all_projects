[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stock-common"
version = "0.1.0"
description = "Shared library for Stock Helper microservices"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Stock Helper Team" }
]

dependencies = [
    # Web Framework
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "httpx>=0.26.0",

    # Message Broker
    "aio-pika>=9.3.0",
    "pika>=1.3.2",

    # Database
    "asyncmy>=0.2.9",
    "sqlalchemy[asyncio]>=2.0.25",

    # Cache
    "redis>=5.0.1",

    # Authentication
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",

    # Resilience
    "circuitbreaker>=2.0.0",
    "tenacity>=8.2.3",

    # Observability
    "opentelemetry-api>=1.22.0",
    "opentelemetry-sdk>=1.22.0",
    "opentelemetry-exporter-jaeger>=1.21.0",
    "opentelemetry-instrumentation-fastapi>=0.43b0",
    "opentelemetry-instrumentation-httpx>=0.43b0",
    "opentelemetry-instrumentation-aio-pika>=0.43b0",
    "prometheus-client>=0.19.0",
    "structlog>=24.1.0",

    # Utilities
    "pydantic>=2.5.3",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.4",
    "pytest-asyncio>=0.23.3",
    "pytest-cov>=4.1.0",
    "black>=24.1.0",
    "ruff>=0.1.13",
    "mypy>=1.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["stock_common"]

[tool.black]
line-length = 100
target-version = ['py311']

# Lint config lives at ../ruff.toml — this section is intentionally minimal
# so the monorepo-wide rules apply. Override here only if stock-common needs
# stricter rules than the rest of the codebase.
[tool.ruff]
extend = "../ruff.toml"

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
