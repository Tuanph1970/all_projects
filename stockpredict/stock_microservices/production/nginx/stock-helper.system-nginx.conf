# Stock Helper - System Nginx Configuration
# =============================================================================
# This file configures the SYSTEM nginx (not Docker) to proxy to Stock Helper
#
# Installation:
#   sudo cp stock-helper.system-nginx.conf /etc/nginx/sites-available/stock-helper
#   sudo ln -s /etc/nginx/sites-available/stock-helper /etc/nginx/sites-enabled/
#   sudo nginx -t
#   sudo systemctl reload nginx
#
# This allows both projects to coexist:
#   - Existing project: http://your-server/ (default site)
#   - Stock Helper: http://your-server/stock/ or http://stock.your-domain.com
# =============================================================================

# Option 1: Path-based routing (both projects on same domain)
# Access Stock Helper at: http://your-server/stock/
# =============================================================================
# Add this to your existing server block in /etc/nginx/sites-available/default:
#
#   location /stock/ {
#       proxy_pass http://127.0.0.1:8080/;
#       proxy_http_version 1.1;
#       proxy_set_header Host $host;
#       proxy_set_header X-Real-IP $remote_addr;
#       proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#       proxy_set_header X-Forwarded-Proto $scheme;
#   }
#
#   location /stock_helper/api/ {
#       proxy_pass http://127.0.0.1:8080/stock_helper/api/;
#       proxy_http_version 1.1;
#       proxy_set_header Host $host;
#       proxy_set_header X-Real-IP $remote_addr;
#       proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#       proxy_set_header X-Forwarded-Proto $scheme;
#   }

# Option 2: Subdomain routing (separate domain for Stock Helper)
# Access Stock Helper at: http://stock.your-domain.com
# =============================================================================
server {
    listen 80;
    listen [::]:80;

    # Change this to your subdomain
    server_name stock.localhost stock.your-domain.com;

    # Proxy all requests to Stock Helper Docker nginx
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts for long-running requests
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # WebSocket support for chatbot
    location /ws/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }
}

# Option 3: Port-based access (direct access without system nginx proxy)
# =============================================================================
# Simply access Stock Helper directly at:
#   - http://your-server:8080  (HTTP)
#   - https://your-server:8443 (HTTPS)
#
# No system nginx configuration needed for this option.
