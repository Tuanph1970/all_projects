version: '3.8'

# Docker Compose for Locust load testing
# Usage:
#   docker-compose -f docker-compose.locust.yml up --scale worker=4
#   Open http://localhost:8089 for the web UI

services:
  master:
    image: locustio/locust:2.20.0
    ports:
      - "8089:8089"  # Web UI
      - "5557:5557"  # Master port
    volumes:
      - ./:/mnt/locust
    command: >
      -f /mnt/locust/locustfile.py
      --master
      --host=${TARGET_HOST:-http://host.docker.internal}
    environment:
      - LOCUST_USERS=${LOCUST_USERS:-50}
      - LOCUST_SPAWN_RATE=${LOCUST_SPAWN_RATE:-5}
      - LOCUST_RUN_TIME=${LOCUST_RUN_TIME:-5m}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - loadtest

  worker:
    image: locustio/locust:2.20.0
    volumes:
      - ./:/mnt/locust
    command: >
      -f /mnt/locust/locustfile.py
      --worker
      --master-host=master
    depends_on:
      - master
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - loadtest
    deploy:
      replicas: ${WORKER_COUNT:-4}
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # Optional: Run specific scenarios
  spike-master:
    image: locustio/locust:2.20.0
    profiles: ["spike"]
    ports:
      - "8090:8089"
    volumes:
      - ./:/mnt/locust
    command: >
      -f /mnt/locust/scenarios/spike_test.py
      --master
      --host=${TARGET_HOST:-http://host.docker.internal}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - loadtest

  stress-master:
    image: locustio/locust:2.20.0
    profiles: ["stress"]
    ports:
      - "8091:8089"
    volumes:
      - ./:/mnt/locust
    command: >
      -f /mnt/locust/scenarios/stress_test.py
      --master
      --host=${TARGET_HOST:-http://host.docker.internal}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - loadtest

  soak-master:
    image: locustio/locust:2.20.0
    profiles: ["soak"]
    ports:
      - "8092:8089"
    volumes:
      - ./:/mnt/locust
    command: >
      -f /mnt/locust/scenarios/soak_test.py
      --master
      --host=${TARGET_HOST:-http://host.docker.internal}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - loadtest

networks:
  loadtest:
    driver: bridge
