# Integration Test Environment
# Run with: docker-compose -f docker-compose.test.yml up --build

services:
  # =============================================================================
  # TEST DATABASES (In-memory for speed)
  # =============================================================================
  mysql-test:
    image: mysql:8.0
    container_name: test-mysql
    environment:
      MYSQL_ROOT_PASSWORD: testpass
      MYSQL_USER: testuser
      MYSQL_PASSWORD: testpass
    ports:
      - "3307:3306"
    volumes:
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    tmpfs:
      - /var/lib/mysql  # In-memory for speed
    networks:
      - test-network
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-ptestpass"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis-test:
    image: redis:7.2-alpine
    container_name: test-redis
    command: redis-server --save "" --appendonly no  # No persistence for speed
    ports:
      - "6380:6379"
    networks:
      - test-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  rabbitmq-test:
    image: rabbitmq:3.13-alpine
    container_name: test-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: testuser
      RABBITMQ_DEFAULT_PASS: testpass
      RABBITMQ_DEFAULT_VHOST: /test
    ports:
      - "5673:5672"
    networks:
      - test-network
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  # =============================================================================
  # MICROSERVICES (Test Configuration)
  # =============================================================================
  auth-service-test:
    build:
      context: .
      dockerfile: ./services/auth-service/Dockerfile
    container_name: test-auth-service
    environment:
      - SERVICE_NAME=auth-service
      - ENVIRONMENT=test
      - DEBUG=1
      - DATABASE_HOST=mysql-test
      - DATABASE_PORT=3306
      - DATABASE_USER=root
      - DATABASE_PASSWORD=testpass
      - DATABASE_NAME=auth_db
      - RABBITMQ_HOST=rabbitmq-test
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=testuser
      - RABBITMQ_PASSWORD=testpass
      - RABBITMQ_VHOST=/test
      - REDIS_HOST=redis-test
      - REDIS_PORT=6379
      - JWT_SECRET_KEY=test-secret-key-for-testing
      - JWT_ALGORITHM=HS256
      - JWT_ACCESS_TOKEN_EXPIRE_MINUTES=30
      - TRACING_ENABLED=false
    ports:
      - "18007:8007"
    networks:
      - test-network
    depends_on:
      mysql-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8007/health/live')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  stock-data-service-test:
    build:
      context: .
      dockerfile: ./services/stock-data-service/Dockerfile
    container_name: test-stock-data-service
    environment:
      - SERVICE_NAME=stock-data-service
      - ENVIRONMENT=test
      - DEBUG=1
      - DATABASE_HOST=mysql-test
      - DATABASE_PORT=3306
      - DATABASE_USER=root
      - DATABASE_PASSWORD=testpass
      - DATABASE_NAME=stockdata_db
      - REDIS_HOST=redis-test
      - REDIS_PORT=6379
      - VNSTOCK_DATA_SOURCE=VCI
      - TRACING_ENABLED=false
    ports:
      - "18001:8001"
    networks:
      - test-network
    depends_on:
      mysql-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8001/health/live')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  portfolio-service-test:
    build:
      context: .
      dockerfile: ./services/portfolio-service/Dockerfile
    container_name: test-portfolio-service
    environment:
      - SERVICE_NAME=portfolio-service
      - ENVIRONMENT=test
      - DEBUG=1
      - DATABASE_HOST=mysql-test
      - DATABASE_PORT=3306
      - DATABASE_USER=root
      - DATABASE_PASSWORD=testpass
      - DATABASE_NAME=portfolio_db
      - REDIS_HOST=redis-test
      - REDIS_PORT=6379
      - JWT_SECRET_KEY=test-secret-key-for-testing
      - AUTH_SERVICE_URL=http://auth-service-test:8007
      - STOCK_DATA_SERVICE_URL=http://stock-data-service-test:8001
      - TRACING_ENABLED=false
    ports:
      - "18003:8003"
    networks:
      - test-network
    depends_on:
      mysql-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
      auth-service-test:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8003/health/live')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  prediction-service-test:
    build:
      context: .
      dockerfile: ./services/prediction-service/Dockerfile
    container_name: test-prediction-service
    environment:
      - SERVICE_NAME=prediction-service
      - ENVIRONMENT=test
      - DEBUG=1
      - DATABASE_HOST=mysql-test
      - DATABASE_PORT=3306
      - DATABASE_USER=root
      - DATABASE_PASSWORD=testpass
      - DATABASE_NAME=prediction_db
      - REDIS_HOST=redis-test
      - REDIS_PORT=6379
      - JWT_SECRET_KEY=test-secret-key-for-testing
      - STOCK_DATA_SERVICE_URL=http://stock-data-service-test:8001
      - MODEL_PATH=/app/models
      - TRACING_ENABLED=false
    ports:
      - "18002:8002"
    networks:
      - test-network
    depends_on:
      mysql-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8002/health/live')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  analysis-service-test:
    build:
      context: .
      dockerfile: ./services/analysis-service/Dockerfile
    container_name: test-analysis-service
    environment:
      - SERVICE_NAME=analysis-service
      - ENVIRONMENT=test
      - DEBUG=1
      - DATABASE_HOST=mysql-test
      - DATABASE_PORT=3306
      - DATABASE_USER=root
      - DATABASE_PASSWORD=testpass
      - DATABASE_NAME=analysis_db
      - REDIS_HOST=redis-test
      - REDIS_PORT=6379
      - JWT_SECRET_KEY=test-secret-key-for-testing
      - STOCK_DATA_SERVICE_URL=http://stock-data-service-test:8001
      - TRACING_ENABLED=false
    ports:
      - "18004:8004"
    networks:
      - test-network
    depends_on:
      mysql-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8004/health/live')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # =============================================================================
  # TEST RUNNER
  # =============================================================================
  test-runner:
    build:
      context: .
      dockerfile: Dockerfile.test
    container_name: test-runner
    environment:
      - AUTH_SERVICE_URL=http://auth-service-test:8007
      - STOCK_DATA_SERVICE_URL=http://stock-data-service-test:8001
      - PORTFOLIO_SERVICE_URL=http://portfolio-service-test:8003
      - PREDICTION_SERVICE_URL=http://prediction-service-test:8002
      - ANALYSIS_SERVICE_URL=http://analysis-service-test:8004
      - DATABASE_HOST=mysql-test
      - DATABASE_PORT=3306
      - DATABASE_USER=root
      - DATABASE_PASSWORD=testpass
      - REDIS_HOST=redis-test
      - REDIS_PORT=6379
    volumes:
      - ./tests:/app/tests
      - ./reports:/app/reports
    networks:
      - test-network
    depends_on:
      auth-service-test:
        condition: service_healthy
      stock-data-service-test:
        condition: service_healthy
      portfolio-service-test:
        condition: service_healthy
      prediction-service-test:
        condition: service_healthy
      analysis-service-test:
        condition: service_healthy
    command: >
      pytest tests/integration
      --tb=short
      -v
      --html=reports/test-report.html
      --self-contained-html
      --junitxml=reports/junit.xml
      --cov=.
      --cov-report=html:reports/coverage
      --cov-report=xml:reports/coverage.xml

networks:
  test-network:
    driver: bridge
    name: test-network
