# RabbitMQ Configuration for Stock Helper Microservices

# =============================================================================
# LISTENERS
# =============================================================================
listeners.tcp.default = 5672
management.tcp.port = 15672

# =============================================================================
# MANAGEMENT
# =============================================================================
management.load_definitions = /etc/rabbitmq/definitions.json

# =============================================================================
# RESOURCE LIMITS
# =============================================================================
# Memory-based flow control (40% of available RAM)
vm_memory_high_watermark.relative = 0.4

# Disk free space limit
disk_free_limit.absolute = 1GB

# =============================================================================
# CONNECTIONS
# =============================================================================
# Maximum number of connections
# connection_max = 1000

# Heartbeat interval
heartbeat = 60

# =============================================================================
# CHANNELS
# =============================================================================
# Maximum number of channels per connection
channel_max = 128

# =============================================================================
# QUEUES
# =============================================================================
# Queue defaults
queue_master_locator = min-masters

# =============================================================================
# LOGGING
# =============================================================================
log.console = true
log.console.level = info

log.file = false

# =============================================================================
# CLUSTER
# =============================================================================
# For future clustering
cluster_formation.peer_discovery_backend = rabbit_peer_discovery_classic_config
cluster_formation.classic_config.nodes.1 = rabbit@stock-rabbitmq
