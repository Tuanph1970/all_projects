# Traefik 100% Cutover Configuration
#
# Routes 100% of traffic to microservices.
# Use this for final migration (Week 7+).
#
# Progress: Week 7 - Complete Cutover

http:
  # =============================================================================
  # ROUTERS - All traffic to microservices
  # =============================================================================
  routers:
    # Auth
    auth-final:
      rule: "PathPrefix(`/api/v2/auth`)"
      service: auth-microservice
      middlewares:
        - rate-limit
        - retry
      priority: 110
      entryPoints:
        - web
        - websecure

    # Stock data
    stocks-final:
      rule: "PathPrefix(`/api/v2/stocks`) || PathPrefix(`/api/v2/companies`) || PathPrefix(`/api/v2/industries`) || PathPrefix(`/api/v2/market`)"
      service: stock-data-microservice
      middlewares:
        - rate-limit
        - retry
        - cache-stock-data
      priority: 110
      entryPoints:
        - web
        - websecure

    # Portfolio
    portfolio-final:
      rule: "PathPrefix(`/api/v2/portfolio`) || PathPrefix(`/api/v2/alerts`)"
      service: portfolio-microservice
      middlewares:
        - rate-limit
        - retry
      priority: 110
      entryPoints:
        - web
        - websecure

    # Analysis
    analysis-final:
      rule: "PathPrefix(`/api/v2/analysis`) || PathPrefix(`/api/v2/screener`)"
      service: analysis-microservice
      middlewares:
        - rate-limit
        - retry
      priority: 110
      entryPoints:
        - web
        - websecure

    # Prediction
    prediction-final:
      rule: "PathPrefix(`/api/v2/models`) || PathPrefix(`/api/v2/predict`) || PathPrefix(`/api/v2/backtest`)"
      service: prediction-microservice
      middlewares:
        - rate-limit
        - retry
      priority: 110
      entryPoints:
        - web
        - websecure

    # AI Insights
    ai-final:
      rule: "PathPrefix(`/api/v2/ai`)"
      service: ai-insights-microservice
      middlewares:
        - rate-limit
        - retry
      priority: 110
      entryPoints:
        - web
        - websecure

    # Chatbot
    chat-final:
      rule: "PathPrefix(`/api/v2/chat`)"
      service: chatbot-microservice
      middlewares:
        - rate-limit
        - retry
      priority: 110
      entryPoints:
        - web
        - websecure

  # =============================================================================
  # MIDDLEWARES
  # =============================================================================
  middlewares:
    rate-limit:
      rateLimit:
        average: 100
        burst: 200
        period: 1s

    retry:
      retry:
        attempts: 3
        initialInterval: 100ms

    cache-stock-data:
      headers:
        customResponseHeaders:
          Cache-Control: "public, max-age=60"

  # =============================================================================
  # SERVICES - Microservices only
  # =============================================================================
  services:
    auth-microservice:
      loadBalancer:
        servers:
          - url: "http://auth-service:8007"
        healthCheck:
          path: /health/live
          interval: 5s
          timeout: 3s

    stock-data-microservice:
      loadBalancer:
        servers:
          - url: "http://stock-data-service:8001"
        healthCheck:
          path: /health/live
          interval: 5s
          timeout: 3s

    portfolio-microservice:
      loadBalancer:
        servers:
          - url: "http://portfolio-service:8003"
        healthCheck:
          path: /health/live
          interval: 5s
          timeout: 3s

    analysis-microservice:
      loadBalancer:
        servers:
          - url: "http://analysis-service:8004"
        healthCheck:
          path: /health/live
          interval: 5s
          timeout: 3s

    prediction-microservice:
      loadBalancer:
        servers:
          - url: "http://prediction-service:8002"
        healthCheck:
          path: /health/live
          interval: 5s
          timeout: 3s

    ai-insights-microservice:
      loadBalancer:
        servers:
          - url: "http://ai-insights-service:8005"
        healthCheck:
          path: /health/live
          interval: 5s
          timeout: 3s

    chatbot-microservice:
      loadBalancer:
        servers:
          - url: "http://chatbot-service:8006"
        healthCheck:
          path: /health/live
          interval: 5s
          timeout: 3s
