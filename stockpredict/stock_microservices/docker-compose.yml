# Stock Helper Microservices Infrastructure
# Docker Compose configuration for development and production

services:
  # =============================================================================
  # API GATEWAY - Traefik
  # =============================================================================
  traefik:
    image: traefik:v3.2
    container_name: stock-traefik
    command:
      - "--api.insecure=true"
      - "--api.dashboard=true"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:8088"
      - "--entrypoints.websecure.address=:443"
      - "--accesslog=true"
      - "--accesslog.format=json"
      - "--log.level=INFO"
      - "--metrics.prometheus=true"
      - "--metrics.prometheus.buckets=0.1,0.3,1.2,5.0"
    ports:
      - "8088:8088"  # API Gateway
      - "8443:443"   # HTTPS (mapped to 8443 to avoid conflicts)
      - "8089:8080"  # Traefik dashboard
    volumes:
      - ./traefik:/etc/traefik/dynamic:ro
    networks:
      - stock-network
    restart: unless-stopped

  # =============================================================================
  # MESSAGE BROKER - RabbitMQ
  # =============================================================================
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: stock-rabbitmq
    hostname: stock-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-stockuser}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-stockpass}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/stock}
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    networks:
      - stock-network
    restart: unless-stopped
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.stock-rabbitmq.rule=Host(`rabbitmq.localhost`)"
      - "traefik.http.services.rabbitmq.loadbalancer.server.port=15672"

  # =============================================================================
  # CACHE - Redis
  # =============================================================================
  redis:
    image: redis:7.2-alpine
    container_name: stock-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    networks:
      - stock-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =============================================================================
  # SSH TUNNEL - For Remote MySQL Access
  # =============================================================================
  ssh-tunnel:
    image: alpine:3.19
    container_name: stock-ssh-tunnel
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        apk add --no-cache openssh-client sshpass netcat-openbsd
        mkdir -p ~/.ssh
        echo "StrictHostKeyChecking no" > ~/.ssh/config
        echo "UserKnownHostsFile /dev/null" >> ~/.ssh/config
        chmod 600 ~/.ssh/config
        echo "Starting SSH tunnel to ${SSH_HOST:-112.213.91.103}..."
        sshpass -p "${SSH_PASSWORD:-VietnamPA_2025}" ssh -v -N -L 0.0.0.0:3306:127.0.0.1:3306 ${SSH_USER:-root}@${SSH_HOST:-112.213.91.103}
    environment:
      - SSH_HOST=${SSH_HOST:-112.213.91.103}
      - SSH_USER=${SSH_USER:-root}
      - SSH_PASSWORD=${SSH_PASSWORD:-VietnamPA_2025}
    expose:
      - "3306"
    networks:
      - stock-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 3306 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  # =============================================================================
  # DATABASE - MySQL (Local - for testing/fallback)
  # =============================================================================
  mysql:
    image: mysql:8.0
    container_name: stock-mysql
    profiles:
      - local-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_USER: ${MYSQL_USER:-stockuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-stockpass}
    # No external port - use internal Docker networking only
    expose:
      - "3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    networks:
      - stock-network
    restart: unless-stopped
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpass}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # =============================================================================
  # OBSERVABILITY - Prometheus
  # =============================================================================
  prometheus:
    image: prom/prometheus:v2.50.0
    container_name: stock-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    networks:
      - stock-network
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.stock-prometheus.rule=Host(`prometheus.localhost`)"
      - "traefik.http.services.prometheus.loadbalancer.server.port=9090"

  # =============================================================================
  # OBSERVABILITY - Grafana
  # =============================================================================
  grafana:
    image: grafana/grafana:10.3.1
    container_name: stock-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: "http://grafana.localhost"
    ports:
      - "${GRAFANA_PORT:-3100}:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    networks:
      - stock-network
    restart: unless-stopped
    depends_on:
      - prometheus
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.stock-grafana.rule=Host(`grafana.localhost`)"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"

  # =============================================================================
  # OBSERVABILITY - Jaeger (Distributed Tracing)
  # =============================================================================
  jaeger:
    image: jaegertracing/all-in-one:1.54
    container_name: stock-jaeger
    environment:
      COLLECTOR_ZIPKIN_HOST_PORT: ":9411"
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "6831:6831/udp"  # Jaeger thrift compact
      - "6832:6832/udp"  # Jaeger thrift binary
      - "5778:5778"      # Serve configs
      - "16686:16686"    # Jaeger UI
      - "4317:4317"      # OTLP gRPC
      - "4318:4318"      # OTLP HTTP
      - "14250:14250"    # gRPC
      - "14268:14268"    # Accept spans
      - "9411:9411"      # Zipkin compatible
    networks:
      - stock-network
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.stock-jaeger.rule=Host(`jaeger.localhost`)"
      - "traefik.http.services.jaeger.loadbalancer.server.port=16686"

  # =============================================================================
  # MICROSERVICES
  # =============================================================================

  # Auth Service - User authentication and authorization
  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    container_name: stock-auth-service
    environment:
      - SERVICE_NAME=auth-service
      - SERVICE_VERSION=1.0.0
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DEBUG=${DEBUG:-0}
      - API_PREFIX=stock_helper
      - DATABASE_HOST=ssh-tunnel
      - DATABASE_PORT=3306
      - DATABASE_USER=${MYSQL_USER:-root}
      - DATABASE_PASSWORD=${MYSQL_PASSWORD:-Mysql_2025}
      - DATABASE_NAME=defaultdb
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=${RABBITMQ_USER:-stockuser}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-stockpass}
      - RABBITMQ_VHOST=${RABBITMQ_VHOST:-/stock}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-secret-key-change-in-production}
      - JWT_ALGORITHM=HS256
      - JWT_ACCESS_TOKEN_EXPIRE_MINUTES=30
      - JWT_REFRESH_TOKEN_EXPIRE_DAYS=7
      - TRACING_ENABLED=true
      - TRACING_JAEGER_HOST=jaeger
      - TRACING_JAEGER_PORT=6831
    ports:
      - "8007:8007"
    networks:
      - stock-network
    depends_on:
      ssh-tunnel:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8007/health/live')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.stock-auth.rule=PathPrefix(`/stock_helper/api/v2/auth`)"
      - "traefik.http.routers.stock-auth.priority=10"
      - "traefik.http.services.auth.loadbalancer.server.port=8007"

  # Stock Data Service - Stock data, companies, market info
  stock-data-service:
    build:
      context: .
      dockerfile: services/stock-data-service/Dockerfile
    container_name: stock-data-service
    environment:
      - SERVICE_NAME=stock-data-service
      - SERVICE_VERSION=1.0.0
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DEBUG=${DEBUG:-0}
      - API_PREFIX=stock_helper
      - DATABASE_HOST=ssh-tunnel
      - DATABASE_PORT=3306
      - DATABASE_USER=${MYSQL_USER:-root}
      - DATABASE_PASSWORD=${MYSQL_PASSWORD:-Mysql_2025}
      - DATABASE_NAME=defaultdb
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=${RABBITMQ_USER:-stockuser}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-stockpass}
      - RABBITMQ_VHOST=${RABBITMQ_VHOST:-/stock}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - VNSTOCK_DATA_SOURCE=${VNSTOCK_DATA_SOURCE:-VCI}
      - TRACING_ENABLED=true
      - TRACING_JAEGER_HOST=jaeger
      - TRACING_JAEGER_PORT=6831
    ports:
      - "8001:8001"
    networks:
      - stock-network
    depends_on:
      ssh-tunnel:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8001/health/live')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.stock-stocks.rule=PathPrefix(`/stock_helper/api/v2/companies`) || PathPrefix(`/stock_helper/api/v2/stocks`) || PathPrefix(`/stock_helper/api/v2/market`) || PathPrefix(`/stock_helper/api/v2/industries`)"
      - "traefik.http.routers.stock-stocks.priority=10"
      - "traefik.http.services.stocks.loadbalancer.server.port=8001"

  # Portfolio Service - Portfolio management, holdings, transactions
  portfolio-service:
    build:
      context: .
      dockerfile: services/portfolio-service/Dockerfile
    container_name: stock-portfolio-service
    environment:
      - SERVICE_NAME=portfolio-service
      - SERVICE_VERSION=1.0.0
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DEBUG=${DEBUG:-0}
      - API_PREFIX=stock_helper
      - DATABASE_HOST=ssh-tunnel
      - DATABASE_PORT=3306
      - DATABASE_USER=${MYSQL_USER:-root}
      - DATABASE_PASSWORD=${MYSQL_PASSWORD:-Mysql_2025}
      - DATABASE_NAME=defaultdb
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=${RABBITMQ_USER:-stockuser}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-stockpass}
      - RABBITMQ_VHOST=${RABBITMQ_VHOST:-/stock}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-secret-key-change-in-production}
      - JWT_ALGORITHM=HS256
      - AUTH_SERVICE_URL=http://auth-service:8007
      - STOCK_DATA_SERVICE_URL=http://stock-data-service:8001
      - TRACING_ENABLED=true
      - TRACING_JAEGER_HOST=jaeger
      - TRACING_JAEGER_PORT=6831
    ports:
      - "8013:8003"  # Mapped to 8013 to avoid conflict with Math API
    networks:
      - stock-network
    depends_on:
      ssh-tunnel:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8003/health/live')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.stock-portfolio.rule=PathPrefix(`/stock_helper/api/v2/portfolio`)"
      - "traefik.http.routers.stock-portfolio.priority=10"
      - "traefik.http.services.portfolio.loadbalancer.server.port=8003"

  # Prediction Service - ML-based stock price predictions
  prediction-service:
    build:
      context: .
      dockerfile: services/prediction-service/Dockerfile
    container_name: stock-prediction-service
    environment:
      - SERVICE_NAME=prediction-service
      - SERVICE_VERSION=1.0.0
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DEBUG=${DEBUG:-0}
      - API_PREFIX=stock_helper
      - DATABASE_HOST=ssh-tunnel
      - DATABASE_PORT=3306
      - DATABASE_USER=${MYSQL_USER:-root}
      - DATABASE_PASSWORD=${MYSQL_PASSWORD:-Mysql_2025}
      - DATABASE_NAME=defaultdb
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=${RABBITMQ_USER:-stockuser}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-stockpass}
      - RABBITMQ_VHOST=${RABBITMQ_VHOST:-/stock}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-secret-key-change-in-production}
      - JWT_ALGORITHM=HS256
      - STOCK_DATA_SERVICE_URL=http://stock-data-service:8001
      - MODEL_PATH=/app/models
      - TRACING_ENABLED=true
      - TRACING_JAEGER_HOST=jaeger
      - TRACING_JAEGER_PORT=6831
    expose:
      - "8002"
    volumes:
      - prediction_models:/app/models
    networks:
      - stock-network
    depends_on:
      ssh-tunnel:
        condition: service_healthy
      redis:
        condition: service_healthy
      stock-data-service:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8002/health/live')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.stock-predictions.rule=PathPrefix(`/stock_helper/api/v2/predictions`)"
      - "traefik.http.routers.stock-predictions.priority=10"
      - "traefik.http.services.predictions.loadbalancer.server.port=8002"

  # Analysis Service - Technical and Fundamental Analysis
  analysis-service:
    build:
      context: .
      dockerfile: services/analysis-service/Dockerfile
    container_name: stock-analysis-service
    environment:
      - SERVICE_NAME=analysis-service
      - SERVICE_VERSION=1.0.0
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DEBUG=${DEBUG:-0}
      - API_PREFIX=stock_helper
      - DATABASE_HOST=ssh-tunnel
      - DATABASE_PORT=3306
      - DATABASE_USER=${MYSQL_USER:-root}
      - DATABASE_PASSWORD=${MYSQL_PASSWORD:-Mysql_2025}
      - DATABASE_NAME=defaultdb
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-secret-key-change-in-production}
      - STOCK_DATA_SERVICE_URL=http://stock-data-service:8001
      - TRACING_ENABLED=true
      - TRACING_JAEGER_HOST=jaeger
      - TRACING_JAEGER_PORT=6831
    ports:
      - "8004:8004"
    networks:
      - stock-network
    depends_on:
      ssh-tunnel:
        condition: service_healthy
      redis:
        condition: service_healthy
      stock-data-service:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8004/health/live')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.stock-analysis.rule=PathPrefix(`/stock_helper/api/v2/analysis`)"
      - "traefik.http.routers.stock-analysis.priority=10"
      - "traefik.http.services.analysis.loadbalancer.server.port=8004"

  # AI Insights Service - LLM-powered insights
  ai-insights-service:
    build:
      context: .
      dockerfile: services/ai-insights-service/Dockerfile
    container_name: stock-ai-insights-service
    environment:
      - SERVICE_NAME=ai-insights-service
      - SERVICE_VERSION=1.0.0
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DEBUG=${DEBUG:-0}
      - API_PREFIX=stock_helper
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-secret-key-change-in-production}
      - STOCK_DATA_SERVICE_URL=http://stock-data-service:8001
      - ANALYSIS_SERVICE_URL=http://analysis-service:8004
      - PREDICTION_SERVICE_URL=http://prediction-service:8002
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-gpt-4}
    ports:
      - "8005:8005"
    networks:
      - stock-network
    depends_on:
      redis:
        condition: service_healthy
      stock-data-service:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8005/health/live')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.stock-ai.rule=PathPrefix(`/stock_helper/api/v2/ai`)"
      - "traefik.http.routers.stock-ai.priority=10"
      - "traefik.http.services.ai.loadbalancer.server.port=8005"

  # Chatbot Service - Conversational AI
  chatbot-service:
    build:
      context: .
      dockerfile: services/chatbot-service/Dockerfile
    container_name: stock-chatbot-service
    environment:
      - SERVICE_NAME=chatbot-service
      - SERVICE_VERSION=1.0.0
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DEBUG=${DEBUG:-0}
      - API_PREFIX=stock_helper
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-secret-key-change-in-production}
      - STOCK_DATA_SERVICE_URL=http://stock-data-service:8001
      - ANALYSIS_SERVICE_URL=http://analysis-service:8004
      - PREDICTION_SERVICE_URL=http://prediction-service:8002
      - AI_INSIGHTS_SERVICE_URL=http://ai-insights-service:8005
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    ports:
      - "8006:8006"
    networks:
      - stock-network
    depends_on:
      redis:
        condition: service_healthy
      stock-data-service:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8006/health/live')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.stock-chatbot.rule=PathPrefix(`/stock_helper/api/v2/chat`)"
      - "traefik.http.routers.stock-chatbot.priority=10"
      - "traefik.http.services.chatbot.loadbalancer.server.port=8006"

networks:
  stock-network:
    driver: bridge
    name: stock-network

volumes:
  rabbitmq_data:
    name: stock-rabbitmq-data
  redis_data:
    name: stock-redis-data
  mysql_data:
    name: stock-mysql-data
  prometheus_data:
    name: stock-prometheus-data
  grafana_data:
    name: stock-grafana-data
  model_data:
    name: stock-model-data
  prediction_models:
    name: stock-prediction-models
