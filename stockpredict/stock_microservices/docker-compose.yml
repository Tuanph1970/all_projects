      - API_PREFIX=stock_helper
      - DATABASE_HOST=host.docker.internal
      - DATABASE_PORT=${DATABASE_PORT:-3306}
      - DATABASE_USER=${DATABASE_USER:-root}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:-Mysql_2025}
      - DATABASE_NAME=stockpredict
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=stockuser
      - RABBITMQ_PASSWORD=stockpass
      - RABBITMQ_VHOST=/stock
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your-secret-key-change-in-production}
      - JWT_ALGORITHM=HS256
      - STOCK_DATA_SERVICE_URL=http://stock-data-service:8001
      - ANALYSIS_SERVICE_URL=http://analysis-service:8004
      - AI_INSIGHTS_SERVICE_URL=http://ai-insights-service:8005
      - TRACING_ENABLED=true
      - TRACING_JAEGER_HOST=jaeger
      - TRACING_JAEGER_PORT=6831
    expose:
      - "8010"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - stock-network
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8010/health/live')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    labels:
      - "traefik.enable=true"
      - "traefik.project=stock"
      - "traefik.http.routers.stock-decision-helper.rule=PathPrefix(`/stock_helper/api/v2/helper`)"
      - "traefik.http.routers.stock-decision-helper.entrypoints=web"
      - "traefik.http.routers.stock-decision-helper.priority=10"
      - "traefik.http.services.stock-decision-helper.loadbalancer.server.port=8010"

  chart-decomp-service:
    build:
      context: .
      dockerfile: services/chart-decomp-service/Dockerfile
    container_name: stock_chart_decomp_service
    environment:
      - SERVICE_NAME=chart-decomp-service
      - SERVICE_VERSION=0.1.0
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DEBUG=${DEBUG:-0}
      - API_PREFIX=stock_helper
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your-secret-key-change-in-production}
      - JWT_ALGORITHM=HS256
      - TRACING_ENABLED=true
      - TRACING_JAEGER_HOST=jaeger
      - TRACING_JAEGER_PORT=6831
    expose:
      - "8011"
    networks:
      - stock-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8011/health/live')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    labels:
      - "traefik.enable=true"
      - "traefik.project=stock"
      - "traefik.http.routers.stock-chart-decomp.rule=PathPrefix(`/stock_helper/api/v2/chart-decomp`)"
      - "traefik.http.routers.stock-chart-decomp.entrypoints=web"
      - "traefik.http.routers.stock-chart-decomp.priority=10"
      - "traefik.http.services.stock-chart-decomp.loadbalancer.server.port=8011"

  # Event-Reaction Service - price reaction to the surprise of discrete events
  event-reaction-service:
    build:
      context: .
      dockerfile: services/event-reaction-service/Dockerfile
    container_name: stock_event_reaction_service
    environment:
      - SERVICE_NAME=event-reaction-service
      - SERVICE_VERSION=0.1.0
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DEBUG=${DEBUG:-0}
      - API_PREFIX=stock_helper
      - STOCK_DATA_SERVICE_URL=http://stock-data-service:8001
      - DATABASE_URL=mysql+pymysql://${MYSQL_USER:-root}:${MYSQL_PASSWORD:-Mysql_2025}@${DATABASE_HOST:-host.docker.internal}:${DATABASE_PORT:-3306}/${EVENT_REACTION_DB:-stock_event_reaction}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your-secret-key-change-in-production}
      - JWT_ALGORITHM=HS256
      - TRACING_ENABLED=true
      - TRACING_JAEGER_HOST=jaeger
      - TRACING_JAEGER_PORT=6831
    expose:
      - "8012"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - stock-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8012/health/live')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    labels:
      - "traefik.enable=true"
      - "traefik.project=stock"
      - "traefik.http.routers.stock-event-reaction.rule=PathPrefix(`/stock_helper/api/v2/event-reaction`)"
      - "traefik.http.routers.stock-event-reaction.entrypoints=web"
      - "traefik.http.routers.stock-event-reaction.priority=10"
      - "traefik.http.services.stock-event-reaction.loadbalancer.server.port=8012"

  # News Service - company & macro news ingestion + good/bad company-news notifications
  news-service:
    build:
      context: .
      dockerfile: services/news-service/Dockerfile
    container_name: stock_news_service
    environment:
      - SERVICE_NAME=news-service
      - SERVICE_VERSION=0.1.0
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DEBUG=${DEBUG:-0}
      - API_PREFIX=stock_helper
      - STOCK_DATA_SERVICE_URL=http://stock-data-service:8001
      - AI_INSIGHTS_SERVICE_URL=http://ai-insights-service:8005
      - PORTFOLIO_SERVICE_URL=http://portfolio-service:8003
      - DECISION_HELPER_SERVICE_URL=http://decision-helper-service:8010
      - EVENT_REACTION_SERVICE_URL=http://event-reaction-service:8012
      - DATABASE_URL=mysql+pymysql://${MYSQL_USER:-root}:${MYSQL_PASSWORD:-Mysql_2025}@${DATABASE_HOST:-host.docker.internal}:${DATABASE_PORT:-3306}/${NEWS_DB:-stock_news}
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=${RABBITMQ_USER:-stockuser}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-stockpass}
      - RABBITMQ_VHOST=${RABBITMQ_VHOST:-/stock}
      - ENABLE_COMPANY=${NEWS_ENABLE_COMPANY:-1}
      - ENABLE_MACRO=${NEWS_ENABLE_MACRO:-0}
      - ENABLE_BRIDGE=${NEWS_ENABLE_BRIDGE:-0}
      - ENABLE_EMAIL=${NEWS_ENABLE_EMAIL:-0}
      - COMPANY_POLL_INTERVAL_SECONDS=${NEWS_COMPANY_POLL_INTERVAL:-900}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your-secret-key-change-in-production}
      - JWT_ALGORITHM=HS256
      - TRACING_ENABLED=true
      - TRACING_JAEGER_HOST=jaeger
      - TRACING_JAEGER_PORT=6831
    expose:
      - "8013"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - stock-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8013/health/live')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    labels:
      - "traefik.enable=true"
      - "traefik.project=stock"
      - "traefik.http.routers.stock-news.rule=PathPrefix(`/stock_helper/api/v2/news`)"
      - "traefik.http.routers.stock-news.entrypoints=web"
      - "traefik.http.routers.stock-news.priority=10"
      - "traefik.http.services.stock-news.loadbalancer.server.port=8013"

  # Ollama - Local LLM inference server (CPU mode, works everywhere)
  # To use GPU: docker compose --profile gpu up (instead of default ollama)
  ollama:
    image: ollama/ollama
    container_name: stock_ollama
    profiles:
      - cpu
    expose:
      - "11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - stock-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:11434/api/tags || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Ollama with NVIDIA GPU acceleration (default)
  # Requires: nvidia-container-toolkit installed + sudo systemctl restart docker
  # On non-GPU machines: docker compose --profile cpu up -d (uses ollama service above)
  ollama-gpu:
    image: ollama/ollama
    container_name: stock_ollama
    profiles:
      - gpu
    expose:
      - "11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - stock-network
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:11434/api/tags || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

networks:
  stock-network:
    driver: bridge
    name: stock-network

volumes:
  rabbitmq_data:
    name: stock-rabbitmq-data
  redis_data:
    name: stock-redis-data
  mysql_data:
    name: stock-mysql-data
  prometheus_data:
    name: stock-prometheus-data
  grafana_data:
    name: stock-grafana-data
  model_data:
    name: stock-model-data
  prediction_models:
    name: stock-prediction-models
  journal_uploads:
    name: stock-journal-uploads
  ollama_data:
    name: stock-ollama-data
