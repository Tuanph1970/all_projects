# Traefik Dynamic Configuration
# API Gateway routing rules and middleware

http:
  # =============================================================================
  # ROUTERS - Route requests to services
  # =============================================================================
  routers:
    # API v2 routes (new microservices)
    auth-service:
      rule: "PathPrefix(`/api/v2/auth`)"
      service: auth-service
      priority: 10
      middlewares:
        - rate-limit
        - cors

    stock-data-service:
      rule: "PathPrefix(`/api/v2/stocks`) || PathPrefix(`/api/v2/companies`) || PathPrefix(`/api/v2/market`)"
      service: stock-data-service
      priority: 10
      middlewares:
        - rate-limit
        - cors
        - circuit-breaker

    portfolio-service:
      rule: "PathPrefix(`/api/v2/portfolio`) || PathPrefix(`/api/v2/alerts`)"
      service: portfolio-service
      priority: 10
      middlewares:
        - rate-limit
        - cors
        - jwt-auth

    analysis-service:
      rule: "PathPrefix(`/api/v2/analysis`) || PathPrefix(`/api/v2/industries`)"
      service: analysis-service
      priority: 10
      middlewares:
        - rate-limit
        - cors

    prediction-service:
      rule: "PathPrefix(`/api/v2/predict`) || PathPrefix(`/api/v2/models`) || PathPrefix(`/api/v2/solutions`)"
      service: prediction-service
      priority: 10
      middlewares:
        - rate-limit-low
        - cors
        - jwt-auth

    ai-insights-service:
      rule: "PathPrefix(`/api/v2/ai`)"
      service: ai-insights-service
      priority: 10
      middlewares:
        - rate-limit-low
        - cors
        - jwt-auth

    chatbot-service:
      rule: "PathPrefix(`/api/v2/chatbot`)"
      service: chatbot-service
      priority: 10
      middlewares:
        - rate-limit-low
        - cors
        - jwt-auth

  # =============================================================================
  # SERVICES - Backend service definitions
  # =============================================================================
  services:
    auth-service:
      loadBalancer:
        servers:
          - url: "http://auth-service:8007"
        healthCheck:
          path: /health/live
          interval: 10s
          timeout: 3s

    stock-data-service:
      loadBalancer:
        servers:
          - url: "http://stock-data-service:8001"
        healthCheck:
          path: /health/live
          interval: 10s
          timeout: 3s

    portfolio-service:
      loadBalancer:
        servers:
          - url: "http://portfolio-service:8003"
        healthCheck:
          path: /health/live
          interval: 10s
          timeout: 3s

    analysis-service:
      loadBalancer:
        servers:
          - url: "http://analysis-service:8004"
        healthCheck:
          path: /health/live
          interval: 10s
          timeout: 3s

    prediction-service:
      loadBalancer:
        servers:
          - url: "http://prediction-service:8002"
        healthCheck:
          path: /health/live
          interval: 10s
          timeout: 3s

    ai-insights-service:
      loadBalancer:
        servers:
          - url: "http://ai-insights-service:8005"
        healthCheck:
          path: /health/live
          interval: 10s
          timeout: 3s

    chatbot-service:
      loadBalancer:
        servers:
          - url: "http://chatbot-service:8006"
        healthCheck:
          path: /health/live
          interval: 10s
          timeout: 3s

  # =============================================================================
  # MIDDLEWARES - Request processing
  # =============================================================================
  middlewares:
    # Rate limiting - standard (100 req/min)
    rate-limit:
      rateLimit:
        average: 100
        burst: 50
        period: 1m

    # Rate limiting - low (30 req/min for compute-intensive endpoints)
    rate-limit-low:
      rateLimit:
        average: 30
        burst: 10
        period: 1m

    # CORS headers
    cors:
      headers:
        accessControlAllowMethods:
          - "GET"
          - "POST"
          - "PUT"
          - "PATCH"
          - "DELETE"
          - "OPTIONS"
        accessControlAllowHeaders:
          - "Content-Type"
          - "Authorization"
          - "X-Request-ID"
          - "X-Correlation-ID"
        accessControlAllowOriginList:
          - "http://localhost:3000"
          - "http://localhost:8080"
          - "https://*.stock-helper.com"
        accessControlMaxAge: 86400
        addVaryHeader: true

    # Circuit breaker
    circuit-breaker:
      circuitBreaker:
        expression: "ResponseCodeRatio(500, 600, 0, 600) > 0.30"

    # JWT authentication (placeholder - actual validation in services)
    jwt-auth:
      headers:
        customRequestHeaders:
          X-Auth-Required: "true"

    # Request retry
    retry:
      retry:
        attempts: 3
        initialInterval: 100ms

    # Compression
    compress:
      compress:
        excludedContentTypes:
          - "text/event-stream"
