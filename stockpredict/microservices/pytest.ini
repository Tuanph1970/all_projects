[pytest]
# Pytest configuration for Stock Helper microservices

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Async mode
asyncio_mode = auto

# Markers
markers =
    integration: Integration tests requiring running services
    e2e: End-to-end tests covering full user journeys
    performance: Performance and load tests
    security: Security vulnerability tests
    slow: Slow running tests (skipped by default in quick mode)
    auth: Tests requiring authentication
    database: Tests requiring database access

# Output
addopts =
    -v
    --tb=short
    --strict-markers
    -ra

# Timeout (30 seconds default per test)
timeout = 30

# Coverage
# Run with: pytest --cov --cov-report=html

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Minimum version
minversion = 8.0
