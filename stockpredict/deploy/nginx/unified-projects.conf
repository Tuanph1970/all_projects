# Unified Nginx Configuration for Multiple Projects
# =============================================================================
# This configuration routes requests to both Ceramic and Stock Helper projects
#
# Installation:
#   sudo cp unified-projects.conf /etc/nginx/sites-available/
#   sudo ln -sf /etc/nginx/sites-available/unified-projects.conf /etc/nginx/sites-enabled/
#   sudo rm /etc/nginx/sites-enabled/default  # Remove default if exists
#   sudo nginx -t && sudo systemctl reload nginx
#
# Projects:
#   - Ceramic API: Port 8002 → /api/ceramic/
#   - Stock Helper: Port 8080 → /stock/, /stock_helper/
#   - React Apps: Served as static files or proxied
# =============================================================================

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=30r/s;

# Upstream definitions
upstream ceramic_api {
    server 127.0.0.1:8002;
    keepalive 32;
}

upstream stock_helper_gateway {
    server 127.0.0.1:8080;
    keepalive 32;
}

upstream stock_helper_traefik {
    server 127.0.0.1:8088;
    keepalive 32;
}

# Main server block
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/rss+xml application/atom+xml image/svg+xml;

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # =========================================================================
    # CERAMIC API ROUTES
    # =========================================================================

    # Ceramic API - Direct access
    location /api/ceramic/ {
        limit_req zone=api_limit burst=20 nodelay;

        rewrite ^/api/ceramic/(.*) /$1 break;
        proxy_pass http://ceramic_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Ceramic API - Legacy/direct path (for mobile app compatibility)
    location ~ ^/(api|health|docs|redoc|openapi.json) {
        # Check if request is for Ceramic (port 8002 paths)
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://ceramic_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # =========================================================================
    # STOCK HELPER API ROUTES
    # =========================================================================

    # Stock Helper API v2 - via Traefik gateway
    location /stock_helper/api/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://stock_helper_traefik;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # CORS headers
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;

        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }
    }

    # Stock Helper - Static React App (if served via Docker nginx)
    location /stock/ {
        proxy_pass http://stock_helper_gateway/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # =========================================================================
    # WEBSOCKET SUPPORT
    # =========================================================================

    location /ws/ {
        proxy_pass http://stock_helper_traefik;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
    }

    # =========================================================================
    # MONITORING ROUTES (Protected - consider IP restriction)
    # =========================================================================

    location /grafana/ {
        # Uncomment to restrict to internal IPs:
        # allow 10.0.0.0/8;
        # allow 172.16.0.0/12;
        # allow 192.168.0.0/16;
        # allow 127.0.0.1;
        # deny all;

        proxy_pass http://127.0.0.1:3100/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /rabbitmq/ {
        proxy_pass http://127.0.0.1:15672/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /jaeger/ {
        proxy_pass http://127.0.0.1:16686/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # =========================================================================
    # STATIC FILES - React Apps
    # =========================================================================

    # Stock Helper React App (production build)
    root /home/tuanph/TuanPH/stockpredict/stock_react_javascript/stock-react-app/build;
    index index.html;

    # Static assets with caching
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # React Router - SPA fallback (Stock Helper as default)
    location / {
        limit_req zone=general_limit burst=50 nodelay;
        try_files $uri $uri/ /index.html;

        location ~* \.html$ {
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }
    }

    # Error pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}

