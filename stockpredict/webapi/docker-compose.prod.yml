# =============================================================================
# Stock Predict WebAPI - Production Configuration (Remote Server)
# =============================================================================
# Usage: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# This configuration is for deploying on a remote server where:
# - MySQL is installed on the same server (host machine)
# - The server has a static IP address
# - Production security settings are enabled

services:
  stockapi:
    image: stockpredict-webapi:latest
    container_name: stockpredict-api
    restart: always

    # Connect to host network to access MySQL on localhost
    # Option 1: Use extra_hosts (recommended)
    extra_hosts:
      - "host.docker.internal:host-gateway"

    # Environment overrides for production
    environment:
      - DJANGO_DEBUG=False
      - DB_HOST=host.docker.internal
      - DB_SSL=false

    # Production port mapping
    # Change the first number to your desired port (e.g., 8080:8000, 9000:8000)
    # Format: HOST_PORT:CONTAINER_PORT
    ports:
      - "${API_PORT:-8000}:8000"

    # Production resource limits
    deploy:
      resources:
        limits:
          memory: 8G
          cpus: '4'
        reservations:
          memory: 2G
          cpus: '1'

    # Production logging
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

    # Production health check (more frequent)
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/stock/api/"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 120s
