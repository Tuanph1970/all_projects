name: backend-ci

on:
  push:
    branches: [main]
    paths:
      - 'stock_microservices/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'stock_microservices/**'
      - '.github/workflows/backend-ci.yml'

defaults:
  run:
    working-directory: stock_microservices

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install ruff
        run: pip install 'ruff>=0.5.0'
      - name: Ruff check
        run: ruff check services stock-common tests

  unit-tests:
    name: Unit tests · ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # cov_min is a "ratchet" floor: ~5pp below current measured
        # coverage (unit tests only — integration/e2e tests are skipped
        # below). CI fails if coverage drops below the floor. Bumping
        # the floor upward when coverage rises is intentional — it
        # locks in gains and prevents quiet regression. Never lower
        # these. Last measured 2026-05-20 (after #74 orchestrator climb):
        #   auth=87.0%  stock-data=83.5%  portfolio=83.6%
        #   prediction=89.0%  analysis=91.1%  ai-insights=91.9%
        #   chatbot=96.3%  journal=80.1%   knowledge-qa=91.1%
        #   decision-helper=91.0% (unit-only)
        # 10 of 10 past 80% — decision-helper joined the sweep in #73
        # and its orchestrator core climbed 44%->96% in #74.
        include:
          - service: auth-service
            cov_min: 83
          - service: stock-data-service
            cov_min: 80
          - service: portfolio-service
            cov_min: 80
          - service: prediction-service
            cov_min: 85
          - service: analysis-service
            cov_min: 87
          - service: ai-insights-service
            cov_min: 87
          - service: chatbot-service
            cov_min: 92
          - service: journal-service
            cov_min: 76
          - service: knowledge-qa-service
            cov_min: 87
          - service: decision-helper-service
            cov_min: 86
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install service deps
        run: |
          set -e
          python -m pip install --upgrade pip
          pip install -e ./stock-common
          if [ -f services/${{ matrix.service }}/requirements.txt ]; then
            pip install -r services/${{ matrix.service }}/requirements.txt
          fi
          pip install pytest pytest-asyncio pytest-timeout pytest-cov httpx aiosqlite

      - name: Verify app.main imports cleanly
        # Smoke test: catches half-migrated configs / missing deps with a
        # one-line error rather than a confusing pytest collection failure.
        # The 2026-05-08 knowledge-qa CORS bug (settings.cors_origins missing)
        # would have surfaced here before any tests ran.
        env:
          PYTHONPATH: services/${{ matrix.service }}
        run: python -c "from app.main import app; print('app.main imports OK')"

      - name: Run pytest with coverage (skip if no tests)
        env:
          PYTHONPATH: services/${{ matrix.service }}
        run: |
          if [ -d services/${{ matrix.service }}/tests ] && \
             [ -n "$(find services/${{ matrix.service }}/tests -name 'test_*.py' -print -quit)" ]; then
            # Integration/e2e tests are excluded — they require live infra
            # (Neo4j, RabbitMQ, MySQL) that this job doesn't provision.
            # The dedicated integration-tests.yml workflow runs those with
            # docker-compose. Coverage floor below is calibrated against
            # unit-only runs accordingly.
            pytest services/${{ matrix.service }}/tests -v --tb=short \
              -m "not integration and not e2e" \
              --cov=services/${{ matrix.service }}/app \
              --cov-config=.coveragerc \
              --cov-report=term \
              --cov-report=xml:reports/coverage-${{ matrix.service }}.xml \
              --cov-fail-under=${{ matrix.cov_min }}
          else
            echo "::notice::No tests found for ${{ matrix.service }}; skipping."
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.service }}
          path: stock_microservices/reports/coverage-${{ matrix.service }}.xml
          if-no-files-found: ignore

  bandit:
    name: SAST (bandit, informational)
    runs-on: ubuntu-latest
    # Informational gate — surfaces issues without blocking PRs until the
    # SECURITY_AUDIT.md backlog is burned down. Flip to required once clean.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install bandit
        run: pip install 'bandit[toml]>=1.7.7'
      - name: Run bandit
        run: |
          bandit -r services stock-common \
            --severity-level medium \
            --confidence-level medium \
            --skip B101,B104 \
            --quiet || true

  shared-lib-tests:
    name: stock-common tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install stock-common
        run: |
          python -m pip install --upgrade pip
          pip install -e ./stock-common
          pip install pytest pytest-asyncio pytest-timeout
      - name: Run stock-common tests (if any)
        run: |
          if [ -d stock-common/tests ] && \
             [ -n "$(find stock-common/tests -name 'test_*.py' -print -quit)" ]; then
            pytest stock-common/tests -v --tb=short
          else
            echo "::notice::No tests for stock-common; skipping."
          fi
