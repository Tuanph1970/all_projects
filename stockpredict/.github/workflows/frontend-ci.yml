name: frontend-ci

on:
  push:
    branches: [main]
    paths:
      - 'stock_react_javascript/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    paths:
      - 'stock_react_javascript/**'
      - '.github/workflows/frontend-ci.yml'

defaults:
  run:
    working-directory: stock_react_javascript/stock-react-app

jobs:
  lint-and-build:
    name: Lint + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: stock_react_javascript/stock-react-app/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: ESLint (strict)
        # Backlog #28 burned the warning count to zero — any new warning
        # fails the job. Do not raise --max-warnings without an explicit
        # plan to bring it back to 0.
        run: npx eslint "src/**/*.{js,jsx}" --max-warnings 0

      - name: Production build
        # CI=true so CRA upgrades warnings to errors. Pairs with the
        # zero-warning ESLint gate above.
        env:
          CI: 'true'
        run: npm run build

  test:
    name: Tests (Jest / RTL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: stock_react_javascript/stock-react-app/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Run tests (skip cleanly if none)
        env:
          CI: 'true'
        run: |
          if find src -name '*.test.js' -o -name '*.test.jsx' | grep -q .; then
            npm test -- --watchAll=false --passWithNoTests
          else
            echo "::notice::No frontend tests yet; skipping."
          fi
