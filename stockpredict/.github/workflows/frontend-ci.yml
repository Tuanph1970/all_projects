name: frontend-ci

on:
  push:
    branches: [main]
    paths:
      - 'stock_react_javascript/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    paths:
      - 'stock_react_javascript/**'
      - '.github/workflows/frontend-ci.yml'

defaults:
  run:
    working-directory: stock_react_javascript/stock-react-app

jobs:
  lint-and-build:
    name: Lint + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: stock_react_javascript/stock-react-app/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: ESLint (informational)
        # Surfaces warnings without failing the job. Flip to required once
        # Backlog #28 brings the count to zero.
        continue-on-error: true
        run: npx eslint "src/**/*.{js,jsx}" --max-warnings 9999

      - name: Production build
        # CI=false so CRA leaves warnings as warnings rather than upgrading
        # them to errors. Once #28 is fully burned down, set CI=true here.
        env:
          CI: 'false'
        run: npm run build

  test:
    name: Tests (Jest / RTL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: stock_react_javascript/stock-react-app/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Run tests (skip cleanly if none)
        env:
          CI: 'true'
        run: |
          if find src -name '*.test.js' -o -name '*.test.jsx' | grep -q .; then
            npm test -- --watchAll=false --passWithNoTests
          else
            echo "::notice::No frontend tests yet; skipping."
          fi
